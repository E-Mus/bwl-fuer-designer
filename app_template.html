<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BWL für Designer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cg%20transform='rotate%28-14%2032%2032%29%20scale%281.05%29%20translate%28-1.5%20-1.5%29'%3E%3Crect%20x='3'%20y='16'%20width='58'%20height='32'%20rx='3'%20fill='%2377B255'%20stroke='%235C913B'%20stroke-width='2.5'/%3E%3Cellipse%20cx='32'%20cy='32'%20rx='12.5'%20ry='11'%20fill='%23E1E8ED'/%3E%3Cellipse%20cx='32'%20cy='32'%20rx='12.5'%20ry='11'%20fill='none'%20stroke='%235C913B'%20stroke-width='1.4'/%3E%3Ctext%20x='32'%20y='36'%20text-anchor='middle'%20font-family='Arial'%20font-size='11'%20font-weight='900'%20fill='%233E721D'%3EBWL%3C/text%3E%3Cpath%20d='M12%2025%20q3%203%200%206%20q-3%203%200%206'%20fill='none'%20stroke='%235C913B'%20stroke-width='1.6'%20stroke-linecap='round'/%3E%3Cpath%20d='M52%2025%20q3%203%200%206%20q-3%203%200%206'%20fill='none'%20stroke='%235C913B'%20stroke-width='1.6'%20stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E">
<style id="base">
/* ═══ NUR LAYOUT — jede Optik kommt aus den Stil-Bloecken darunter ═══ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{height:100%;display:grid;place-items:center;background:#e7e7e3;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;text-align:left}
svg{display:block}

.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
/* Inhalt liegt ueber dem Geld-Hintergrund */
.view,.quiz,.tabbar-wrap,.welcome-action{position:relative;z-index:1}
.tabbar-wrap{flex:none}
#geldgrund{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
  transition:opacity .8s ease}
.geld{position:absolute;line-height:1;will-change:transform}
.screen{padding:14px 14px 18px;display:flex;flex-direction:column;gap:11px;min-height:100%}
.screen.pad-top{padding-top:calc(14px + env(safe-area-inset-top))}
/* Restplatz gleichmaessig zwischen die Bloecke - aber nur auf Telefonhoehe.
   Auf hohen Schirmen wuerden die Abstaende sonst auseinanderfallen. */
.screen.verteilt{justify-content:space-between}
@media (min-height:880px){ .screen.verteilt{justify-content:flex-start} }

/* Tab-Leiste */
.tabbar{flex:none;display:flex;gap:6px;
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;
  padding:11px 6px;min-height:46px;text-align:center}
.tab-t{display:block;line-height:1}
/* Antippbares traegt rechts ein Chevron - sonst sieht man Zeilen nicht an, dass sie Knoepfe sind */
.tapp{position:relative}
.tapp::after{content:'\203A';position:absolute;right:14px;top:50%;transform:translateY(-52%);
  line-height:1;pointer-events:none}
.tapp:disabled::after{opacity:.35}

/* Kopf */
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex:none}
.stitle{line-height:1.05}
.ssub{line-height:1.2}

/* Statistik-Streifen */
.statstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.statcell{display:flex;flex-direction:column;gap:2px;padding:10px 11px;min-width:0}
.statnum{line-height:1;font-variant-numeric:tabular-nums}
.statlab{line-height:1.1}

/* Kacheln */
.hero{display:block;width:100%;padding:16px 17px;flex:none}
.hero-t{display:block;line-height:1.1}
.hero-s{display:block;line-height:1.3;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:none}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:5px;padding:13px 14px;min-height:78px}
.tile-t{display:block;line-height:1.15}
.tile-s{display:block;line-height:1.25}
.tile-b{display:block;line-height:1;font-variant-numeric:tabular-nums}
.tile:disabled{opacity:.4;cursor:not-allowed}

/* XP-Leiste */
.xpbar{display:flex;align-items:center;gap:9px;padding:9px 12px;flex:none}
.xptrack{flex:1;height:8px;overflow:hidden;position:relative}
.xpfill{height:100%;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xplvl{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Diagramm-Karten */
.chartcard{padding:13px 14px;flex:none}
.chart-t{display:block;line-height:1;margin-bottom:10px}
.ringwrap{display:flex;align-items:center;gap:15px}
.ringtxt{display:flex;flex-direction:column;gap:2px}
.ringnum{line-height:1;font-variant-numeric:tabular-nums}

/* Balkenzeilen */
.barrow{display:grid;grid-template-columns:1fr 72px 34px;align-items:center;gap:9px;padding:4px 0}
.barlab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bartrack{height:8px;overflow:hidden;position:relative}
.barfill{height:100%;width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.barval{text-align:right;font-variant-numeric:tabular-nums}

/* Karteikasten-Faecher */
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.boxcol{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px}
.boxn{line-height:1;font-variant-numeric:tabular-nums}
.boxl{line-height:1}

/* Heatmap */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heatd{aspect-ratio:1}

/* Chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;flex:none}
.chip{padding:7px 13px;line-height:1.1;min-height:34px}

/* Themenliste */
.tlist{display:flex;flex-direction:column;gap:2px}
.trow{display:grid;grid-template-columns:1fr 60px 40px;align-items:center;gap:9px;padding:9px 2px;width:100%}

/* Stil-Auswahl */
.styles{display:flex;flex-direction:column;gap:9px}
.stylecard{display:flex;align-items:center;gap:13px;padding:12px 13px;width:100%}
.styleprev{flex:none;width:52px;height:52px;display:grid;place-items:center;overflow:hidden;position:relative}
.styletxt{flex:1;min-width:0}
.style-t{display:block;line-height:1.15}
.style-d{display:block;line-height:1.25;margin-top:2px}

/* ═══ QUIZ (Vollbild, ohne Tab-Leiste) ═══ */
.quiz{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.qtop{flex:none;display:flex;align-items:center;gap:11px;padding:calc(11px + env(safe-area-inset-top)) 14px 11px}
.qprog{flex:1;height:7px;overflow:hidden;position:relative}
.qprogfill{height:100%;transition:width .3s}
.qprog.time .qprogfill{transition:width 1s linear}
.qcount{font-variant-numeric:tabular-nums;white-space:nowrap}
.qbody{flex:1;min-height:0;overflow-y:auto;padding:0 14px 8px;display:flex;flex-direction:column;gap:10px}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:none}
.qtag{padding:3px 9px;line-height:1.2;white-space:nowrap}
.qtext{line-height:1.35}
.qhint{line-height:1.3}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:11px;align-items:center;width:100%;padding:12px 13px;min-height:46px}
.opts.dense .opt{padding:9px 12px;min-height:38px;gap:9px}
.opt-k{flex:none;width:25px;height:25px;display:grid;place-items:center;line-height:1}
.opts.dense .opt-k{width:22px;height:22px}
.opt-t{flex:1;min-width:0;line-height:1.25}
.fb{padding:12px 13px}
.fb-v{display:block;line-height:1.2;margin-bottom:4px}
.fb-p{line-height:1.35}
.fb-q{display:block;margin-top:6px;line-height:1.2}
.qact{flex:none;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.btn{flex:1;padding:14px;text-align:center;min-height:48px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.narrow{flex:0 0 auto;padding-left:19px;padding-right:19px}

/* Ergebnis */
.res-hero{padding:20px 16px;text-align:center;flex:none}
.res-num{line-height:1;font-variant-numeric:tabular-nums}
.res-sub{line-height:1.3;margin-top:6px}
.rev{display:flex;flex-direction:column}
.rev details{padding:9px 0}
.rev summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:flex-start;line-height:1.3}
.rev summary::-webkit-details-marker{display:none}
.rev-b{padding:8px 0 2px 20px;display:flex;flex-direction:column;gap:4px;line-height:1.35}

/* Spielereien */
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.85);opacity:0;
  padding:10px 18px;pointer-events:none;z-index:60;white-space:nowrap;
  transition:opacity .18s, transform .18s cubic-bezier(.2,1.6,.4,1)}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#konfetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.kf{position:absolute;width:9px;height:14px;will-change:transform,opacity}
@keyframes kfall{
  0%{transform:translate3d(0,0,0) rotate(0);opacity:1}
  100%{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot));opacity:.15}
}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.pulse{animation:pop .34s cubic-bezier(.2,1.4,.4,1)}
@media (prefers-reduced-motion:reduce){
  .kf,.pulse{animation:none!important}
  .xpfill,.barfill,.qprogfill{transition:none}
}
</style>
<style id="stile">__STILE__</style>
</head>
<body>
<div class="app" id="app" data-style="editorial" data-bwl="0">
  <div id="geldgrund" aria-hidden="true"></div>
  <div id="konfetti" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script id="fragen-data" type="application/json">__FRAGEN__</script>
<script id="meme-data" type="application/json">__MEMES__</script>
<script>
"use strict";

const FRAGEN = JSON.parse(document.getElementById('fragen-data').textContent);
const MEMES = JSON.parse(document.getElementById('meme-data').textContent);
const MEME_NACH_TERM = new Map(MEMES.map(m=>[m.term,m]));
const MEME_FALLBACK = {
  'Grundlagen der BWL':'unternehmen',
  'Rechtsformen':'unternehmen',
  'Urheber- und Nutzungsrecht':'eigentum',
  'Businessplan und Gründung':'investor',
  'Steuern':'steuer',
  'Rechnungen und E-Rechnung':'rechnung',
  'Angebot, Vertrag und Briefing':'vertrag',
  'Kalkulation und Liquidität':'kalkulation',
  'Marketing':'marketing',
  'Projektmanagement':'leistung',
  'Personal, Motivation und Lob':'leistung',
  'Geld, Finanzen und Altersvorsorge':'vermögen',
  'Unternehmensrecherche und Jahresabschluss':'unternehmen'
};
const PRUEFUNGS_LAENGE = 40, PRUEFUNGS_ZEIT = 40*60, BLITZ_ZEIT = 60;
const LS='bwl-v3', LS_SET='bwl-einstellungen';
const LS_WILLKOMMEN='bwl-willkommen-v2';
const TAG=86400000;
// Sofort-Wiedervorlage: falsch beantwortete Fragen kommen im SELBEN Durchgang wieder.
// Beim Pauken bringt das mehr als Tagesintervalle - die greifen vor der Pruefung nicht mehr.
const WV_ABSTAND=[6,12];              // erste Wiederholung nach 6, zweite nach 12 Fragen
const WV_MODI=new Set(['fehler','thema','alle']);

// Globale Einstellungen - gelten fuer ALLE Uebungsmodi
const EINST_VERSION = 3;
const EINST_STD = {
  umfang:'essential',
  schwierigkeit:'gemischt',
  zeitlimit:true,
  pruefung:'2026-07-29',
  version:EINST_VERSION
};
let einst = (()=>{
  let gespeichert={};
  try{ gespeichert=JSON.parse(localStorage.getItem(LS_SET))||{}; }catch(e){}
  if(gespeichert.version!==EINST_VERSION){
    const alt=gespeichert.schwierigkeit;
    gespeichert.umfang=(alt==='essential'||alt==='alle')
      ? alt
      : ['leicht','mittel','schwer'].includes(alt)
        ? 'alle'
        : 'essential';
    gespeichert.schwierigkeit=['leicht','mittel','schwer'].includes(alt)?alt:'gemischt';
    gespeichert.version=EINST_VERSION;
  }
  const wert=Object.assign({}, EINST_STD, gespeichert);
  delete wert.bwlTest;                 // frueher gespeicherter Testwert
  if(!['essential','wiederholung','alle'].includes(wert.umfang)) wert.umfang='essential';
  if(!['gemischt','leicht','mittel','schwer'].includes(wert.schwierigkeit)) wert.schwierigkeit='gemischt';
  try{localStorage.setItem(LS_SET,JSON.stringify(wert))}catch(e){}
  return wert;
})();
function setzeEinst(k,v){ einst[k]=v; try{localStorage.setItem(LS_SET,JSON.stringify(einst))}catch(e){} }

const stil='editorial';
function setzeStil(){
  document.getElementById('app').dataset.style=stil;
}

let willkommenOffen=(()=>{
  try{
    return !localStorage.getItem(LS_WILLKOMMEN);
  }catch(e){ return true }
})();
let onboardingRecht=null;

FRAGEN.forEach(f=>{
  f.multi=Array.isArray(f.richtig);
  f.richtigSet=new Set(f.multi?f.richtig:[f.richtig]);
  f.strikt=f.schwierigkeit==='schwer';
});

/* ───────── Speicher ───────── */
function laden(){
  try{const s=JSON.parse(localStorage.getItem(LS));
    if(s&&s.stats) return Object.assign({stats:{},versuche:[],rekorde:{},tage:{},xp:0},s);
  }catch(e){}
  return {stats:{},versuche:[],rekorde:{},tage:{},xp:0};
}
function sichern(){try{localStorage.setItem(LS,JSON.stringify(stand))}catch(e){}}
let stand=laden();

const datumLokal=d=>{
  const z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
};
const heute=()=>datumLokal(new Date());
function statFuer(id){
  if(!stand.stats[id]) stand.stats[id]={gesehen:0,richtig:0,falsch:0,zuletzt:null};
  return stand.stats[id];
}
// Vier Zustaende statt Karteikasten-Faecher
function status(f){
  const s=stand.stats[f.id];
  if(!s||!s.gesehen) return 'neu';
  if(s.zuletzt==='falsch') return 'falsch';
  return (s.richtig>=2 && s.falsch===0) ? 'sitzt' : 'wackelig';
}
function merkeAntwort(id,punkte,schwierigkeit){
  const st=statFuer(id), voll=punkte>=1;
  st.gesehen++;
  if(voll){st.richtig++;st.zuletzt='richtig';}
  else{st.falsch++;st.zuletzt='falsch';}
  const d=heute();
  if(!stand.tage[d]) stand.tage[d]={n:0,ok:0};
  stand.tage[d].n++; if(voll) stand.tage[d].ok++;
  stand.xp=(stand.xp||0)+Math.round(punkte*(schwierigkeit==='schwer'?18:schwierigkeit==='mittel'?12:8));
  sichern();
}
const LVL=xp=>Math.floor(Math.sqrt((xp||0)/40))+1;
const LVL_XP=l=>Math.pow(l-1,2)*40;
function fehlerIds(){return basis().filter(f=>stand.stats[f.id]&&stand.stats[f.id].zuletzt==='falsch').map(f=>f.id)}
const ungesehen=()=>basis().filter(f=>status(f)==='neu');
const luecken=()=>basis().filter(f=>{const st=status(f);return st==='falsch'||st==='wackelig'});
function statusVerteilung(pool=basis()){
  const v={neu:0,falsch:0,wackelig:0,sitzt:0};
  pool.forEach(f=>v[status(f)]++);
  return v;
}
function statusTabelle(v){
  return `<div class="boxes status-boxes" style="grid-template-columns:repeat(4,1fr)">
    <div class="boxcol" data-state="falsch"><span class="boxn">${v.falsch}</span><span class="boxl">Falsch</span></div>
    <div class="boxcol" data-state="wackelig"><span class="boxn">${v.wackelig}</span><span class="boxl">Wackelt</span></div>
    <div class="boxcol" data-state="neu"><span class="boxn">${v.neu}</span><span class="boxl">Neu</span></div>
    <div class="boxcol" data-state="sitzt"><span class="boxn">${v.sitzt}</span><span class="boxl">Sitzt</span></div>
  </div>`;
}
function statusBalken(v,{kompakt=false}={}){
  const ges=v.falsch+v.wackelig+v.neu+v.sitzt||1;
  const segment=(status,n)=>`<span class="status-segment" data-state="${status}"
    style="width:${(n/ges*100).toFixed(4)}%" title="${n}"></span>`;
  return `<div class="status-progress${kompakt?' compact':''}" role="img"
      aria-label="${v.falsch} falsch, ${v.wackelig} wackelt, ${v.neu} neu, ${v.sitzt} sitzt">
      ${segment('falsch',v.falsch)}${segment('wackelig',v.wackelig)}
      ${segment('sitzt',v.sitzt)}${segment('neu',v.neu)}
    </div>`;
}
function rekord(k,w){
  if(!stand.rekorde) stand.rekorde={};
  if(!stand.rekorde[k]||w>stand.rekorde[k]){stand.rekorde[k]=w;sichern();return true}
  return false;
}
function beherrscht(){return basis().filter(f=>status(f)==='sitzt').length}
function gesehenZahl(){return basis().filter(f=>status(f)!=='neu').length}
// Tage bis zur Pruefung
function tageBis(){
  if(!einst.pruefung) return null;
  const heut=new Date(); heut.setHours(0,0,0,0);
  const p=new Date(einst.pruefung+'T00:00:00');
  return Math.round((p-heut)/TAG);
}

/* ───────── Hilfen ───────── */
function mische(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function entdoppleFamilien(pool){
  const g=new Set();
  return pool.filter(f=>{if(!f.familie)return true;if(g.has(f.familie))return false;g.add(f.familie);return true});
}
function gewichtet(pool,n){
  const b=pool.map(f=>{
    const s=stand.stats[f.id]; let g=1;
    if(!s||s.gesehen===0)g=3; else if(s.zuletzt==='falsch')g=4; else if(s.richtig>=2)g=.45;
    return{f,s:Math.random()/g};
  });
  b.sort((x,y)=>x.s-y.s);
  return b.slice(0,n).map(x=>x.f);
}
function themen(pool=FRAGEN){
  const m=new Map();pool.forEach(f=>m.set(f.thema,(m.get(f.thema)||0)+1));
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'de'));
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function bewerte(f,gew){
  const g=new Set(gew);
  if(!f.multi) return g.has(f.richtig)?1:0;
  let t=0,x=0; g.forEach(i=>f.richtigSet.has(i)?t++:x++);
  const alle=t===f.richtigSet.size&&x===0;
  if(f.strikt) return alle?1:0;
  if(alle) return 1;
  return Math.max(0,Math.min(1,(t-x)/f.richtigSet.size));
}
function themaQuote(t,pool=FRAGEN){
  const ids=pool.filter(f=>f.thema===t);
  const ok=ids.filter(f=>{const s=stand.stats[f.id];return s&&s.zuletzt==='richtig'}).length;
  return {ok,n:ids.length,pct:ids.length?Math.round(ok/ids.length*100):0};
}

/* ───────── Spielereien ───────── */
let toastTimer=null;
function toast(txt){
  const el=document.getElementById('toast');
  el.textContent=geldText(txt); el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1100);
}

/* ───────── Verbwlerung ─────────
   Ein einziger Wert (0 bis 1) steuert Sprache, Hintergrund und Extras.
   Er waechst mit dem Anteil gemeisterter Fragen und der Menge richtiger Antworten. */
const BWL_STUFEN=[
  {rolle:'Mensch',            kurz:'Mensch'},
  {rolle:'Praktikum, unbezahlt', kurz:'Praktikum'},
  {rolle:'Junior Consultant', kurz:'Junior'},
  {rolle:'Senior Consultant', kurz:'Senior'},
  {rolle:'Head of Synergy',   kurz:'Head of'},
  {rolle:'Chief Value Officer', kurz:'C-Level'}
];
const BWL_SCHWELLEN=[0,.06,.18,.36,.58,.82];
const BWL_MAX=BWL_STUFEN.length-1;
function bwlWert(){
  const pool=basis();
  const anteil=pool.length?pool.filter(f=>status(f)==='sitzt').length/pool.length:0;
  let richtigGesamt=0;
  for(const id in stand.stats) richtigGesamt+=stand.stats[id].richtig||0;
  const menge=Math.min(1,richtigGesamt/150);
  return Math.max(0,Math.min(1,anteil*.65+menge*.35));
}
function bwlStufeAuto(w=bwlWert()){
  let s=0;
  BWL_SCHWELLEN.forEach((g,i)=>{ if(w>=g) s=i });
  return s;
}
// Nur zum Ausprobieren von der Konsole aus: bwlTest=5; zeichne()

// Deterministischer Zufall: der Hintergrund darf beim Neuzeichnen nicht springen.
function rng(seed){
  let s=seed>>>0;
  return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296 };
}
const GELD_MAX=120;
const GELD_ANZAHL=[0,14,30,52,80,120];
const GELD_DECKUNG=[0,.05,.085,.13,.19,.27];
function geldAufbauen(){

  for(let i=0;i<GELD_MAX;i++){

    html+=`<span class="geld" style="left:${(r()*98).toFixed(2)}%;top:${(r()*98).toFixed(2)}%;`
      +`font-size:${(13+r()*44).toFixed(0)}px;`
      +`transform:rotate(${(r()*54-27).toFixed(1)}deg);`
      +`opacity:${(.45+r()*.55).toFixed(2)}">${z}</span>`;
  }
  box.innerHTML=html;
}
/* Die Waehrung frisst die Schrift auf: E wird zum Euro, S zum Dollar — Stufe um
   Stufe mehr davon. Laeuft ueber die Textknoten, damit Auszeichnung, Attribute
   und aria-Label unangetastet bleiben. Die Daten aendert das nie; bei jedem
   Neuzeichnen wird aus der Quelle frisch aufgebaut.
   Ausgenommen bleibt alles Rechtliche: die beiden Seiten, ihre Verweise (die
   muessen als "Datenschutz" und "Impressum" lesbar bleiben) und der
   Willkommenstext, der die Speicherung erklaert. Dazu der Lerninhalt bis
   Stufe 4. */
const OHNE_GELD='.legal-page,.legal-links,.welcome-screen';
const GELD_ANTEIL=[0,0,.12,.3,.6,1];
// Welche Buchstaben getroffen werden, haengt am Textinhalt - derselbe Satz wird
// also immer gleich verzerrt und flackert beim Neuzeichnen nicht.
function geldText(text,anteil=GELD_ANTEIL[bwlStufe()]){
  const t=String(text);
  if(!anteil) return t;
  let h=0;
  for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0;
  let n=0;
  return t.replace(/[eEsS]/g,z=>{
    const r=(((h+(++n)*2654435761)>>>0)%1000)/1000;
    return r<anteil ? (z==='e'||z==='E'?'€':'$') : z;
  });
}
function geldSchrift(){
  const stufe=bwlStufe(), anteil=GELD_ANTEIL[stufe];
  if(!anteil) return;
  const auchLerninhalt=stufe>=BWL_MAX;
  const lauf=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);
  const knoten=[];
  while(lauf.nextNode()) knoten.push(lauf.currentNode);
  knoten.forEach(n=>{
    const el=n.parentElement;
    if(!el || el.closest(OHNE_GELD)) return;
    if(!auchLerninhalt && el.closest('[data-lerninhalt]')) return;
    const neu=geldText(n.nodeValue,anteil);
    if(neu!==n.nodeValue) n.nodeValue=neu;
  });
}
function setzeBwl(){
  const s=bwlStufe();
  app.dataset.bwl=s;
  geldAufbauen();
  const box=document.getElementById('geldgrund');
  if(!box) return;
  box.style.opacity=GELD_DECKUNG[s];

}

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="ringsvg"
    aria-hidden="true" focusable="false">
    <circle class="ringbg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="2"/>
    <circle class="ringfg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="2"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="butt"/>
  </svg>`;
}
function verlauf(werte,w=280,h=54){
  if(werte.length<2) return `<div class="leer">Noch keine abgeschlossenen Lernrunden.</div>`;
  const max=100, dx=w/(werte.length-1);
  const pts=werte.map((v,i)=>[i*dx, h-4-(v/max)*(h-10)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const flaeche=d+` L ${w} ${h} L 0 ${h} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"
    class="linesvg" aria-hidden="true" focusable="false">
    <path class="linefill" d="${flaeche}"/>
    <path class="linestroke" d="${d}" fill="none" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"/>
    ${pts.slice(-1).map(p=>`<circle class="linedot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/>`).join('')}
  </svg>`;
}
function heatmap(){
  const tage=[];
  for(let i=13;i>=0;i--){
    const d=datumLokal(new Date(Date.now()-i*TAG));
    const e=stand.tage[d];
    tage.push({d,n:e?e.n:0});
  }
  const max=Math.max(1,...tage.map(t=>t.n));
  return `<div class="heat">${tage.map(t=>{
    const lv=t.n===0?0:Math.min(4,Math.ceil(t.n/max*4));
    return `<div class="heatd" data-lv="${lv}" title="${t.d}: ${t.n} Fragen"></div>`;
  }).join('')}</div>`;
}

function basis(){
  const pool=umfangPool();
  if(einst.schwierigkeit==='gemischt') return pool;
  return pool.filter(f=>f.schwierigkeit===einst.schwierigkeit);
}
const umfangName = s => s==='wiederholung'
  ? 'Wiederholung'
  : s==='alle'
    ? 'Alles'
    : 'Essential';
const stufeName = s => s==='gemischt' ? 'Gemischt' : s[0].toUpperCase()+s.slice(1);

function starte(modus,opt={}){
  stopTicker();
  let pool,titel='',endlos=false,zeit=0;
  const B=basis();
  if(modus==='pruefung'){
    const p=entdoppleFamilien(mische(B));
    pool=gewichtet(p,Math.min(PRUEFUNGS_LAENGE,p.length)); titel='Prüfung';
    if(einst.zeitlimit) zeit=PRUEFUNGS_ZEIT;
  }else if(modus==='lernen'){
    const neu=mische(B.filter(f=>status(f)==='neu'));
    const luecke=mische(B.filter(f=>{const s=status(f);return s==='falsch'||s==='wackelig'}));
    const sicher=mische(B.filter(f=>status(f)==='sitzt'));
    pool=entdoppleFamilien(neu.concat(luecke,sicher)).slice(0,10); titel='Lernen';
  }else if(modus==='thema'){
    pool=mische(B.filter(f=>f.thema===opt.thema)); titel=opt.thema;
  }else if(modus==='fehler'){
    const ids=new Set(fehlerIds()); pool=mische(B.filter(f=>ids.has(f.id))); titel='Fehler';
  }else if(modus==='fehlerAlle'){
    pool=mische(luecken()); titel='Lücken';
  }else if(modus==='blitz'){
    pool=mische(B); titel='Blitz'; zeit=BLITZ_ZEIT; endlos=true;
  }else{pool=mische(B); titel='Alle'}

  if(!pool.length){toast('Keine Fragen für diese Auswahl');return}
  sitzung={modus,titel,endlos,fragen:pool.map(f=>({frage:f,reihenfolge:mische(f.optionen.map((_,i)=>i)),noetig:0})),
    i:0,gewaehlt:new Set(),aufgedeckt:false,punkte:0,antworten:[],serie:0,besteSerie:0,
    zeitGesamt:zeit,zeitRest:zeit,fertig:false,xpVor:stand.xp||0,erstmalig:pool.length,wdh:0};
  if(zeit){
    ticker=setInterval(()=>{
      if(!sitzung||sitzung.fertig){stopTicker();return}
      sitzung.zeitRest--;
      if(sitzung.zeitRest<=0){zeitAbgelaufen();return}
      uhrAktualisieren();
    },1000);
  }
  zeichne();
}
const sofort=()=>sitzung.modus!=='pruefung';
const aktuelle=()=>sitzung.fragen[sitzung.i%sitzung.fragen.length];

function waehle(pos){
  if(sitzung.aufgedeckt)return;
  const f=aktuelle().frage;
  if(f.multi){
    sitzung.gewaehlt.has(pos)?sitzung.gewaehlt.delete(pos):sitzung.gewaehlt.add(pos);
    zeichne();
  }else{
    sitzung.gewaehlt=new Set([pos]);
    sofort()?decke():zeichne();
  }
}
// Falsche Frage kommt im selben Durchgang wieder - erst nach 6, dann nach 12 Fragen.
function wiedervorlage(e,p){
  if(!WV_MODI.has(sitzung.modus)) return;
  let noetig = e.noetig||0;
  if(p<1) noetig = 2;                 // falsch: muss zweimal sitzen
  else if(noetig>0) noetig -= 1;      // Wiederholung richtig: einmal weniger noetig
  else return;
  if(noetig<=0) return;
  const abstand = WV_ABSTAND[noetig===2?0:1];
  const pos = Math.min(sitzung.i+abstand, sitzung.fragen.length);
  sitzung.fragen.splice(pos,0,{
    frage:e.frage, reihenfolge:mische(e.frage.optionen.map((_,k)=>k)), noetig, wdh:true
  });
  sitzung.wdh++;
}

function decke(){
  const e=aktuelle(), echt=[...sitzung.gewaehlt].map(p=>e.reihenfolge[p]);
  const p=bewerte(e.frage,echt);
  sitzung.aufgedeckt=true; sitzung.punkte+=p;
  sitzung.antworten.push({id:e.frage.id,punkte:p,gewaehlt:echt,wdh:!!e.wdh});
  // Spruch und Zitat einmal beim Aufdecken ziehen, damit sie beim Neuzeichnen stehen bleiben.
  sitzung.spruch=feedbackSatire(p);
  sitzung.zitat=sitzung.antworten.length%ZITAT_ABSTAND===0?zitatZiehen():null;
  merkeAntwort(e.frage.id,p,e.frage.schwierigkeit);
  wiedervorlage(e,p);
  if(p>=1){
    sitzung.serie++; sitzung.besteSerie=Math.max(sitzung.besteSerie,sitzung.serie);
    if(sitzung.serie>0&&sitzung.serie%5===0)
      toast(satireStufe('serie').replace('${n}',sitzung.serie));
  }else sitzung.serie=0;
  if(sitzung.modus==='blitz'){zeichne();setTimeout(()=>{if(sitzung&&!sitzung.fertig)weiter()},680);return}
  zeichne();
}
function zeitAbgelaufen(){
  if(!sitzung||sitzung.fertig)return;
  sitzung.zeitRest=0;
  // Eine im Moment des Timeouts gewaehlte Antwort zaehlt noch zur Pruefung.
  if(sitzung.modus==='pruefung'&&!sitzung.aufgedeckt&&sitzung.gewaehlt.size){
    const e=aktuelle(), echt=[...sitzung.gewaehlt].map(p=>e.reihenfolge[p]);
    const p=bewerte(e.frage,echt);
    sitzung.punkte+=p;
    sitzung.antworten.push({id:e.frage.id,punkte:p,gewaehlt:echt,wdh:false});
    merkeAntwort(e.frage.id,p,e.frage.schwierigkeit);
  }
  ergebnis();
}
function weiter(){
  if(!sitzung.aufgedeckt){
    if(!sitzung.gewaehlt.size)return;
    decke();
    if(sofort())return;
  }
  if(!sitzung.endlos&&sitzung.i>=sitzung.fragen.length-1){ergebnis();return}
  sitzung.i++;
  if(sitzung.endlos&&sitzung.i>=sitzung.fragen.length){
    sitzung.fragen=mische(basis()).map(f=>({frage:f,reihenfolge:mische(f.optionen.map((_,i)=>i))}));
    sitzung.i=0;
  }
  sitzung.gewaehlt=new Set(); sitzung.aufgedeckt=false;
  zeichne();
}
function ergebnis(){
  stopTicker(); sitzung.fertig=true; sitzung.endzitat=zitatZiehen();
  // Gewertet wird der ERSTE Versuch je Frage - Wiedervorlagen wuerden die Quote sonst schoenrechnen
  const erst=sitzung.antworten.filter(a=>!a.wdh);
  const n=erst.length, gesamt=sitzung.modus==='pruefung'?sitzung.erstmalig:n;
  const voll=erst.filter(a=>a.punkte>=1).length;
  if(sitzung.modus==='blitz') sitzung.neu=rekord('blitz',voll);
  sitzung.serieRekord=rekord('serie',sitzung.besteSerie);
  const pErst=erst.reduce((x,a)=>x+a.punkte,0);
  if(gesamt) stand.versuche.push({modus:sitzung.modus,punkte:Math.round(pErst*10)/10,gesamt,ts:Date.now()});
  if(stand.versuche.length>80) stand.versuche=stand.versuche.slice(-80);
  sichern();
  zeichne();
  const quote=gesamt?pErst/gesamt:0;
  if(sitzung.neu||sitzung.serieRekord||quote>=.9){
    setTimeout(()=>monetenregen(sitzung.neu?110:70,{banknote:quote>=1}),260);
  }
}

function ubenDaten(){
  const B=basis(), offen=ungesehen().length, ges=gesehenZahl(), luk=luecken().length;
  const sitzt=beherrscht();
  const v=statusVerteilung(B);
  const fehler=fehlerIds().length, r=stand.rekorde||{}, d=stand.tage[heute()];
  const tage=tageBis();
  const ziel=(tage!==null&&tage>0&&offen>0)?Math.ceil(offen/tage):0;
  const heuteN=d?d.n:0;
  const tagesBasis=ziel||Math.max(1,B.length);
  return {B,offen,ges,luk,sitzt,v,fehler,r,heuteN,tage,ziel,
    tagesPct:Math.min(100,Math.round(heuteN/tagesBasis*100)),
    countdown: tage===null?'LVL '+LVL(stand.xp||0)
      : tage>1?'NOCH '+tage+' TAGE' : tage===1?'MORGEN' : tage===0?'HEUTE' : 'LVL '+LVL(stand.xp||0)};
}

// Kurze Kernaussage; die vollstaendige Begruendung bleibt ueber den Info-Button erreichbar.
function kernsatz(t){
  const sauber=String(t).replace(/\*\*/g,'').replace(/\s+/g,' ').trim();
  const m=sauber.match(/^(.{0,120}?[.!?])(\s|$)/);
  if(m) return m[1];
  if(sauber.length<=120) return sauber;
  return sauber.slice(0,117).replace(/\s+\S*$/,'').trim()+'…';
}

function zeichneErgebnis(){

  const offen=Math.max(0,gesamt-n), voll=erst.filter(a=>a.punkte>=1).length;
  const pErst=erst.reduce((x,a)=>x+a.punkte,0);
  const pkt=Math.round(pErst*10)/10, pct=gesamt?Math.round(pErst/gesamt*100):0;
  const xpNeu=(stand.xp||0)-sitzung.xpVor;
  // Ab Stufe 3 wird die Wissensdividende in eine erfundene Waehrung umgerechnet.
  const k=xpKurs();
  const kurs=bwlStufe()>=ZITAT_AB
    ? ` ≙ ${(xpNeu*k).toFixed(2).replace('.',',')} Shareholder Value`

  const stempel=pct===100?T('stempelTop'):pct>=60?T('stempelOk'):T('stempelBad');

  else{gross=pkt+' / '+gesamt;unter=`${pct} % · ${voll} vollständig richtig${offen?' · '+offen+' offen':''}`}

  const proThema={};
  erst.forEach(a=>{
    const f=FRAGEN.find(x=>x.id===a.id);
    const t=proThema[f.thema]||(proThema[f.thema]={p:0,n:0});
    t.n++;t.p+=a.punkte;
  });
  const falsch=erst.filter(a=>a.punkte<1);

  setzeInhalt(`<div class="quiz">

      <div class="res-hero">
        <div class="res-report">${esc(T('ergebnisKopf'))}</div>

          title="Satirischer Prüfvermerk">${esc(stempel)}</div>

        <div class="res-sub">${unter}</div>

        <div class="res-closing">${abschluss}</div>
        ${zitatHtml(sitzung.endzitat)}
      </div>
      <div class="chartcard">
        <span class="chart-t">${esc(T('nachThema'))}</span>
        ${Object.entries(proThema).sort((a,b)=>a[0].localeCompare(b[0],'de')).map(([t,v])=>{
          const q=Math.round(v.p/v.n*100);
          return `<div class="topic-stat">
            <div class="topic-stat-head"><span class="barlab">${esc(t)}</span>
              <span class="barval">${Math.round(v.p*10)/10}/${v.n}</span></div>
            <div class="bartrack"><div class="barfill" data-w="${q}"></div></div>
          </div>`;
        }).join('')}
      </div>
      ${falsch.length?`<div class="chartcard rev" data-lerninhalt>
        <span class="chart-t">Zu wiederholen (${falsch.length})</span>
        ${falsch.map(a=>{
          const f=FRAGEN.find(x=>x.id===a.id);
          const rt=[...f.richtigSet].map(i=>f.optionen[i]);
          const dein=a.gewaehlt.length?a.gewaehlt.map(i=>f.optionen[i]):['nichts gewählt'];
          return `<details><summary><span class="mark" data-t="${a.punkte>0?'teil':'bad'}">${a.punkte>0?'~':'✕'}</span><span>${md(f.frage)}</span></summary>
            <div class="rev-b">
              <span>Deine Antwort: ${dein.map(md).join(' · ')}</span>
              <span>Richtig: <b>${rt.map(md).join(' · ')}</b></span>
              <span>${md(f.erklaerung)}</span>
            </div></details>`;
        }).join('')}
      </div>`:''}
    </div>
    <div class="qact">
      ${falsch.length?`<button class="btn btn-ghost narrow" data-fehler>${esc(T('fehler'))} üben</button>`:''}
      <button class="btn btn-primary" data-home>Fertig</button>
    </div>
  </div>`);

  app.querySelector('[data-home]').onclick=()=>{sitzung=null;tab='ueben';zeichne()};
  const fb=app.querySelector('[data-fehler]');
  if(fb) fb.onclick=()=>starte('fehler');

  app.querySelectorAll('[data-schwer]').forEach(b=>b.onclick=()=>{
    setzeEinst('schwierigkeit',b.dataset.schwer); zeichne(); toast(stufeName(einst.schwierigkeit));
  });
  app.querySelectorAll('[data-zeit]').forEach(b=>b.onclick=()=>{
    setzeEinst('zeitlimit',b.dataset.zeit==='1'); zeichne();
  });
  const tm=app.querySelector('[data-termin]');
  if(tm) tm.onclick=()=>{
    const v=prompt('Prüfungstermin (JJJJ-MM-TT)', einst.pruefung||'');
    const wert=v&&v.trim(), datum=wert&&new Date(wert+'T00:00:00');
    if(wert && /^\d{4}-\d{2}-\d{2}$/.test(wert) && !Number.isNaN(datum.getTime()) && datumLokal(datum)===wert){
      setzeEinst('pruefung',wert); zeichne();
    }
    else if(v!==null) toast('Format: 2026-07-29');
  };
  const tw=app.querySelector('[data-termin-weg]');
  if(tw) tw.onclick=()=>{ setzeEinst('pruefung',''); zeichne(); };
  const r=app.querySelector('[data-reset]');
  if(r) r.onclick=()=>{
    if(confirm('Allen Fortschritt löschen? Auch Rekorde, XP und Karteikasten.')){
      stand={stats:{},versuche:[],rekorde:{},tage:{},xp:0}; sichern(); zeichne();
    }
  };
  const rn=app.querySelector('[data-count]');
  if(rn) zaehlHoch(rn,+rn.dataset.count);
}
function animiereBalken(){
  requestAnimationFrame(()=>{
    app.querySelectorAll('[data-w]').forEach(el=>{el.style.width=el.dataset.w+'%'});
  });
}

document.addEventListener('keydown',ev=>{
  if(!sitzung||sitzung.fertig)return;
  const f=aktuelle().frage;
  if(/^[0-9]$/.test(ev.key)){
    const pos=ev.key==='0'?9:+ev.key-1;
    if(pos<f.optionen.length){ev.preventDefault();waehle(pos)}
  }else if(ev.key==='Enter'||ev.key===' '){
    if(sitzung.gewaehlt.size||sitzung.aufgedeckt){ev.preventDefault();weiter()}
  }else if(ev.key==='Escape'){stopTicker();sitzung=null;zeichne()}
});

setzeStil();
zeichne();
</script>
