<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BWL für Designer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Arial' font-size='42' font-weight='900' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E">
<style id="base">
/* ═══ NUR LAYOUT — jede Optik kommt aus den Stil-Bloecken darunter ═══ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{height:100%;display:grid;place-items:center;background:#e7e7e3;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;text-align:left}
svg{display:block}

.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
/* Inhalt liegt ueber dem Geld-Hintergrund */
.view,.quiz,.tabbar,.welcome-action{position:relative;z-index:1}
#geldgrund{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
  transition:opacity .8s ease}
.geld{position:absolute;line-height:1;will-change:transform}
.screen{padding:14px 14px 18px;display:flex;flex-direction:column;gap:11px;min-height:100%}
.screen.pad-top{padding-top:calc(14px + env(safe-area-inset-top))}
/* Restplatz gleichmaessig zwischen die Bloecke - aber nur auf Telefonhoehe.
   Auf hohen Schirmen wuerden die Abstaende sonst auseinanderfallen. */
.screen.verteilt{justify-content:space-between}
@media (min-height:880px){ .screen.verteilt{justify-content:flex-start} }

/* Tab-Leiste */
.tabbar{flex:none;display:flex;gap:6px;
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;
  padding:11px 6px;min-height:46px;text-align:center}
.tab-t{display:block;line-height:1}
/* Antippbares traegt rechts ein Chevron - sonst sieht man Zeilen nicht an, dass sie Knoepfe sind */
.tapp{position:relative}
.tapp::after{content:'\203A';position:absolute;right:14px;top:50%;transform:translateY(-52%);
  line-height:1;pointer-events:none}
.tapp:disabled::after{opacity:.35}

/* Kopf */
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex:none}
.stitle{line-height:1.05}
.ssub{line-height:1.2}

/* Statistik-Streifen */
.statstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.statcell{display:flex;flex-direction:column;gap:2px;padding:10px 11px;min-width:0}
.statnum{line-height:1;font-variant-numeric:tabular-nums}
.statlab{line-height:1.1}

/* Kacheln */
.hero{display:block;width:100%;padding:16px 17px;flex:none}
.hero-t{display:block;line-height:1.1}
.hero-s{display:block;line-height:1.3;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:none}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:5px;padding:13px 14px;min-height:78px}
.tile-t{display:block;line-height:1.15}
.tile-s{display:block;line-height:1.25}
.tile-b{display:block;line-height:1;font-variant-numeric:tabular-nums}
.tile:disabled{opacity:.4;cursor:not-allowed}

/* XP-Leiste */
.xpbar{display:flex;align-items:center;gap:9px;padding:9px 12px;flex:none}
.xptrack{flex:1;height:8px;overflow:hidden;position:relative}
.xpfill{height:100%;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xplvl{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Diagramm-Karten */
.chartcard{padding:13px 14px;flex:none}
.chart-t{display:block;line-height:1;margin-bottom:10px}
.ringwrap{display:flex;align-items:center;gap:15px}
.ringtxt{display:flex;flex-direction:column;gap:2px}
.ringnum{line-height:1;font-variant-numeric:tabular-nums}

/* Balkenzeilen */
.barrow{display:grid;grid-template-columns:1fr 72px 34px;align-items:center;gap:9px;padding:4px 0}
.barlab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bartrack{height:8px;overflow:hidden;position:relative}
.barfill{height:100%;width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.barval{text-align:right;font-variant-numeric:tabular-nums}

/* Karteikasten-Faecher */
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.boxcol{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px}
.boxn{line-height:1;font-variant-numeric:tabular-nums}
.boxl{line-height:1}

/* Heatmap */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heatd{aspect-ratio:1}

/* Chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;flex:none}
.chip{padding:7px 13px;line-height:1.1;min-height:34px}

/* Themenliste */
.tlist{display:flex;flex-direction:column;gap:2px}
.trow{display:grid;grid-template-columns:1fr 60px 40px;align-items:center;gap:9px;padding:9px 2px;width:100%}

/* Stil-Auswahl */
.styles{display:flex;flex-direction:column;gap:9px}
.stylecard{display:flex;align-items:center;gap:13px;padding:12px 13px;width:100%}
.styleprev{flex:none;width:52px;height:52px;display:grid;place-items:center;overflow:hidden;position:relative}
.styletxt{flex:1;min-width:0}
.style-t{display:block;line-height:1.15}
.style-d{display:block;line-height:1.25;margin-top:2px}

/* ═══ QUIZ (Vollbild, ohne Tab-Leiste) ═══ */
.quiz{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.qtop{flex:none;display:flex;align-items:center;gap:11px;padding:calc(11px + env(safe-area-inset-top)) 14px 11px}
.qprog{flex:1;height:7px;overflow:hidden;position:relative}
.qprogfill{height:100%;transition:width .3s}
.qprog.time .qprogfill{transition:width 1s linear}
.qcount{font-variant-numeric:tabular-nums;white-space:nowrap}
.qbody{flex:1;min-height:0;overflow-y:auto;padding:0 14px 8px;display:flex;flex-direction:column;gap:10px}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:none}
.qtag{padding:3px 9px;line-height:1.2;white-space:nowrap}
.qtext{line-height:1.35}
.qhint{line-height:1.3}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:11px;align-items:center;width:100%;padding:12px 13px;min-height:46px}
.opts.dense .opt{padding:9px 12px;min-height:38px;gap:9px}
.opt-k{flex:none;width:25px;height:25px;display:grid;place-items:center;line-height:1}
.opts.dense .opt-k{width:22px;height:22px}
.opt-t{flex:1;min-width:0;line-height:1.25}
.fb{padding:12px 13px}
.fb-v{display:block;line-height:1.2;margin-bottom:4px}
.fb-p{line-height:1.35}
.fb-q{display:block;margin-top:6px;line-height:1.2}
.qact{flex:none;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.btn{flex:1;padding:14px;text-align:center;min-height:48px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.narrow{flex:0 0 auto;padding-left:19px;padding-right:19px}

/* Ergebnis */
.res-hero{padding:20px 16px;text-align:center;flex:none}
.res-num{line-height:1;font-variant-numeric:tabular-nums}
.res-sub{line-height:1.3;margin-top:6px}
.rev{display:flex;flex-direction:column}
.rev details{padding:9px 0}
.rev summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:flex-start;line-height:1.3}
.rev summary::-webkit-details-marker{display:none}
.rev-b{padding:8px 0 2px 20px;display:flex;flex-direction:column;gap:4px;line-height:1.35}

/* Spielereien */
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.85);opacity:0;
  padding:10px 18px;pointer-events:none;z-index:60;white-space:nowrap;
  transition:opacity .18s, transform .18s cubic-bezier(.2,1.6,.4,1)}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#konfetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.kf{position:absolute;width:9px;height:14px;will-change:transform,opacity}
@keyframes kfall{
  0%{transform:translate3d(0,0,0) rotate(0);opacity:1}
  100%{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot));opacity:.15}
}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.pulse{animation:pop .34s cubic-bezier(.2,1.4,.4,1)}
@media (prefers-reduced-motion:reduce){
  .kf,.pulse{animation:none!important}
  .xpfill,.barfill,.qprogfill{transition:none}
}
</style>
<style id="stile">/* Einheitliches Editorial-System: Schwarz, Papier, klare Typografie. */
[data-style="editorial"]{
  --ink:#050505;
  --paper:#f8f7f3;
  --white:#fff;
  --muted:#676762;
  --line:#171717;
  --soft:#e8e7e2;
  --ok:#087d46;
  --bad:#b42318;
  --warn:#9a6700;
  --rule:2px;
  --kf1:#050505;
  --kf2:#676762;
  --kf3:#fff;
  --kf4:#087d46;
  width:min(100%,520px);
  background:var(--paper);
  color:var(--ink);
  border:0;
  font-family:Arial,Helvetica,sans-serif;
  font-weight:600;
  box-shadow:0 18px 50px rgba(0,0,0,.08);
}

[data-style="editorial"] button:focus-visible,
[data-style="editorial"] summary:focus-visible{
  outline:var(--rule) solid var(--ink);
  outline-offset:3px;
}

[data-style="editorial"] .screen{
  gap:18px;
  padding:24px 34px 34px;
}
[data-style="editorial"] .screen.pad-top{
  padding-top:calc(28px + env(safe-area-inset-top));
}

/* Kopfzeilen */
[data-style="editorial"] .shead{
  align-items:flex-end;
  border-bottom:var(--rule) solid var(--line);
  padding-bottom:18px;
}
[data-style="editorial"] .stitle{
  font-size:38px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .ssub,
[data-style="editorial"] .statlab,
[data-style="editorial"] .chart-t,
[data-style="editorial"] .qhint,
[data-style="editorial"] .qtag,
[data-style="editorial"] .fb-q,
[data-style="editorial"] .mono-label,
[data-style="editorial"] .xplvl{
  color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px;
  font-weight:800;
  line-height:1.3;
  text-transform:uppercase;
}

/* Startseite */
[data-style="editorial"] .home{
  gap:0;
}
[data-style="editorial"] .brandhead{
  position:relative;
  overflow:hidden;
  border-bottom:var(--rule) solid var(--line);
  padding-bottom:26px;
}
[data-style="editorial"] .brand{
  overflow:hidden;
  font-size:38px;
  font-weight:900;
  line-height:1.05;
  white-space:nowrap;
  text-transform:uppercase;
}
[data-style="editorial"] .brand-sub{
  display:block;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .brand-meta{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  margin-top:12px;
}
[data-style="editorial"] .brand-serial{
  flex:none;
  color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:9px;
  font-weight:900;
}
[data-style="editorial"] .home-progress{
  padding:24px 0 26px;
}
[data-style="editorial"] .mastery-label,
[data-style="editorial"] .mastery-caption{
  display:block;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .primary-row{
  position:relative;
  width:100%;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:13px 16px;
  background:var(--ink);
  color:var(--white);
  border:var(--rule) solid var(--ink);
  overflow:hidden;
}
[data-style="editorial"] .primary-row > *{
  position:relative;
  z-index:1;
}
[data-style="editorial"] .primary-copy,
[data-style="editorial"] .primary-title,
[data-style="editorial"] .primary-sub{
  display:block;
}
[data-style="editorial"] .primary-sub{
  margin-top:4px;
  color:#c7c7c7;
  font-size:13px;
  font-weight:600;
  line-height:1.25;
}
[data-style="editorial"] .primary-title{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:15px;
  font-weight:900;
  line-height:1.2;
  text-transform:uppercase;
}
[data-style="editorial"] .primary-row .arrow,
[data-style="editorial"] .mode-row .arrow{
  flex:none;
  font-size:34px;
  font-weight:400;
  line-height:1;
}
[data-style="editorial"] .primary-row:active:not(:disabled){
  background:var(--white);
  color:var(--ink);
}
[data-style="editorial"] .primary-row:disabled{
  background:var(--soft);
  border-color:var(--muted);
  color:var(--muted);
}
[data-style="editorial"] .mode-list{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:12px;
}
[data-style="editorial"] .mode-row{
  width:100%;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:13px 16px;
  background:var(--paper);
  border:var(--rule) solid var(--line);
}
[data-style="editorial"] .mode-row:active:not(:disabled){
  background:var(--ink);
  color:var(--white);
}
[data-style="editorial"] .mode-title{
  display:block;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:15px;
  font-weight:900;
  line-height:1.2;
  text-transform:uppercase;
}
[data-style="editorial"] .mode-sub{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
  line-height:1.25;
}
[data-style="editorial"] .mode-row:active .mode-sub{
  color:var(--white);
}
[data-style="editorial"] .mode-row:disabled{
  opacity:.35;
  cursor:not-allowed;
}
[data-style="editorial"] .market-note{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:10px;
  margin-top:10px;
  color:var(--muted);
  font-size:11px;
  line-height:1.35;
}
[data-style="editorial"] .market-note span{
  color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .compact-modes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}
[data-style="editorial"] .compact-mode{
  min-width:0;
  height:68px;
  min-height:68px;
  padding:10px 12px;
  overflow:hidden;
  border:var(--rule) solid var(--line);
}
[data-style="editorial"] .compact-mode .mode-sub{
  overflow:hidden;
  font-size:11px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
[data-style="editorial"] .compact-mode:active:not(:disabled){
  background:var(--ink);
  color:var(--white);
}
[data-style="editorial"] .compact-mode:active .mode-sub{
  color:var(--white);
}
[data-style="editorial"] .compact-mode:disabled{
  opacity:.35;
  cursor:not-allowed;
}
/* Bottom-Navigation */
[data-style="editorial"] .tabbar{
  gap:0;
  margin-left:-1px;
  margin-right:-1px;
  padding:0 0 env(safe-area-inset-bottom);
  background:var(--ink);
  color:var(--white);
}
[data-style="editorial"] .tab{
  min-height:64px;
  color:#a9a9a9;
}
[data-style="editorial"] .tab-icon{
  width:27px;
  height:27px;
  display:block;
}
[data-style="editorial"] .tab.is-on{
  color:var(--white);
}
[data-style="editorial"] .tab.is-on .tab-icon{
  stroke-width:2;
}

/* Statistik und Listen */
[data-style="editorial"] .chartcard{
  padding:18px 0 22px;
  border-bottom:var(--rule) solid var(--line);
}
[data-style="editorial"] .chart-t{
  margin-bottom:16px;
  color:var(--ink);
  font-size:12px;
}
[data-style="editorial"] .ringbg{
  stroke:var(--soft);
}
[data-style="editorial"] .ringfg{
  stroke:var(--ok);
}
[data-style="editorial"] .ringnum{
  font-size:48px;
  font-weight:950;
}
[data-style="editorial"] .ringnum::after{
  content:'%';
  margin-left:2px;
  font-size:19px;
}
[data-style="editorial"] .boxes{
  gap:0;
  border:var(--rule) solid var(--line);
}
[data-style="editorial"] .boxcol{
  min-width:0;
  padding:13px 4px;
  border-left:var(--rule) solid var(--line);
}
[data-style="editorial"] .boxcol:first-child{
  border-left:0;
}
[data-style="editorial"] .boxn{
  font-size:22px;
  font-weight:900;
}
[data-style="editorial"] .boxl{
  color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
}
[data-style="editorial"] .status-boxes .boxcol{
  position:relative;
  padding-top:16px;
}
[data-style="editorial"] .status-boxes .boxcol::before{
  content:'';
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:var(--rule);
  background:var(--soft);
}
[data-style="editorial"] [data-state="falsch"]::before,
[data-style="editorial"] .status-segment[data-state="falsch"]{
  background:var(--bad);
}
[data-style="editorial"] [data-state="wackelig"]::before,
[data-style="editorial"] .status-segment[data-state="wackelig"]{
  background:var(--ink);
}
[data-style="editorial"] [data-state="neu"]::before,
[data-style="editorial"] .status-segment[data-state="neu"]{
  background:var(--white);
}
[data-style="editorial"] [data-state="sitzt"]::before,
[data-style="editorial"] .status-segment[data-state="sitzt"]{
  background:var(--ok);
}
[data-style="editorial"] .status-boxes [data-state="falsch"] .boxn{
  color:var(--bad);
}
[data-style="editorial"] .status-boxes [data-state="neu"] .boxn{
  color:var(--muted);
}
[data-style="editorial"] .status-boxes [data-state="sitzt"] .boxn{
  color:var(--ok);
}
[data-style="editorial"] .status-progress{
  display:flex;
  height:18px;
  margin-top:12px;
  overflow:hidden;
  background:var(--white);
  border:var(--rule) solid var(--line);
}
[data-style="editorial"] .status-progress.compact{
  height:10px;
  margin-top:0;
}
[data-style="editorial"] .status-segment{
  display:block;
  height:100%;
}
[data-style="editorial"] .status-segment[data-state="neu"]{
  border-right:var(--rule) solid var(--soft);
  border-left:var(--rule) solid var(--soft);
}
[data-style="editorial"] .barrow{
  grid-template-columns:minmax(0,1fr) 72px 40px;
  padding:8px 0;
}
[data-style="editorial"] .barlab{
  font-size:13px;
}
[data-style="editorial"] .bartrack{
  background:var(--white);
  border:var(--rule) solid var(--line);
}
[data-style="editorial"] .barfill{
  background:var(--ink);
}
[data-style="editorial"] .barval{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10px;
  font-weight:800;
}
[data-style="editorial"] .topic-stat{
  display:grid;
  gap:8px;
  padding:9px 0;
}
[data-style="editorial"] .topic-stat-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
[data-style="editorial"] .topic-stat-head .barlab{
  overflow:visible;
  line-height:1.25;
  white-space:normal;
}
[data-style="editorial"] .topic-stat-head .barval{
  flex:none;
}
[data-style="editorial"] .linefill{
  fill:var(--soft);
}
[data-style="editorial"] .linestroke{
  stroke:var(--ink);
}
[data-style="editorial"] .linedot{
  fill:var(--ink);
}
[data-style="editorial"] .leer{
  padding:18px;
  border:var(--rule) dashed var(--muted);
  color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px;
  font-weight:800;
  line-height:1.4;
  text-align:center;
  text-transform:uppercase;
}
[data-style="editorial"] .heat{

}
[data-style="editorial"] .heatd{

}
[data-style="editorial"] .heatd[data-lv="1"]{background:#d2d1cc}
[data-style="editorial"] .heatd[data-lv="2"]{background:#9f9f9b}
[data-style="editorial"] .heatd[data-lv="3"]{background:#5a5a57}

[data-style="editorial"] .tlist{

}
[data-style="editorial"] .trow{

[data-style="editorial"] .trow .barlab{

[data-style="editorial"] .trow .bartrack{

[data-style="editorial"] .tapp::after{

}

/* Einstellungen */
[data-style="editorial"] .chips{
  gap:8px;
}
[data-style="editorial"] .scope-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}
[data-style="editorial"] .scope-grid .chip{
  width:100%;
}
[data-style="editorial"] .scope-grid [data-umfang="essential"]{
  grid-column:1 / -1;
}
[data-style="editorial"] .difficulty-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}
[data-style="editorial"] .difficulty-grid .chip{
  width:100%;
}
[data-style="editorial"] .chip{
  min-height:42px;
  padding:9px 13px;
  border:var(--rule) solid var(--line);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
}

}
[data-style="editorial"] .setting-note{

  color:var(--muted);
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  font-weight:600;
  line-height:1.45;
  text-transform:none;
}

/* Quiz */
[data-style="editorial"] .quiz{
  height:100%;
  background:var(--paper);
}
[data-style="editorial"] .qtop{
  padding:calc(16px + env(safe-area-inset-top)) 24px 16px;
  border-bottom:var(--rule) solid var(--line);
}
[data-style="editorial"] .qx{
  width:40px;
  height:40px;

  place-items:center;
  font-size:25px;
  text-align:center;
}
[data-style="editorial"] .qprog{

  background:var(--white);
  border:var(--rule) solid var(--line);
}
[data-style="editorial"] .qprogfill{
  background:var(--ink);
}
[data-style="editorial"] .qcount{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  font-weight:900;
}
[data-style="editorial"] .qcount.low{
  color:var(--bad);
}
[data-style="editorial"] .market-clock{
  min-width:76px;
  padding:7px 8px;
  background:var(--ink);
  color:var(--white);
  text-align:center;
}
[data-style="editorial"] .market-clock::before{
  content:'BÖRSE ';
  color:#7bd9a9;
  font-size:8px;
}
[data-style="editorial"] .market-clock.low{
  background:var(--bad);
  color:var(--white);
}
[data-style="editorial"] .market-clock.low::before{
  color:var(--white);
}
[data-style="editorial"] .blitz-yield{
  min-width:48px;
  padding:6px 8px;
  background:var(--ink);
  color:var(--white);
  text-align:center;
}
[data-style="editorial"] .qbody{
  gap:16px;
  padding:24px 34px 18px;
}
[data-style="editorial"] .qmeta{
  gap:0;
  border-bottom:var(--rule) solid var(--line);
  padding-bottom:10px;
}
[data-style="editorial"] .qtag{
  padding:0 9px;
  color:var(--ink);
  border-left:var(--rule) solid var(--line);
}
[data-style="editorial"] .qtag:first-child{
  padding-left:0;
  border-left:0;
}
[data-style="editorial"] .qserial{
  color:var(--muted);
  font-size:9px;
}
[data-style="editorial"] .qtext{
  font-size:25px;
  font-weight:900;
  line-height:1.18;
}
[data-style="editorial"] .fact-note-title,
[data-style="editorial"] .fact-source,
[data-style="editorial"] .fact-feedback a{
  color:var(--bad);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .fact-note-title span{
  font-family:Arial,Helvetica,sans-serif;
  font-size:17px;
  line-height:0;
}
[data-style="editorial"] .fact-feedback{
  display:flex;

  line-height:1.4;
}
[data-style="editorial"] .fact-feedback a{
  align-self:flex-start;
  color:var(--bad);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10px;
  font-weight:900;
  text-decoration:underline;
  text-decoration-thickness:var(--rule);
  text-transform:uppercase;
  text-underline-offset:3px;
}
[data-style="editorial"] .qhint{
  color:var(--muted);
}
[data-style="editorial"] .opts{
  gap:0;
  border:var(--rule) solid var(--line);
}
[data-style="editorial"] .opt,
[data-style="editorial"] .opts.dense .opt{

  padding:12px 14px;
  background:var(--white);
  border-top:var(--rule) solid var(--line);
}
[data-style="editorial"] .opt:first-child{
  border-top:0;
}
[data-style="editorial"] .opt-k,
[data-style="editorial"] .opts.dense .opt-k{
  width:28px;
  height:28px;
  border:var(--rule) solid currentColor;
  border-radius:50%;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  font-weight:900;
}
[data-style="editorial"] .opt.multi .opt-k{
  border-radius:0;
}
[data-style="editorial"] .opt-t{
  font-size:15px;
  font-weight:700;
}
[data-style="editorial"] .opt.is-sel,
[data-style="editorial"] .opt.is-right,
[data-style="editorial"] .opts.dense .opt.is-sel,
[data-style="editorial"] .opts.dense .opt.is-right{
  background:var(--ink);
  color:var(--white);
}
[data-style="editorial"] .opt.is-wrong,
[data-style="editorial"] .opts.dense .opt.is-wrong{
  background:#f7dfdc;
  color:var(--bad);
}
[data-style="editorial"] .opt.is-missed,
[data-style="editorial"] .opts.dense .opt.is-missed{
  background:#fff3cd;
  color:var(--warn);
}
[data-style="editorial"] .fb{
  padding:18px;
  background:var(--ink);
  color:var(--white);
  border:var(--rule) solid var(--ink);
}
[data-style="editorial"] .fb-v{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .fb-p{
  font-size:14px;
}
[data-style="editorial"] .fb-q{
  color:#c7c7c7;
}
[data-style="editorial"] .answer-feedback{
  flex:none;
  max-height:38dvh;
  padding:12px 34px;
  overflow-y:auto;
  background:var(--white);
  color:var(--ink);

}
[data-style="editorial"] .answer-feedback[data-r="ok"]{

}

  color:var(--ok);
}
[data-style="editorial"] .answer-feedback[data-r="bad"]{
  border-top-color:var(--bad);
}

  color:var(--bad);
}
[data-style="editorial"] .satire-feedback{
  display:block;
  margin:4px 0 7px;

  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  text-transform:uppercase;
}
[data-style="editorial"] .answer-feedback[data-r="ok"] .satire-feedback{
  color:var(--ok);
}
[data-style="editorial"] .answer-feedback[data-r="bad"] .satire-feedback{
  color:var(--bad);
}
[data-style="editorial"] .meme-reaction{
  width:min(100%,420px);
  margin:11px 0 13px;
}
[data-style="editorial"] .meme-reaction[hidden]{
  display:none;
}
[data-style="editorial"] .meme-media{
  position:relative;
  height:min(160px,20dvh);
  min-height:112px;
  overflow:hidden;
  background:var(--ink);
  border:var(--rule) solid var(--line);
}
[data-style="editorial"] .meme-media img,
[data-style="editorial"] .meme-fallback{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
[data-style="editorial"] .meme-media img{
  display:block;
  object-fit:contain;
}
[data-style="editorial"] .meme-reaction img[hidden],
[data-style="editorial"] .meme-fallback[hidden]{
  display:none;
}
[data-style="editorial"] .meme-fallback{
  display:grid;
  place-items:center;
  padding:18px;
  color:var(--white);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10px;
  font-weight:900;
  line-height:1.35;
  text-align:center;
  text-transform:uppercase;
}
[data-style="editorial"] .answer-detail{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:12px;
  padding-top:12px;
  border-top:var(--rule) solid var(--line);
  font-size:13px;
  line-height:1.4;
}
[data-style="editorial"] .answer-detail[hidden]{
  display:none;
}
[data-style="editorial"] .answer-detail-title{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .qact{
  padding:12px 34px calc(16px + env(safe-area-inset-bottom));
  border-top:var(--rule) solid var(--line);
}
[data-style="editorial"] .btn{
  min-height:58px;
  padding:14px 18px;
  border:var(--rule) solid var(--line);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .btn-primary{
  position:relative;
  overflow:hidden;
  background:var(--ink);
  color:var(--white);
}
[data-style="editorial"] .btn-info{
  flex:0 0 58px;
  padding:0;
  background:var(--white);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  font-size:22px;
  font-weight:900;
  text-transform:none;
}
[data-style="editorial"] .btn-info span{
  display:grid;
  width:28px;
  height:28px;
  margin:auto;
  place-items:center;
  border:var(--rule) solid currentColor;
  border-radius:50%;
  line-height:1;
}
[data-style="editorial"] .btn-info.is-on{
  background:var(--ink);
  color:var(--white);
}
[data-style="editorial"] .btn-ghost{
  background:var(--paper);
  color:var(--ink);
}
[data-style="editorial"] .btn:disabled{
  background:var(--soft);
  color:var(--muted);
  opacity:1;
}

/* Ergebnis und Spickzettel */
[data-style="editorial"] .res-hero{
  position:relative;
  overflow:hidden;
  padding:24px 0;
  border-bottom:var(--rule) solid var(--line);
}
[data-style="editorial"] .res-report{
  margin-bottom:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .res-stamp{
  display:inline-block;
  margin:0 auto 14px;
  padding:6px 10px;
  border:var(--rule) solid currentColor;
  color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  font-weight:900;
  line-height:1;
  text-transform:uppercase;
  transform:rotate(-3deg);
}
[data-style="editorial"] .res-stamp[data-grade="top"],
[data-style="editorial"] .res-stamp[data-grade="ok"]{
  color:var(--ok);
}
[data-style="editorial"] .res-stamp[data-grade="bad"]{
  color:var(--bad);
}
[data-style="editorial"] .res-num{
  font-size:58px;
  font-weight:950;
}
[data-style="editorial"] .res-sub{
  color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
}
[data-style="editorial"] .res-closing{
  max-width:330px;
  margin:14px auto 0;
  font-size:13px;
  font-weight:800;
  line-height:1.35;
}
[data-style="editorial"] .rev details{
  border-top:var(--rule) solid var(--line);
  padding:13px 0;
}
[data-style="editorial"] .rev summary{
  font-size:14px;
}
[data-style="editorial"] .rev-b{
  color:var(--muted);
  font-size:13px;
}
[data-style="editorial"] .toast{
  max-width:calc(100% - 40px);
  padding:12px 18px;
  background:var(--ink);
  color:var(--white);
  border:var(--rule) solid var(--white);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}

/* Satirische Moneten-Effekte */
[data-style="editorial"] .kf{
  width:auto;
  height:auto;
  background:transparent;
  font-family:Georgia,'Times New Roman',serif;
  font-style:normal;
  font-weight:900;
  line-height:1;
  text-shadow:0 0 0 var(--ink);
}
[data-style="editorial"] .flying-note{
  position:absolute;
  top:38vh;
  left:0;
  width:min(74vw,300px);
  height:126px;
  display:grid;
  grid-template-columns:58px 1fr;
  grid-template-rows:1fr auto;
  align-items:center;
  gap:0 12px;
  padding:18px;
  background:var(--paper);
  color:var(--ink);
  border:var(--rule) solid var(--line);
  box-shadow:inset 0 0 0 5px var(--paper),inset 0 0 0 7px var(--line);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  animation:bankfly 3s cubic-bezier(.3,.7,.35,1) forwards;
}
[data-style="editorial"] .flying-note span{
  grid-row:1 / 3;
  font-family:Arial,Helvetica,sans-serif;
  font-size:40px;
  font-weight:950;
}
[data-style="editorial"] .flying-note b{
  align-self:end;
  font-size:21px;
  line-height:1;
}
[data-style="editorial"] .flying-note small{
  align-self:start;
  margin-top:7px;
  font-size:8px;
  font-weight:900;
}
@keyframes bankfly{
  0%{transform:translate3d(-90vw,30px,0) rotate(-10deg);opacity:0}
  12%{opacity:1}
  55%{transform:translate3d(calc(50vw - 40px),-18px,0) rotate(3deg);opacity:1}
  100%{transform:translate3d(130vw,20px,0) rotate(12deg);opacity:0}
}

/* Einmalige Startseite */
[data-style="editorial"] .welcome-view{
  background:var(--paper);
}
[data-style="editorial"] .welcome-screen{
  position:relative;
  overflow:hidden;
  min-height:100%;
  padding:calc(28px + env(safe-area-inset-top)) 34px
    24px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
}
[data-style="editorial"] .welcome-screen header{
  padding-bottom:0;
}
[data-style="editorial"] .welcome-screen h1{
  font-size:38px;
  font-weight:900;
  line-height:1;
  text-transform:uppercase;
}
[data-style="editorial"] .welcome-lead{
  padding:20px 0;
  font-weight:600;
  line-height:1.42;
}
[data-style="editorial"] .welcome-sections{
  border-top:0;
}
[data-style="editorial"] .welcome-sections details{
  border-bottom:var(--rule) solid var(--line);
}
[data-style="editorial"] .welcome-sections summary{
  display:flex;
  min-height:52px;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  cursor:pointer;
  list-style:none;
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .welcome-sections summary::-webkit-details-marker{
  display:none;
}
[data-style="editorial"] .welcome-sections summary span:last-child{
  flex:none;
  font-family:Arial,Helvetica,sans-serif;
  font-size:25px;
  font-weight:400;
  line-height:1;
  transition:transform .18s ease;
}
[data-style="editorial"] .welcome-sections details[open] summary span:last-child{
  transform:rotate(45deg);
}
[data-style="editorial"] .welcome-sections details > div{
  display:flex;
  flex-direction:column;
  gap:9px;
  padding:0 28px 16px 0;
  line-height:1.42;
}
[data-style="editorial"] .welcome-last{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:20px 0 4px;
  line-height:1.42;
}
[data-style="editorial"] .welcome-signoff{
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .welcome-action{
  flex:none;
  padding:12px 34px calc(10px + env(safe-area-inset-bottom));
  background:var(--paper);
  border-top:var(--rule) solid var(--line);
}
[data-style="editorial"] .welcome-close{
  width:100%;
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
}

  display:flex;

}
[data-style="editorial"] .legal-links button{
  text-decoration:underline;

[data-style="editorial"] .welcome-action .legal-links{

}
[data-style="editorial"] .legal-page{
  gap:0;
}
[data-style="editorial"] .legal-page section{
  padding:18px 0;
  border-bottom:var(--rule) solid var(--line);
}
[data-style="editorial"] .legal-page h2{
  margin-bottom:9px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .legal-page p{
  font-size:13px;
  font-weight:600;
  line-height:1.48;
}
[data-style="editorial"] .legal-page a{

    padding-left:22px;
  }

  }

}

@media (max-width:340px){
  [data-style="editorial"] .brand,
  [data-style="editorial"] .stitle{
    font-size:27px;
  }
}

@media (max-height:720px){
  [data-style="editorial"] .brandhead{
    padding-bottom:16px;
  }
  [data-style="editorial"] .home-progress{
    padding:18px 0;
  }
  [data-style="editorial"] .primary-row{
    min-height:68px;
  }
  [data-style="editorial"] .mode-list{
    gap:12px;
    margin-top:12px;
  }
  [data-style="editorial"] .mode-row{
    min-height:60px;
  }
}

/* ═══ Verbwlerung ═══
   Geldzeichen im Hintergrund, Index-Karte, Testregler und Kursticker.
   Alles rein dekorativ; die Deckkraft steuert die App ueber die Stufe. */
[data-style="editorial"] .geld{
  color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-weight:900;
  user-select:none;
}
[data-style="editorial"][data-bwl="4"] .geld,
[data-style="editorial"][data-bwl="5"] .geld{
  color:var(--ok);
}

[data-style="editorial"] .bwl-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}
[data-style="editorial"] .bwl-rolle{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.02em;
}
[data-style="editorial"] .bwl-wert{
  font-size:22px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}
[data-style="editorial"] .bwl-leiter{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:3px;
  margin-top:8px;
}
[data-style="editorial"] .bwl-stufe{
  overflow:hidden;
  padding:5px 2px;
  border-top:var(--rule) solid var(--soft);
  color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:8px;
  font-weight:800;
  text-align:center;
  text-overflow:ellipsis;
  text-transform:uppercase;
  white-space:nowrap;
}
[data-style="editorial"] .bwl-stufe.is-on{
  border-top-color:var(--ink);
  color:var(--ink);
}

[data-style="editorial"] .bwl-regler{
  margin-top:12px;
}
[data-style="editorial"] .bwl-regler input[type="range"]{
  display:block;
  width:100%;
  height:26px;
  margin:0;
  background:transparent;
  accent-color:var(--ink);
  cursor:pointer;
}
[data-style="editorial"] .bwl-regler input[type="range"]:disabled{
  cursor:not-allowed;
  opacity:.35;
}
[data-style="editorial"] .bwl-reglerskala{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10px;
  font-weight:800;
  text-align:center;
}
[data-style="editorial"] .bwl-reglerskala .is-on{
  color:var(--ink);
}

[data-style="editorial"] .kursticker{
  margin-top:12px;
}
[data-style="editorial"] .kurskopf{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .kurs-fiktiv{
  padding:2px 6px;
  background:var(--ink);
  color:var(--white);
}
[data-style="editorial"] .kurslauf{
  overflow:hidden;
  margin-top:7px;
  padding:6px 0;
  border-top:1px solid var(--soft);
  border-bottom:1px solid var(--soft);
}
[data-style="editorial"] .kursband{
  display:flex;
  width:max-content;
  gap:18px;
  animation:kurslauf 26s linear infinite;
}
@keyframes kurslauf{
  from{transform:translate3d(0,0,0)}
  to{transform:translate3d(-50%,0,0)}
}
[data-style="editorial"] .kurs{
  display:flex;
  align-items:baseline;
  gap:5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
[data-style="editorial"] .kurs i{
  font-size:10px;
  font-style:normal;
}
[data-style="editorial"] .kurs i[data-t="up"]{
  color:var(--ok);
}
[data-style="editorial"] .kurs i[data-t="down"]{
  color:var(--bad);
}
[data-style="editorial"] .kursfuss{
  margin-top:6px;
  color:var(--muted);
  font-size:10px;
  line-height:1.35;
}

/* Auf der Endstufe schreit die Typografie mit. */
[data-style="editorial"][data-bwl="5"] .mode-title,
[data-style="editorial"][data-bwl="5"] .primary-title{
  letter-spacing:.01em;
  text-transform:uppercase;
}
/* Die langen Beratertitel brauchen in den kleinen Kacheln mehr Luft. */
[data-style="editorial"][data-bwl="4"] .compact-mode,
[data-style="editorial"][data-bwl="5"] .compact-mode{
  height:auto;
  min-height:78px;
}
[data-style="editorial"][data-bwl="4"] .compact-mode .mode-title,
[data-style="editorial"][data-bwl="5"] .compact-mode .mode-title{
  font-size:12px;
  line-height:1.2;
}

@media (prefers-reduced-motion:reduce){
  [data-style="editorial"] .kursband{
    animation:none;
  }
  [data-style="editorial"] #geldgrund{
    transition:none;
  }
}

/* Ab Stufe 1 liegt das Geld auch hinter dem Quiz; die Papierfarbe kommt
   dann von .app statt von .quiz. */
[data-style="editorial"]:not([data-bwl="0"]) .quiz{
  background:transparent;
}

/* Echte Geldzitate zwischen den Fragen */
[data-style="editorial"] .geldzitat{
  margin-top:14px;
  padding:12px 0 0;
  border-top:1px solid var(--soft);
}
[data-style="editorial"] .geldzitat blockquote{
  font-size:14px;
  font-style:italic;
  font-weight:600;
  line-height:1.4;
}
[data-style="editorial"] .geldzitat blockquote::before{
  content:'„';
}
[data-style="editorial"] .geldzitat blockquote::after{
  content:'“';
}
[data-style="editorial"] .geldzitat figcaption{
  margin-top:5px;
  color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}
[data-style="editorial"] .geldzitat figcaption::before{
  content:'— ';
}
[data-style="editorial"] .res-hero .geldzitat{
  margin-top:18px;
  text-align:center;
}</style>
</head>

</div>
<script id="fragen-data" type="application/json">[{"id":"q001","thema":"Grundlagen der BWL","frage":"Was liefert die Betriebswirtschaftslehre nach ihrem Hauptziel?","optionen":["Gesetze, Verordnungen und Vorschriften, um Betriebe rechtlich abzusichern","Kennzahlen, Bilanzen und Steuersätze, um Abschlüsse korrekt zu erstellen","Methoden, Prozesse und Verständnis, um Entscheidungen begründet zu fällen","Techniken, Werkzeuge und Materialien, um Produkte günstiger zu fertigen"],"richtig":2,"erklaerung":"Hauptziel der BWL ist es, **Methoden, Prozesse und Verständnis** zu liefern, um Entscheidungen zu begründen bzw. zu fällen, die das Unternehmen wirtschaftlich weiterbringen. Rechtliche Vorgaben oder Fertigungstechniken sind nicht Gegenstand dieses Ziels.","quelle":"f51","schwierigkeit":"leicht"},{"id":"q002","thema":"Grundlagen der BWL","frage":"Worauf basieren Entscheidungen, die in einem Betrieb im Rahmen der BWL getroffen werden, in der Regel?","optionen":["Auf den persönlichen Erfahrungen der Führungskraft","Auf den klaren Prinzipien der Betriebswirtschaft","Auf den gesetzlichen Vorgaben des Handelsrechts","Auf den gestalterischen Vorlieben des Designteams"],"richtig":1,"erklaerung":"Entscheidungen im Betrieb beruhen im Rahmen der BWL in der Regel auf **klaren betriebswirtschaftlichen Prinzipien**, damit die **ökonomischen Möglichkeiten ideal** ausgenutzt werden. Maßgeblich ist damit nicht persönliches Erfahrungswissen, nicht die rechtliche Vorgabe und nicht die gestalterische Präferenz.","quelle":"f51","schwierigkeit":"leicht"},{"id":"q003","thema":"Grundlagen der BWL","frage":"Welche Wirkung wird angestrebt, wenn betriebliche Entscheidungen auf betriebswirtschaftlichen Prinzipien beruhen?","optionen":["Die ökonomischen Möglichkeiten werden ideal ausgenutzt","Die rechtlichen Risiken werden vollständig ausgeschlossen","Die gestalterische Qualität wird dauerhaft gesichert","Die laufenden Personalkosten werden spürbar gesenkt"],"richtig":0,"erklaerung":"Entscheidungen nach betriebswirtschaftlichen Prinzipien sollen dazu führen, dass die **ökonomischen Möglichkeiten ideal ausgenutzt** werden. Rechtssicherheit, Gestaltungsqualität oder Kostensenkung sind nicht die formulierte Zielwirkung.","quelle":"f51","schwierigkeit":"mittel"},{"id":"q004","thema":"Grundlagen der BWL","frage":"Welcher Bereich gehört zu den grundlegenden BWL-Kenntnissen, die für Designer_innen nützlich sind?","optionen":["Die Entwicklung von Produktionsanlagen und Maschinen","Die Programmierung von Datenbanken und Webshops","Die Prüfung von Verträgen und Urheberrechtsfragen","Die Verwaltung der Finanzen und die Buchhaltung"],"richtig":3,"erklaerung":"Zu den grundlegenden BWL-Kenntnissen zählen die Planung und Budgetierung, das Management von Ressourcen und Mitarbeitern/Team, die **Verwaltung von Finanzen und Buchhaltung**, das Marketing und der Vertrieb. **Technische und juristische Aufgaben** gehören nicht zu dieser Aufzählung.","quelle":"f50","schwierigkeit":"leicht"},{"id":"q005","thema":"Grundlagen der BWL","frage":"Ein Designbüro legt fest, welche Mitarbeitenden welchen Projekten zugeteilt werden und welche Geräte diesen Projekten zur Verfügung stehen. Welchem grundlegenden BWL-Bereich entspricht diese Aufgabe?","optionen":["Dem Management von Ressourcen und Mitarbeitenden","Der Verwaltung von Finanzen und Buchhaltung","Dem Marketing der angebotenen Designleistungen","Dem Vertrieb der fertiggestellten Designarbeiten"],"richtig":0,"erklaerung":"Die Zuteilung von Personen und Betriebsmitteln zu Projekten fällt unter das **Management von Ressourcen und Mitarbeitern/Team**. Finanzverwaltung, Marketing und Vertrieb sind eigene, davon abgegrenzte Bereiche.","quelle":"f50","schwierigkeit":"mittel"},{"id":"q006","thema":"Grundlagen der BWL","frage":"Welchen Nutzen haben BWL-Kenntnisse für Designer_innen im Verhältnis zu Arbeitgebern?","optionen":["Sie ermöglichen es, Tarifverträge eigenständig mit Arbeitgebern auszuhandeln","Sie ermöglichen es, die Bilanzen von Arbeitgebern rechtlich zu prüfen","Sie ermöglichen es, smart für oder gegen Arbeitgeber zu agieren","Sie ermöglichen es, Urheberrechte gegenüber Arbeitgebern durchzusetzen"],"richtig":2,"erklaerung":"BWL-Kenntnisse sollen Designer_innen befähigen, **smart für bzw. gegen Arbeitgeber zu agieren**. Tarif-, Prüfungs- oder Urheberrechtsfragen werden als Nutzen nicht genannt.","quelle":"f49","schwierigkeit":"mittel"},{"id":"q007","thema":"Grundlagen der BWL","frage":"Welches Verständnis sollen BWL-Kenntnisse Designer_innen vermitteln?","optionen":["Ein Verständnis dafür, wie Märkte staatlich reguliert werden","Ein Verständnis dafür, wie Unternehmen grundsätzlich funktionieren","Ein Verständnis dafür, wie Gesetze für Betriebe entstehen","Ein Verständnis dafür, wie Kundschaft psychologisch entscheidet"],"richtig":1,"erklaerung":"BWL-Kenntnisse helfen Designer_innen, ein Verständnis dafür zu entwickeln, **wie Unternehmen funktionieren** und wie sie ihr eigenes Unternehmen oder Projekt erfolgreich betreiben können.","quelle":"f49","schwierigkeit":"leicht"},{"id":"q008","thema":"Grundlagen der BWL","frage":"Wozu sollen BWL-Kenntnisse Designer_innen im Betriebsalltag befähigen?","optionen":["Effektiv zu entwerfen, zu produzieren, zu lagern und zu liefern","Effektiv zu forschen, zu gestalten, zu dokumentieren und zu präsentieren","Effektiv zu kalkulieren, zu verhandeln, zu exportieren und zu beraten","Effektiv zu planen, zu budgetieren, zu verwalten und zu vermarkten"],"richtig":3,"erklaerung":"BWL-Kenntnisse dienen dazu, effektiv zu **planen, zu budgetieren, zu verwalten und zu vermarkten** sowie eigene Unternehmen oder Projekte zu leiten und zu verwalten. Gestalterische oder produktionsnahe Tätigkeiten sind damit nicht gemeint.","quelle":"f49","schwierigkeit":"leicht"},{"id":"q009","thema":"Rechtsformen","frage":"Welcher Nachteil wird dem Einzelunternehmen zugeordnet?","optionen":["Die gesamtschuldnerische unbeschränkte Haftung","Das Risiko der Scheinselbstständigkeit","Die hohen Gründungs- und Verwaltungskosten","Die geringe Kreditwürdigkeit gegenüber Banken"],"richtig":0,"erklaerung":"Beim Einzelunternehmen wird als Nachteil die **gesamtschuldnerische unbeschränkte Haftung** genannt. Scheinselbstständigkeit gilt als Nachteil des Freelancers, hohe Gründungs- und Verwaltungskosten als Nachteil der GmbH.","quelle":"f44","schwierigkeit":"leicht","fachhinweis":{"hinweis":"Die unbeschränkte persönliche Haftung des Einzelunternehmers ist richtig. „Gesamtschuldnerisch“ ist hier aber falsch, weil dafür mehrere Schuldner nötig wären.","quelle":"§ 421 BGB","url":"https://www.gesetze-im-internet.de/bgb/__421.html"}},{"id":"q010","thema":"Rechtsformen","frage":"Welcher Nachteil wird der Tätigkeit als Freelancer zugeordnet?","optionen":["Die gemeinsame Haftung für Büro- und Personalkosten","Das Risiko der Scheinselbstständigkeit","Die hohen Gründungs- und Verwaltungskosten","Die gesamtschuldnerische unbeschränkte Haftung"],"richtig":1,"erklaerung":"Als Nachteil des Freelancers wird ausschließlich die **Scheinselbstständigkeit** aufgeführt. Die gemeinsame Haftung für Büro- und Personalkosten gehört zur Partnerschaftsgesellschaft.","quelle":"f44","schwierigkeit":"leicht"},{"id":"q011","thema":"Rechtsformen","frage":"Welche Nachteile werden der UG (haftungsbeschränkt) zugeordnet?","optionen":["Verwaltungskosten, geringe Kreditwürdigkeit und Steuer","Scheinselbstständigkeit, Akquiseaufwand und Steuer","Gründungskosten, unbeschränkte Haftung und Steuer","Verwaltungskosten, gemeinsame Personalkosten und Haftung"],"richtig":0,"erklaerung":"Für die UG (haftungsbeschränkt) werden **Verwaltungskosten, geringe Kreditwürdigkeit und Steuer** als Nachteile genannt. Geringe Gründungskosten zählen bei der UG dagegen zu den Vorteilen.","quelle":"f44","schwierigkeit":"leicht"},{"id":"q012","thema":"Rechtsformen","frage":"Welche Rechtsform hat den Nachteil, dass gemeinsam für Büro- und Personalkosten gehaftet wird?","optionen":["UG (haftungsbeschränkt)","Einzelunternehmen","Partnerschaftsgesellschaft","Freelancer"],"richtig":2,"erklaerung":"Die **gemeinsame Haftung für Büro- und Personalkosten** ist der Nachteil, der der Partnerschaftsgesellschaft zugeordnet wird. Beim Einzelunternehmen steht dagegen die gesamtschuldnerische unbeschränkte Haftung.","quelle":"f44","schwierigkeit":"mittel","fachhinweis":{"hinweis":"Bei der Partnerschaftsgesellschaft haften die Partner für gewöhnliche Verbindlichkeiten grundsätzlich gesamtschuldnerisch. Die Haftung ist nicht nur auf Büro- und Personalkosten beschränkt.","quelle":"§ 8 PartGG","url":"https://www.gesetze-im-internet.de/partgg/__8.html"}},{"id":"q013","thema":"Rechtsformen","frage":"Welcher Nachteil wird der GmbH zugeordnet?","optionen":["Geringe Kreditwürdigkeit sowie hoher Akquiseaufwand","Gemeinsame Haftung für Büro- sowie Personalkosten","Gesamtschuldnerische Haftung sowie Scheinselbstständigkeit","Gründungs- und Verwaltungskosten sowie Steuerproblematik"],"richtig":3,"erklaerung":"Als Nachteil der GmbH werden **Gründungs- und Verwaltungskosten sowie die Steuerproblematik** genannt. Geringe Kreditwürdigkeit ist dagegen ein Nachteil der UG (haftungsbeschränkt).","quelle":"f44","schwierigkeit":"mittel"},{"id":"q014","thema":"Rechtsformen","frage":"Welcher Vorteil wird dem Einzelunternehmen zugeordnet?","optionen":["Sofortiger Start bei geringen Kosten","Flexible Gestaltung der Zusammenarbeit im Team","Haftungsbeschränkung bei geringen Gründungskosten","Wenig Akquiseaufwand bei geringem Risiko"],"richtig":0,"erklaerung":"Für das Einzelunternehmen werden **sofortiger Start und geringe Kosten** als Vorteile genannt. Eine Haftungsbeschränkung besteht hier gerade nicht, da die Haftung unbeschränkt ist.","quelle":"f45","schwierigkeit":"leicht"},{"id":"q015","thema":"Rechtsformen","frage":"Welche Vorteile werden der Tätigkeit als Freelancer zugeordnet?","optionen":["Relativ risikolos und wenig Akquiseaufwand","Relativ risikolos und stark begrenzte Haftung","Sofortiger Start und flexible Gestaltung im Team","Geringe Gründungskosten und eigene Anstellung"],"richtig":0,"erklaerung":"Der Freelancer gilt als **relativ risikolos** und mit **wenig Akquiseaufwand** verbunden. Eine Haftungsbeschränkung oder eigene Anstellung wird ihm nicht zugeschrieben.","quelle":"f45","schwierigkeit":"leicht","fachhinweis":{"hinweis":"„Relativ risikolos“ und „wenig Akquiseaufwand“ sind keine allgemeinen Eigenschaften einer Freelance-Tätigkeit. Das ist eine Einschätzung der Folie, keine belastbare Definition.","quelle":"Einordnung der Folienaussage"}},{"id":"q016","thema":"Rechtsformen","frage":"Welche Vorteile werden der UG (haftungsbeschränkt) zugeordnet?","optionen":["Geringe Verwaltungskosten und hohe Kreditwürdigkeit","Geringe Gründungskosten und Haftungsbeschränkung","Sofortiger Start und wenig Akquiseaufwand","Eigene Anstellung und flexible Gestaltung"],"richtig":1,"erklaerung":"Die UG (haftungsbeschränkt) bietet **geringe Gründungskosten und eine Haftungsbeschränkung**. Verwaltungskosten und geringe Kreditwürdigkeit stehen bei ihr umgekehrt auf der Nachteilsseite.","quelle":"f45","schwierigkeit":"leicht"},{"id":"q017","thema":"Rechtsformen","frage":"Welcher Vorteil wird der GbR zugeordnet?","optionen":["Haftungsbeschränkung für alle Gesellschafter","Solider und kreditwürdiger Auftritt","Flexible Gestaltung im Team","Sofortiger Start bei geringen Kosten"],"richtig":2,"erklaerung":"Der GbR wird als Vorteil die **flexible Gestaltung im Team** zugeschrieben. Eine Haftungsbeschränkung gibt es bei ihr nicht, denn ihr Nachteil ist die gesamtschuldnerische unbeschränkte Haftung.","quelle":"f45","schwierigkeit":"mittel"},{"id":"q018","thema":"Rechtsformen","frage":"Welche Vorteile werden der Partnerschaftsgesellschaft zugeordnet?","optionen":["Sofortiger Start und geringe Gründungskosten","Kreditwürdiger Auftritt und geringes Risiko","Wenig Akquiseaufwand und eigene Anstellung","Haftungsbeschränkung und flexible Gestaltung"],"richtig":3,"erklaerung":"Die Partnerschaftsgesellschaft verbindet **Haftungsbeschränkung und flexible Gestaltung**. Der solide kreditwürdige Auftritt und die eigene Anstellung werden dagegen der GmbH zugeordnet.","quelle":"f45","schwierigkeit":"mittel","fachhinweis":{"hinweis":"Eine normale Partnerschaftsgesellschaft hat keine allgemeine Haftungsbeschränkung. Sonderregeln gelten bei beruflichen Fehlern; eine weitergehende Beschränkung setzt insbesondere eine PartG mbB voraus.","quelle":"§ 8 PartGG","url":"https://www.gesetze-im-internet.de/partgg/__8.html"}},{"id":"q019","thema":"Rechtsformen","frage":"Welche Rechtsformen werden als Kapitalgesellschaften und damit als juristische Personen eingeordnet?","optionen":["GbR und Partnerschaftsgesellschaft","Einzelunternehmen und Freelancer","GmbH und Aktiengesellschaft","Freelancer und Partnerschaftsgesellschaft"],"richtig":2,"erklaerung":"Als Kapitalgesellschaften und damit als juristische Personen gelten die **GmbH** und die **Aktiengesellschaft (AG)**. Einzelunternehmen, GbR, Freelancer und Partnerschaftsgesellschaft zaehlen nicht zu dieser Gruppe.","quelle":"f48","schwierigkeit":"leicht"},{"id":"q020","thema":"Rechtsformen","frage":"Was gilt bei einer GmbH für die Gesellschafter beziehungsweise Eigentümer?","optionen":["Sie haften persönlich und unbeschränkt für die Schulden des Unternehmens.","Sie haften nicht persönlich für die Schulden des Unternehmens.","Sie haften gesamtschuldnerisch für die Büro- und Personalkosten.","Sie haften anteilig mit ihrem Privatvermögen für offene Schulden."],"richtig":1,"erklaerung":"Die GmbH ist eine rechtliche Entität, bei der die Gesellschafter beziehungsweise Eigentümer **nicht persönlich für die Schulden des Unternehmens haften**. Geführt wird sie von einem oder mehreren Geschäftsführern.","quelle":"f48","schwierigkeit":"leicht","fachhinweis":{"hinweis":"Die Haftungsbeschränkung der GmbH gilt grundsätzlich. Persönliche Haftung kann jedoch etwa vor Eintragung, bei Pflichtverletzungen oder nicht erbrachten Einlagen entstehen.","quelle":"§ 13 GmbHG","url":"https://www.gesetze-im-internet.de/gmbhg/__13.html"}},{"id":"q021","thema":"Rechtsformen","frage":"Wodurch ist die Aktiengesellschaft (AG) gekennzeichnet?","optionen":["Das Unternehmen wird von einem oder mehreren Geschäftsführern geführt.","Das Unternehmen gehört einer Person, die unbeschränkt für Schulden haftet.","Das Unternehmen ist in Aktien aufgeteilt, die von Aktionären gehalten werden.","Das Unternehmen wird von Partnern getragen, die gemeinsam für Kosten haften."],"richtig":2,"erklaerung":"Bei der AG ist das Unternehmen **in Aktien aufgeteilt, die von Aktionären gehalten werden**; die Aktionäre haben das Recht, über Angelegenheiten des Unternehmens abzustimmen. Die Führung durch **einen oder mehrere Geschäftsführer** beschreibt dagegen die GmbH.","quelle":"f48","schwierigkeit":"leicht"},{"id":"q022","thema":"Rechtsformen","frage":"Ein Designbüro sucht eine Rechtsform, die Haftungsbeschränkung, einen soliden kreditwürdigen Auftritt und die eigene Anstellung ermöglicht. Welche Rechtsform passt zu diesen Vorteilen?","optionen":["GbR","UG (haftungsbeschränkt)","Einzelunternehmen","GmbH"],"richtig":3,"erklaerung":"Nur der GmbH werden **Haftungsbeschränkung, solider kreditwürdiger Auftritt und eigene Anstellung** gemeinsam als Vorteile zugeordnet. Die UG bietet zwar Haftungsbeschränkung, hat aber gerade eine geringe Kreditwürdigkeit als Nachteil.","quelle":"f44, f45","schwierigkeit":"schwer"},{"id":"q023","thema":"Urheber- und Nutzungsrecht","frage":"Was bezeichnet das Nutzungsrecht?","optionen":["Das Recht, ein Werk zu nutzen, das einem anderen gehört","Das Recht, ein selbst geschaffenes Werk zu veröffentlichen","Das Recht, ein fremdes Werk dauerhaft zu besitzen","Das Recht, ein fremdes Werk nach Belieben zu verändern"],"richtig":0,"erklaerung":"Das **Nutzungsrecht** ist das Recht, **ein Werk zu nutzen oder zu verwenden, das einem anderen gehört**. Es verschafft keinen Besitz am Werk, sondern nur eine Nutzungsbefugnis.","quelle":"f30","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Ein Nutzungsrecht betrifft nicht zwingend ein Werk, das dem Urheber „gehört“. Präzise ist es die vom Urheber eingeräumte Befugnis, ein Werk auf bestimmte Art zu nutzen.","quelle":"§ 31 UrhG","url":"https://www.gesetze-im-internet.de/urhg/__31.html"}},{"id":"q024","thema":"Urheber- und Nutzungsrecht","frage":"Zwischen welchen Parteien wird ein Nutzungsrecht festgelegt?","optionen":["Zwischen dem Inhaber des Urheberrechts und dem Nutzer des Werks","Zwischen dem Eigentümer des Werkstücks und dem Urheber des Werks","Zwischen dem Nutzer des Werks und einer staatlichen Registerstelle","Zwischen dem Auftraggeber des Werks und dem Käufer des Werkstücks"],"richtig":0,"erklaerung":"Das Nutzungsrecht ist eine **Vereinbarung zwischen dem Inhaber des Urheberrechts und dem Nutzer des Werks**. Es entsteht also vertraglich zwischen diesen beiden Seiten.","quelle":"f30","schwierigkeit":"leicht","wiederholung":true},{"id":"q025","thema":"Urheber- und Nutzungsrecht","frage":"Welche Bedingungen werden beim Erwerb eines Nutzungsrechts typischerweise geregelt?","optionen":["Art und Weise der Nutzung, Dauer der Nutzung und Höhe der Vergütung","Art und Weise der Nutzung, Ort der Herstellung und Höhe der Steuerlast","Anzahl der Miturheber, Dauer der Nutzung und Höhe der Herstellkosten","Ort der Veröffentlichung, Anzahl der Abnehmer und Höhe des Gewinns"],"richtig":0,"erklaerung":"Ein Nutzungsrecht wird in der Regel unter bestimmten Bedingungen eingeräumt, nämlich **Art und Weise der Nutzung, Dauer der Nutzung und Höhe der Vergütung**.","quelle":"f30","schwierigkeit":"leicht","wiederholung":true},{"id":"q026","thema":"Urheber- und Nutzungsrecht","frage":"Worauf bezieht sich das Eigentum?","optionen":["Auf das Recht, eine Sache zu besitzen und zu kontrollieren","Auf das Recht, eine kreative Arbeit zu schaffen und zu gestalten","Auf das Recht, ein fremdes Werk fuer begrenzte Zeit zu nutzen","Auf das Recht, ein geschütztes Werk öffentlich wiederzugeben"],"richtig":0,"erklaerung":"**Eigentum** bezieht sich auf das Recht, **eine Sache zu besitzen und zu kontrollieren**, etwa ein Haus, ein Auto oder ein Patent. Das Schaffen einer kreativen Arbeit und das Bestimmen über deren Nutzung gehört dagegen zur **Urheberschaft**, die befristete Nutzung eines fremden Werks zum **Nutzungsrecht**.","quelle":"f31","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Eigentum und Besitz sind rechtlich verschieden. Außerdem ist ein Patent keine „Sache“, weil Sachen nach dem BGB nur körperliche Gegenstände sind.","quelle":"§§ 90, 903 BGB","url":"https://www.gesetze-im-internet.de/bgb/__90.html"}},{"id":"q027","thema":"Urheber- und Nutzungsrecht","frage":"Welche Befugnisse gibt das Eigentumsrecht dem Eigentümer?","optionen":["Die Sache zu verkaufen, zu vermieten und auch zu zerstören","Die Sache zu verkaufen und zu vermieten, nicht aber zu zerstören","Die Sache zu vermieten und zu zerstören, nicht aber zu verkaufen","Die Sache zu verkaufen und zu zerstören, nicht aber zu vermieten"],"richtig":0,"erklaerung":"Das Eigentumsrecht gibt dem Eigentümer die Befugnis, **mit der Sache nach Belieben zu verfahren: sie zu verkaufen, zu vermieten oder zu zerstören**. Keine dieser drei Handlungen ist ausgenommen – abzugrenzen davon ist die **Urheberschaft**, die das geistige Eigentum an einer kreativen Arbeit schützt.","quelle":"f31","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Der Eigentümer darf nur verfahren, soweit Gesetze und Rechte Dritter nicht entgegenstehen. Verkaufen, vermieten oder zerstören ist daher keine schrankenlose Befugnis.","quelle":"§ 903 BGB","url":"https://www.gesetze-im-internet.de/bgb/__903.html"}},{"id":"q028","thema":"Urheber- und Nutzungsrecht","frage":"Was schützt das Urheberrecht?","optionen":["Das geistige Eigentum eines Autors, Komponisten oder Künstlers","Das Sacheigentum eines Käufers, Händlers oder Sammlers","Das Betriebsvermögen eines Verlags, Studios oder Labels","Das Kapitaleigentum eines Auftraggebers, Kunden oder Investors"],"richtig":0,"erklaerung":"Das Urheberrecht schützt das **geistige Eigentum eines Autors, Komponisten oder Künstlers** und gibt dem Urheber das Recht zu entscheiden, wer sein Werk nutzen darf und wer dafür bezahlen muss.","quelle":"f31","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q029","thema":"Urheber- und Nutzungsrecht","frage":"Welche Aufzählung nennt Beispiele für Eigentum und nicht für Urheberschaft?","optionen":["Haus, Auto und Patent","Roman, Musikstück und Bild","Logo, Illustration und Foto","Drehbuch, Gedicht und Song"],"richtig":0,"erklaerung":"Zum **Eigentum** zählen **Haus, Auto und Patent** – Sachen, die man besitzen und kontrollieren kann. Die übrigen Aufzählungen bestehen aus kreativen Arbeiten und gehören damit zur **Urheberschaft**.","quelle":"f31","schwierigkeit":"mittel","wiederholung":true,"fachhinweis":{"hinweis":"Eigentum und Besitz sind rechtlich verschieden. Außerdem ist ein Patent keine „Sache“, weil Sachen nach dem BGB nur körperliche Gegenstände sind.","quelle":"§§ 90, 903 BGB","url":"https://www.gesetze-im-internet.de/bgb/__90.html"}},{"id":"q030","thema":"Urheber- und Nutzungsrecht","frage":"Wann entsteht das Urheberrecht an einem Werk?","optionen":["Automatisch, sobald das Werk geschaffen wird","Erst mit der Eintragung des Werks in ein Register","Erst mit der ersten Veröffentlichung des Werks","Automatisch, sobald ein Nutzungsvertrag geschlossen wird"],"richtig":0,"erklaerung":"Das Urheberrecht entsteht **automatisch, wenn ein Werk geschaffen wird**. Weder Registrierung noch Veröffentlichung oder Vertrag sind dafür erforderlich.","quelle":"f32","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Urheberrechtsschutz entsteht ohne Registrierung, aber nicht automatisch für jedes Arbeitsergebnis. Erforderlich ist ein schutzfähiges Werk als persönliche geistige Schöpfung.","quelle":"§ 2 UrhG","url":"https://www.gesetze-im-internet.de/urhg/__2.html"}},{"id":"q031","thema":"Urheber- und Nutzungsrecht","frage":"Wovor schützt das Urheberrecht ein Werk?","optionen":["Vor unbefugter Vervielfältigung, Verbreitung und öffentlicher Wiedergabe","Vor unbefugter Beschädigung, Entwendung und Weiterveräußerung","Vor unbefugter Nachahmung von Marken, Namen und Firmenzeichen","Vor unbefugter Preisgestaltung, Vermietung und Verpfändung"],"richtig":0,"erklaerung":"Das Urheberrecht schützt das Werk vor **unbefugter Vervielfältigung, Verbreitung, öffentlicher Wiedergabe, Bearbeitung und anderer Nutzung durch Dritte**. Es schützt damit die Verwendung des Werks, nicht die körperliche Sache.","quelle":"f32","schwierigkeit":"mittel","essential":true,"wiederholung":true},{"id":"q032","thema":"Urheber- und Nutzungsrecht","frage":"In welchen drei Dimensionen können Nutzungsrechte beschränkt übertragen werden?","optionen":["Räumlich, zeitlich und inhaltlich","Räumlich, zeitlich und personell","Formal, zeitlich und inhaltlich","Räumlich, finanziell und inhaltlich"],"richtig":0,"erklaerung":"Nutzungsrechte können **räumlich, zeitlich und inhaltlich** beschränkt übertragen werden. Diese drei Dimensionen bestimmen den Umfang der Rechteübertragung.","quelle":"f33, f34","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q033","thema":"Urheber- und Nutzungsrecht","frage":"Welche Angaben beschreiben die räumliche Beschränkung eines Nutzungsrechts?","optionen":["International, weltweit, europaweit oder nur regional","Einmalig, mehrfach, seriell oder dauerhaft wiederholt","Für ein Jahr, fünf Jahre, zehn Jahre oder unbegrenzt","Für ein Medium, zwei Medien, mehrere Medien oder alle"],"richtig":0,"erklaerung":"Die **räumliche Nutzung** wird mit Angaben wie **international, weltweit, europaweit oder nur regional** festgelegt. Jahresangaben betreffen die zeitliche, Medienangaben die inhaltliche Beschränkung.","quelle":"f33","schwierigkeit":"mittel","wiederholung":true},{"id":"q034","thema":"Urheber- und Nutzungsrecht","frage":"Was legt die inhaltliche Beschränkung eines Nutzungsrechts fest?","optionen":["Für wie viele Medien das Werk genutzt werden darf","Für wie viele Jahre das Werk genutzt werden darf","In welchen Ländern das Werk genutzt werden darf","Von wie vielen Kunden das Werk genutzt werden darf"],"richtig":0,"erklaerung":"Die **inhaltliche Nutzung** beschreibt, **für wie viele Medien das Werk genutzt wird**, und definiert damit das Ausmaß der Vervielfältigung.","quelle":"f33","schwierigkeit":"mittel","wiederholung":true,"fachhinweis":{"hinweis":"Eine inhaltliche Beschränkung regelt erlaubte Nutzungsarten oder Medien. Sie bedeutet nicht lediglich, dass eine bestimmte Anzahl von Medien festgelegt wird.","quelle":"§ 31 UrhG","url":"https://www.gesetze-im-internet.de/urhg/__31.html"}},{"id":"q035","thema":"Urheber- und Nutzungsrecht","frage":"Welche Zeitspannen können bei der zeitlichen Beschränkung eines Nutzungsrechts vereinbart werden?","optionen":["Von einem Jahr über fünf und zehn Jahre bis zeitlich unbegrenzt","Von einem Jahr über fünf und zehn Jahre bis höchstens 30 Jahre","Von drei Monaten über ein Jahr und drei Jahre bis höchstens fünf Jahre","Von fünf Jahren über zehn und zwanzig Jahre bis höchstens 70 Jahre"],"richtig":0,"erklaerung":"Die **zeitliche Nutzung** kann von **1 Jahr, 5 Jahren und 10 Jahren bis zeitlich unbegrenzt** vereinbart werden, eine feste Höchstgrenze gibt es nicht. Die **70 Jahre** betreffen dagegen die **Gemeinfreiheit** und nicht die Dauer eines Nutzungsrechts.","quelle":"f33","schwierigkeit":"mittel","wiederholung":true,"fachhinweis":{"hinweis":"Ein Nutzungsrecht kann ohne feste vertragliche Laufzeit eingeräumt werden, endet aber spätestens mit dem zugrunde liegenden Urheberrecht. „Zeitlich unbegrenzt“ ist deshalb missverständlich.","quelle":"§ 64 UrhG","url":"https://www.gesetze-im-internet.de/urhg/__64.html"}},{"id":"q036","thema":"Urheber- und Nutzungsrecht","frage":"Nach welchem Zeitraum gilt ein Werk als gemeinfrei?","optionen":["Nach 70 Jahren","Nach 50 Jahren","Nach 30 Jahren","Nach 100 Jahren"],"richtig":0,"erklaerung":"Als Ausnahme vom Schutz gilt die **Gemeinfreiheit nach 70 Jahren**. Erst danach ist eine Nutzung ohne Rechteeinräumung möglich.","quelle":"f34","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Die Regelschutzfrist endet 70 Jahre nach dem Tod des Urhebers, nicht pauschal 70 Jahre nach Entstehung oder Veröffentlichung. Auch „Wissenschaft“ ist keine allgemeine Ausnahme, sondern nur im Rahmen konkreter gesetzlicher Schranken relevant.","quelle":"§§ 60a ff., 64 UrhG","url":"https://www.gesetze-im-internet.de/urhg/__64.html"}},{"id":"q037","thema":"Urheber- und Nutzungsrecht","frage":"Was ist vor der Nutzung eines Bildes erforderlich?","optionen":["Die schriftliche Zustimmung sämtlicher Rechteinhaber","Die mündliche Zustimmung des wichtigsten Rechteinhabers","Die schriftliche Anzeige bei einer zuständigen Verwertungsstelle","Die nachträgliche Vergütung an den bekannten Rechteinhaber"],"richtig":0,"erklaerung":"Vor der Nutzung von Bildern braucht es die **schriftliche Zustimmung sämtlicher Rechteinhaber**. Eine mündliche oder nur teilweise Zustimmung reicht nicht aus.","quelle":"f34","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Eine schriftliche Zustimmung sämtlicher Rechteinhaber ist nicht immer erforderlich. Nutzung kann bereits lizenziert, gesetzlich erlaubt oder wegen Gemeinfreiheit zustimmungsfrei sein; Nutzungsrechte können grundsätzlich auch formfrei eingeräumt werden.","quelle":"§§ 31, 44a ff. UrhG","url":"https://www.gesetze-im-internet.de/urhg/__31.html"}},{"id":"q038","thema":"Urheber- und Nutzungsrecht","frage":"Welcher Begriff wird mit dem Nutzungsrecht gleichgesetzt?","optionen":["Verwertungsrecht","Eigentumsrecht","Urheberrecht","Urheberschaft"],"richtig":0,"erklaerung":"Es gilt: **Nutzungsrecht = Verwertungsrecht**, und dieses ist ausdrücklich **nicht** mit dem Eigentumsrecht bzw. Urheberrecht gleichzusetzen.","quelle":"f34","schwierigkeit":"mittel","wiederholung":true,"fachhinweis":{"hinweis":"Nutzungsrecht und Verwertungsrecht sind keine Synonyme. Verwertungsrechte stehen dem Urheber zu; Nutzungsrechte werden einem Nutzer daran eingeräumt.","quelle":"§§ 15, 31 UrhG","url":"https://www.gesetze-im-internet.de/urhg/__15.html"}},{"id":"q039","thema":"Urheber- und Nutzungsrecht","frage":"Welche der genannten Konstellationen ist eine Ausnahme, bei der ein Werk auch ohne eingeräumtes Nutzungsrecht verwendet werden kann?","optionen":["Zitatrecht und Panoramafreiheit","Markenschutz und Firmenrecht","Vertragsstrafe und Gewährleistung","Wettbewerbsrecht und Preisbindung"],"richtig":0,"erklaerung":"Als Ausnahmen werden **Gemeinfreiheit, Wissenschaft, Zitatrecht sowie Panoramafreiheit/Beiwerk** genannt. Marken-, Wettbewerbs- oder Vertragsfragen gehören nicht dazu.","quelle":"f34","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Zitatrecht, Panoramafreiheit, Beiwerk und Wissenschaft gelten nur unter jeweils engen gesetzlichen Voraussetzungen. Sie sind keine pauschalen Freigaben für jede Nutzung.","quelle":"§§ 51, 57, 59, 60a ff. UrhG","url":"https://www.gesetze-im-internet.de/urhg/__51.html"}},{"id":"q040","thema":"Urheber- und Nutzungsrecht","frage":"Welcher Zusammenhang gilt bei der Kalkulation von Nutzungsrechten?","optionen":["Eingeschränkte Honorierung bedeutet eingeschränkte Übertragung","Eingeschränkte Honorierung bedeutet unbeschränkte Übertragung","Umfassende Honorierung bedeutet eingeschränkte Übertragung","Eingeschränkte Übertragung bedeutet umfassende Honorierung"],"richtig":0,"erklaerung":"Für die Kalkulation gilt: **eingeschränkte Honorierung = eingeschränkte Übertragung**. Umfang des Honorars und Umfang der eingeräumten Rechte entsprechen sich.","quelle":"f34","schwierigkeit":"mittel","essential":true,"wiederholung":true},{"id":"q041","thema":"Urheber- und Nutzungsrecht","frage":"Was bedeuten exklusive (ausschließliche) Nutzungsrechte?","optionen":["Der Kunde erhält das alleinige Recht, das Design zu nutzen","Der Kunde erhält das Recht, das Design an Dritte zu verkaufen","Der Designer erhält das Recht, das Design weiter zu lizenzieren","Der Designer erhält das alleinige Recht, das Design zu verändern"],"richtig":0,"erklaerung":"**Exklusive (ausschließliche) Rechte** geben dem Kunden das **alleinige Recht, das Design zu nutzen**. Eine Weiterlizenzierung durch den Designer ist damit ausgeschlossen.","quelle":"f35","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Ein ausschließliches Nutzungsrecht schließt den Urheber nicht zwingend vollständig aus. Die eigene Nutzung kann vertraglich vorbehalten werden.","quelle":"§ 31 Abs. 3 UrhG","url":"https://www.gesetze-im-internet.de/urhg/__31.html"}},{"id":"q042","thema":"Urheber- und Nutzungsrecht","frage":"Was kennzeichnet nicht-exklusive (einfache) Nutzungsrechte?","optionen":["Der Designer darf das Design auch an andere Kunden lizenzieren","Der Kunde darf das Design auch an andere Kunden weitergeben","Der Designer darf das Design nach der Übergabe nicht mehr nutzen","Der Kunde darf das Design nur einmalig und regional einsetzen"],"richtig":0,"erklaerung":"Bei **nicht-exklusiven (einfachen) Rechten** darf der Kunde das Design nutzen, **der Designer darf es aber zusätzlich an andere Kunden lizenzieren**.","quelle":"f35","schwierigkeit":"leicht","wiederholung":true},{"id":"q043","thema":"Urheber- und Nutzungsrecht","frage":"Eine Illustration wird einem Verlag für die europaweite Nutzung, für die Dauer von fünf Jahren und für nur ein einziges Medium überlassen. Wie ist dieses Nutzungsrecht beschränkt?","optionen":["Räumlich beschränkt, zeitlich beschränkt, inhaltlich beschränkt","Räumlich beschränkt, zeitlich beschränkt, inhaltlich unbeschränkt","Räumlich unbeschränkt, zeitlich beschränkt, inhaltlich beschränkt","Räumlich beschränkt, zeitlich unbeschränkt, inhaltlich beschränkt"],"richtig":0,"erklaerung":"Nutzungsrechte können **räumlich**, **zeitlich** und **inhaltlich** beschränkt übertragen werden: \"europaweit\" betrifft den Raum, \"fünf Jahre\" die Zeit, die Begrenzung auf ein einziges Medium den Inhalt (Anzahl der Medien). Damit greifen hier alle drei Beschränkungsarten gleichzeitig.","quelle":"f33","schwierigkeit":"mittel","wiederholung":true},{"id":"q044","thema":"Urheber- und Nutzungsrecht","frage":"Eine Designerin überlässt dieselbe Bildserie mehreren Kunden gleichzeitig und darf sie weiterhin an weitere Kunden vergeben. Welche Art von Nutzungsrecht liegt vor?","optionen":["Ein einfaches, also nicht-exklusives Nutzungsrecht","Ein ausschließliches, also exklusives Nutzungsrecht","Ein vollständig übertragenes Urheberrecht an der Bildserie","Ein zeitlich unbeschränktes Eigentumsrecht an der Bildserie"],"richtig":0,"erklaerung":"Weil die Designerin die Bildserie weiterhin an andere Kunden lizenzieren darf, handelt es sich um ein **einfaches (nicht-exklusives) Nutzungsrecht**. Ein exklusives Recht gäbe einem einzigen Kunden das alleinige Nutzungsrecht.","quelle":"f35","schwierigkeit":"schwer","wiederholung":true},{"id":"q045","thema":"Businessplan und Gründung","frage":"Mit welchem Bestandteil beginnt ein Businessplan?","optionen":["Mit der Executive Summary, einer kurzen Zusammenfassung der Geschäftsidee","Mit der Zielgruppe, einer genauen Beschreibung der Kundenbedürfnisse","Mit der Marktanalyse, einer Bewertung der wichtigsten Konkurrenzbetriebe","Mit der Finanzplanung, einer Übersicht der erwarteten Kosten und Erlöse"],"richtig":0,"erklaerung":"Ein Businessplan beginnt mit der **Executive Summary**: einer kurzen Zusammenfassung der Geschäftsidee, die die wichtigsten Punkte des gesamten Plans umfasst. Die Analyse von Markt und Konkurrenz gehört erst zum nachfolgenden Punkt **Geschäftsidee**, die Zielgruppe folgt danach.","quelle":"f15","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q046","thema":"Businessplan und Gründung","frage":"Welche vier Säulen des Geschäftsmodells werden unterschieden?","optionen":["Wer, was, wie und wie viel","Wer, wann, wo und wie viel","Was, wann, wie und wie oft","Wer, was, warum und wie oft"],"richtig":0,"erklaerung":"Die vier Säulen des Geschäftsmodells lauten **wer, was, wie und wie viel**. Fragen nach Zeitpunkt, Ort oder Häufigkeit gehören nicht zu diesen vier Säulen.","quelle":"f17","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q047","thema":"Businessplan und Gründung","frage":"Welche Bestandteile gehören in einen Businessplan?","optionen":["Executive Summary, Idee, Motivation, Team/Netzwerk, Finanzen, Marketing","Executive Summary, Idee, Satzung, Gesellschaftsvertrag, Finanzen, Vertrieb","Deckblatt, Idee, Motivation, Handelsregisterauszug, Steuern, Marketing","Executive Summary, Bilanz, Motivation, Team/Netzwerk, Steuern, Vertrieb"],"richtig":0,"erklaerung":"Als Inhalte eines Businessplans werden **Executive Summary, Idee, Motivation, Team/Netzwerk, Finanzen und Marketing** genannt. Dokumente wie Satzung, Gesellschaftsvertrag oder Handelsregisterauszug zählen nicht dazu.","quelle":"f17","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q048","thema":"Businessplan und Gründung","frage":"Wozu benötigen Investoren und Kreditgeber häufig einen Businessplan?","optionen":["Um die Tragfähigkeit und Rentabilität des Geschäftsvorhabens zu beurteilen","Um die Haftungsverhältnisse und die Rechtsform des Vorhabens zu prüfen","Um die Steuerlast und die Abschreibungen des Vorhabens zu ermitteln","Um die Mitarbeiterzahl und die Personalkosten des Vorhabens zu planen"],"richtig":0,"erklaerung":"Investoren und Kreditgeber verlangen einen Businessplan, um **Tragfähigkeit und Rentabilität** eines Geschäftsvorhabens beurteilen zu können. Rechtsform, Steuern oder Personalplanung sind nicht der genannte Zweck.","quelle":"f21","schwierigkeit":"leicht","wiederholung":true},{"id":"q049","thema":"Businessplan und Gründung","frage":"Aus welchem Grund wird ein Businessplan erstellt?","optionen":["Zur Klärung, Planung und Kontrolle des Vorhabens","Zur Werbung, Verkaufsförderung und Kundenbindung","Zur Buchführung, Bilanzierung und Steuererklärung","Zur Anmeldung, Genehmigung und Eintragung des Betriebs"],"richtig":0,"erklaerung":"Als Gründe für einen Businessplan werden **Klärung, Planung und Kontrolle** genannt, mit Blick auf die Wirtschaftlichkeit. Werbung, Buchführung oder behördliche Anmeldungen sind nicht der Zweck des Businessplans.","quelle":"f17","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q050","thema":"Businessplan und Gründung","frage":"Welche Stelle gehört zu den möglichen Adressaten eines Businessplans?","optionen":["Das Arbeitsamt","Das Finanzamt","Die Handelskammer","Die Berufsgenossenschaft"],"richtig":0,"erklaerung":"Zu den möglichen Adressaten zählen Bank, **Arbeitsamt**, Gründer, Investor und Finanzgeber. Finanzamt, Handelskammer und Berufsgenossenschaft gehören nicht zu diesem Kreis.","quelle":"f17","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"„Arbeitsamt“ ist eine veraltete Behördenbezeichnung. Heute sind je nach Aufgabe die Bundesagentur für Arbeit oder das Jobcenter zuständig; die Steuer-ID wird nur in steuerlich relevanten Verfahren benötigt.","quelle":"Bundesagentur für Arbeit","url":"https://www.arbeitsagentur.de/ueber-uns"}},{"id":"q051","thema":"Businessplan und Gründung","frage":"Für wen ist ein Businessplan in erster Linie gedacht?","optionen":["In erster Linie für die Gründerin oder den Gründer selbst","In erster Linie für die kreditgebende Bank des Unternehmens","In erster Linie für das zuständige Arbeitsamt der Region","In erster Linie für externe Investoren und Finanzgeber"],"richtig":0,"erklaerung":"Auch wenn Bank, Arbeitsamt, Investoren und Finanzgeber als Adressaten in Frage kommen, ist der Businessplan **vor allem für einen selbst** gedacht. Die externen Adressaten sind nachrangig.","quelle":"f17","schwierigkeit":"mittel","wiederholung":true},{"id":"q052","thema":"Businessplan und Gründung","frage":"Was verlangt der Businessplan im Kapitel zur Geschäftsidee?","optionen":["Den Markt und die Konkurrenz analysieren und die Abgrenzung erläutern","Die Bedürfnisse und Wünsche der künftigen Kundschaft beschreiben","Die wichtigsten Punkte des gesamten Businessplans zusammenfassen","Die Kosten und die erwarteten Umsätze der ersten Jahre aufstellen"],"richtig":0,"erklaerung":"Im Kapitel Geschäftsidee werden die Produkte oder Dienstleistungen beschrieben sowie **Markt und Konkurrenz analysiert** und erläutert, wie man sich von anderen Unternehmen unterscheiden möchte. Kundenbedürfnisse gehören zur Zielgruppe, die Zusammenfassung zur Executive Summary.","quelle":"f15","schwierigkeit":"mittel","essential":true,"wiederholung":true},{"id":"q053","thema":"Businessplan und Gründung","frage":"Welche Aufgabe hat das Kapitel Zielgruppe in einem Businessplan?","optionen":["Die Zielgruppe identifizieren, ihre Bedürfnisse beschreiben und deren Erfüllung erklären","Die Konkurrenz analysieren, ihre Produkte beschreiben und die eigene Abgrenzung erklären","Das Team vorstellen, seine Aufgaben beschreiben und die Rollenverteilung erklären","Den Standort auswählen, seine Vorteile beschreiben und die laufenden Kosten erklären"],"richtig":0,"erklaerung":"Im Kapitel Zielgruppe wird die Zielgruppe identifiziert, es werden **deren Bedürfnisse und Wünsche** beschrieben und es wird erklärt, wie die eigenen Produkte oder Dienstleistungen diese Bedürfnisse erfüllen. Die Analyse von **Markt und Konkurrenz** samt Abgrenzung gehört dagegen in das Kapitel Geschäftsidee.","quelle":"f15","schwierigkeit":"leicht","wiederholung":true},{"id":"q054","thema":"Businessplan und Gründung","frage":"Ein seit Jahren bestehendes Designbüro möchte zusätzlich einen Bereich für Fotografie aufbauen. Wie ist ein Businessplan hier einzuordnen?","optionen":["Er ist sinnvoll, weil auch etablierte Unternehmen bei neuen Geschäftsbereichen profitieren"
