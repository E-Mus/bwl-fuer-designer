insische Motivation** vor; Lob **wirkt hier verstärkend**. Als auslösender externer Anreiz gilt Lob nur bei extrinsischer Motivation.","quelle":"f04","schwierigkeit":"schwer","wiederholung":true},{"id":"q160","thema":"Personal, Motivation und Lob","frage":"Ein Mitarbeiter übernimmt eine zusätzliche Aufgabe vor allem deshalb, weil ihm dafür eine Bonuszahlung zugesagt wurde. Welche Motivationsform liegt vor und warum?","optionen":["Intrinsische Motivation, da die Motivation aus persönlichem Interesse von innen entsteht","Intrinsische Motivation, da das Vergnügen an der Aufgabe selbst im Vordergrund steht","Extrinsische Motivation, da die Motivation durch äußere Anreize wie Belohnungen entsteht","Extrinsische Motivation, da das persönliche Interesse an der Aufgabe im Vordergrund steht"],"richtig":2,"erklaerung":"Die zugesagte Bonuszahlung ist ein **äußerer Anreiz**, damit liegt **extrinsische Motivation** vor. Intrinsische Motivation läge nur vor, wenn die Aufgabe selbst aus persönlichem Interesse heraus angegangen würde.","quelle":"f04","schwierigkeit":"schwer","wiederholung":true},{"id":"q161","thema":"Geld, Finanzen und Altersvorsorge","frage":"Welche Bezeichnung zählt zu den Funktionen des Geldes?","optionen":["Wertschöpfungsmittel","Wertverrechnungsmittel","Wertübertragungsmittel","Wertberichtigungsmittel"],"richtig":2,"erklaerung":"Zu den Funktionen des Geldes zählen Zahlungsmittel, Wertmesser, Wertaufbewahrungsmittel, **Wertübertragungsmittel** und Freiheit. Die übrigen Begriffe gehören nicht zu dieser Aufzählung.","quelle":"f20","schwierigkeit":"mittel","wiederholung":true,"fachhinweis":{"hinweis":"Üblicherweise werden drei Kernfunktionen unterschieden: Zahlungsmittel, Recheneinheit beziehungsweise Wertmesser und Wertaufbewahrungsmittel. „Wertübertragungsmittel“ kann daraus abgeleitet werden; „Freiheit“ ist keine eigenständige Standardfunktion.","quelle":"Deutsche Bundesbank","url":"https://www.bundesbank.de/de/aufgaben/themen/vertrauen-kern-des-geldes-663226"}},{"id":"q162","thema":"Geld, Finanzen und Altersvorsorge","frage":"Was ist mit dem Begriff Money Mindset gemeint?","optionen":["Die Denkweise \"Ich bin finanziell erfolgreich!\"","Die feste Aufteilung des Einkommens in Sparquoten","Die Übersicht über Einnahmen und Ausgaben im Haushalt","Die Verteilung des Vermögens auf mehrere Anlagen"],"richtig":0,"erklaerung":"Money Mindset bezeichnet die **Denkweise** \"Ich bin finanziell erfolgreich!\". Es geht also um die innere Haltung zum Geld, nicht um eine konkrete Spar- oder Anlagetechnik.","quelle":"f20","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q163","thema":"Geld, Finanzen und Altersvorsorge","frage":"Womit wird Liquidität beschrieben?","optionen":["Mit Planbarkeit und verfügbarem Vermögen","Mit Renditechancen und langfristigem Wertzuwachs","Mit Zinserträgen und deren erneuter Anlage","Mit Beteiligungen und jährlichen Gewinnanteilen"],"richtig":0,"erklaerung":"Liquidität steht für **Planbarkeit** und **verfügbares Vermögen**, also für Geld, über das man tatsächlich verfügen kann. Rendite und Zinserträge beschreiben dagegen den Ertrag einer Anlage.","quelle":"f20","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Liquidität bedeutet die Fähigkeit, fällige Zahlungsverpflichtungen erfüllen zu können. „Planbarkeit und verfügbares Vermögen“ ist keine ausreichende fachliche Definition.","quelle":"Fachliche Liquiditätsdefinition"}},{"id":"q164","thema":"Geld, Finanzen und Altersvorsorge","frage":"Was beschreibt der Zinses-Zins-Effekt?","optionen":["Zinsen einer Geldanlage werden wieder angelegt und mitverzinst","Zinsen einer Geldanlage werden jährlich ausgezahlt und verbraucht","Zinssätze steigen mit zunehmender Laufzeit einer Geldanlage","Zinserträge werden regelmäßig an die Inflationsrate angepasst"],"richtig":0,"erklaerung":"Beim Zinses-Zins-Effekt werden die Zinsen einer Geldanlage **wieder reinvestiert und mitverzinst**, sodass sich das Geld von selbst vermehrt. Ausgezahlte und verbrauchte Zinsen erzeugen diesen Effekt gerade nicht.","quelle":"f20","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q165","thema":"Geld, Finanzen und Altersvorsorge","frage":"Wie teilt die 50-30-20-Regel das Geld auf?","optionen":["50 % Fixkosten, 30 % Freizeit/Konsum, 20 % sparen","50 % Fixkosten, 30 % sparen, 20 % Freizeit/Konsum","50 % Freizeit/Konsum, 30 % Fixkosten, 20 % sparen","50 % sparen, 30 % Fixkosten, 20 % Freizeit/Konsum"],"richtig":0,"erklaerung":"Die 50-30-20-Regel sieht **50 % für Fixkosten**, **30 % für Freizeit und Konsum** und **20 % zum Sparen** vor. Entscheidend ist die Reihenfolge der drei Kategorien.","quelle":"f20","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q166","thema":"Geld, Finanzen und Altersvorsorge","frage":"Bei einem monatlichen Betrag von 2.000 Euro: Welche Aufteilung ergibt sich nach der 50-30-20-Regel?","optionen":["1.000 Euro Fixkosten, 600 Euro Freizeit/Konsum, 400 Euro sparen","1.000 Euro Fixkosten, 400 Euro Freizeit/Konsum, 600 Euro sparen","600 Euro Fixkosten, 1.000 Euro Freizeit/Konsum, 400 Euro sparen","800 Euro Fixkosten, 700 Euro Freizeit/Konsum, 500 Euro sparen"],"richtig":0,"erklaerung":"50 % von 2.000 Euro sind **1.000 Euro Fixkosten**, 30 % sind **600 Euro für Freizeit und Konsum**, 20 % sind **400 Euro zum Sparen**.","quelle":"f20","schwierigkeit":"schwer","wiederholung":true},{"id":"q167","thema":"Geld, Finanzen und Altersvorsorge","frage":"Was ist eine Aktie?","optionen":["Eine Beteiligung an einem Unternehmen","Ein Anteil am jährlichen Reingewinn eines Unternehmens","Ein börsengehandelter Fonds auf einen Index","Ein verzinstes Darlehen an ein Unternehmen"],"richtig":0,"erklaerung":"Aktien sind eine **Beteiligung an Unternehmen**. Der jährliche Gewinnanteil je Aktie heißt dagegen Dividende, und ein börsengehandelter Indexfonds ist ein ETF.","quelle":"f20","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q168","thema":"Geld, Finanzen und Altersvorsorge","frage":"Was bezeichnet die Dividende?","optionen":["Den jährlich auf eine Aktie entfallenden Anteil vom Reingewinn","Den Kursgewinn, der beim Verkauf einer Aktie erzielt wird","Den Anteil am Unternehmen, den eine Aktie insgesamt verbrieft","Den jährlich auf ein Sparguthaben gezahlten Zinsbetrag"],"richtig":0,"erklaerung":"Die Dividende ist der **jährlich auf eine Aktie entfallende Anteil vom Reingewinn**. Die Beteiligung am Unternehmen selbst ist die Aktie, nicht die Dividende.","quelle":"f20","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Eine Dividende ist nicht zwingend jährlich und kein automatischer Anteil am Reingewinn. Die Hauptversammlung beschließt eine Ausschüttung aus dem Bilanzgewinn.","quelle":"§§ 58, 174 AktG","url":"https://www.gesetze-im-internet.de/aktg/__174.html"}},{"id":"q169","thema":"Geld, Finanzen und Altersvorsorge","frage":"Wofür steht die Abkürzung ETF und was bezeichnet sie?","optionen":["Exchange Traded Fund – ein börsengehandelter Indexfonds","Equity Trading Fund – ein außerbörslich gehandelter Aktienfonds","European Trust Fonds – ein staatlich geförderter Rentenfonds","Exchange Transfer Fund – ein börsengehandelter Mischfonds"],"richtig":0,"erklaerung":"ETF steht für **Exchange Traded Fund** und bezeichnet einen **börsengehandelten Indexfonds**. Die anderen Auflösungen der Abkürzung gibt es in dieser Form nicht.","quelle":"f20","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"ETF bedeutet Exchange Traded Fund, also börsengehandelter Fonds. Viele ETFs bilden passiv einen Index ab, aber es gibt auch aktiv verwaltete ETFs; „Indexfonds“ ist daher nicht Teil der allgemeinen Definition.","quelle":"BaFin: ETFs","url":"https://www.bafin.de/DE/Verbraucher/GeldanlageWertpapiere/Produkte/ETF/ETF_node.html"}},{"id":"q170","thema":"Geld, Finanzen und Altersvorsorge","frage":"Worum handelt es sich beim Altersvorsorge-Depot?","optionen":["Um eine Reform der geförderten privaten Altersvorsorge mit renditeorientierter Ausrichtung","Um eine Reform der gesetzlichen Rentenversicherung mit garantierter Mindestverzinsung","Um eine Ergänzung der betrieblichen Altersvorsorge mit verpflichtendem Arbeitgeberanteil","Um eine Neuregelung der privaten Krankenvorsorge mit fest vorgegebener Sparquote"],"richtig":0,"erklaerung":"Das Altersvorsorge-Depot ist eine **Reform der geförderten privaten Altersvorsorge** und stellt eine **renditeorientierte** Vorsorgemöglichkeit dar. Entscheidend ist die Abgrenzung: Es verändert weder die gesetzliche Rentenversicherung noch die betriebliche Altersvorsorge.","quelle":"f19","schwierigkeit":"leicht"},{"id":"q171","thema":"Geld, Finanzen und Altersvorsorge","frage":"Zu welchem Zeitpunkt startet das Altersvorsorge-Depot?","optionen":["Zum 1.1.2027","Zum 1.1.2026","Zum 1.7.2027","Zum 1.1.2028"],"richtig":0,"erklaerung":"Der Start des Altersvorsorge-Depots ist für den **1.1.2027** vorgesehen.","quelle":"f19","schwierigkeit":"leicht"},{"id":"q172","thema":"Geld, Finanzen und Altersvorsorge","frage":"Wie hoch ist die staatliche Grundzulage beim Altersvorsorge-Depot?","optionen":["50 Cent je gespartem Euro bis zu einem Eigenbeitrag von 360 Euro jährlich","25 Cent je gespartem Euro bis zu einem Eigenbeitrag von 360 Euro jährlich","50 Cent je gespartem Euro bis zu einem Eigenbeitrag von 600 Euro jährlich","75 Cent je gespartem Euro bis zu einem Eigenbeitrag von 180 Euro jährlich"],"richtig":0,"erklaerung":"Bis zu einem jährlichen Eigenbeitrag von **360 Euro** gibt der Staat für jeden gesparten Euro **50 Cent** als Grundzulage dazu.","quelle":"f19","schwierigkeit":"leicht"},{"id":"q173","thema":"Geld, Finanzen und Altersvorsorge","frage":"Wie werden jährliche Eigenbeiträge von 361 bis 1.800 Euro bezuschusst?","optionen":["Mit 25 Cent je gespartem Euro für weitere 1.440 Euro","Mit 50 Cent je gespartem Euro für weitere 1.440 Euro","Mit 25 Cent je gespartem Euro für weitere 1.800 Euro","Mit 10 Cent je gespartem Euro für weitere 1.440 Euro"],"richtig":0,"erklaerung":"Für die **weiteren 1.440 Euro** (also von 361 bis 1.800 Euro) gibt es **25 Cent pro gespartem Euro**. Die höhere Förderung von 50 Cent gilt nur für die ersten 360 Euro.","quelle":"f19","schwierigkeit":"mittel"},{"id":"q174","thema":"Geld, Finanzen und Altersvorsorge","frage":"Wie hoch ist die staatliche Zulage beim Altersvorsorge-Depot insgesamt, wenn jährlich 1.800 Euro eigene Beiträge eingezahlt werden?","optionen":["540 Euro","450 Euro","720 Euro","900 Euro"],"richtig":0,"erklaerung":"Für die ersten 360 Euro gibt es 50 Cent je Euro (**180 Euro**), für die weiteren 1.440 Euro je 25 Cent (**360 Euro**). Zusammen ergeben sich **540 Euro** Zulage.","quelle":"f19","schwierigkeit":"schwer"},{"id":"q175","thema":"Geld, Finanzen und Altersvorsorge","frage":"Welche Altersvorsorgeangebote stellen viele Unternehmen ihren Beschäftigten zur Verfügung?","optionen":["Betriebliche Altersvorsorgepläne und betriebliche Rentenbeiträge","Staatlich geförderte Zulagendepots und jährliche Grundzulagen","Zinsgarantierte Sparbücher und betriebliche Bausparverträge","Unternehmenseigene Indexfonds und jährliche Dividendenzahlungen"],"richtig":0,"erklaerung":"Viele Unternehmen bieten **betriebliche Altersvorsorgepläne oder betriebliche Rentenbeiträge** an, die zum Aufbau zusätzlicher Ersparnisse genutzt werden sollten.","quelle":"f16, f18","schwierigkeit":"mittel"},{"id":"q176","thema":"Geld, Finanzen und Altersvorsorge","frage":"Welche Empfehlung wird für den Zeitpunkt des Sparens gegeben?","optionen":["Zu Monatsbeginn sparen, und das schon zu Beginn der Berufstätigkeit","Am Monatsende sparen, was von den Einnahmen übrig geblieben ist","Erst ab der Mitte des Berufslebens regelmäßig Beträge zurücklegen","Nur in Monaten sparen, in denen keine größeren Fixkosten anfallen"],"richtig":0,"erklaerung":"Empfohlen wird das Sparen **zu Monatsbeginn**, und zwar bereits **zu Beginn der Berufstätigkeit**. Das Sparen soll also nicht davon abhängen, was am Monatsende noch übrig ist.","quelle":"f16, f18","schwierigkeit":"mittel"},{"id":"q177","thema":"Unternehmensrecherche und Jahresabschluss","frage":"Welche beiden Varianten werden beim Jahresabschluss einander gegenuebergestellt?","optionen":["Einnahmen-Ueberschuss-Rechnung und Bilanz","Einnahmen-Ueberschuss-Rechnung und Inventur","Kostenrechnung und Bilanz","Kostenrechnung und Inventur"],"richtig":0,"erklaerung":"Beim Jahresabschluss stehen sich **E/Ue-Rechnung** (Einnahmen-Ueberschuss-Rechnung) und **Bilanz** als die beiden Varianten gegenueber. **Inventur** und **Kostenrechnung** gehoeren nicht zu diesem Gegensatzpaar.","quelle":"f47","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Die Einnahmen-Überschuss-Rechnung ist eine steuerliche Gewinnermittlungsart und kein handelsrechtlicher Jahresabschluss. Präziser wäre „Formen der Gewinnermittlung beziehungsweise des Abschlusses“.","quelle":"§§ 242 HGB, 4 Abs. 3 EStG","url":"https://www.gesetze-im-internet.de/hgb/__242.html"}},{"id":"q178","thema":"Unternehmensrecherche und Jahresabschluss","frage":"Welche Bestandteile werden neben der Bilanz als Teile des Jahresabschlusses aufgefuehrt?","optionen":["Gewinn- und Verlustrechnung, Lagebericht und Anhang","Gewinn- und Verlustrechnung, Lagebericht und Inventurliste","Gewinn- und Verlustrechnung, Pruefbericht und Anhang","Kapitalflussrechnung, Lagebericht und Anhang"],"richtig":0,"erklaerung":"Zum Jahresabschluss werden **Gewinn- und Verlustrechnung**, **Lagebericht** und **Anhang** genannt. Inventurliste, Pruefbericht und Kapitalflussrechnung zaehlen nicht zu den aufgefuehrten Bestandteilen.","quelle":"f47","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Der Lagebericht ist rechtlich kein Bestandteil des Jahresabschlusses. Bei Kapitalgesellschaften bilden Bilanz, GuV und Anhang eine Einheit; der Lagebericht wird separat aufgestellt und ist für kleine Kapitalgesellschaften nicht generell vorgeschrieben.","quelle":"§ 264 HGB","url":"https://www.gesetze-im-internet.de/hgb/__264.html"}},{"id":"q179","thema":"Unternehmensrecherche und Jahresabschluss","frage":"Welche drei inhaltlichen Schwerpunkte werden fuer die Unternehmensrecherche genannt?","optionen":["Unternehmensaufbau, Unternehmensform und Jahresabschluss","Unternehmensaufbau, Unternehmensform und Marktanteil","Unternehmensleitbild, Unternehmensform und Jahresabschluss","Unternehmensaufbau, Unternehmensgroesse und Jahresabschluss"],"richtig":0,"erklaerung":"Die Unternehmensrecherche gliedert sich in **Unternehmensaufbau**, **Unternehmensform** und **Jahresabschluss**. Marktanteil, Unternehmensleitbild und Unternehmensgroesse werden als eigene Schwerpunkte nicht aufgefuehrt.","quelle":"f47","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q180","thema":"Unternehmensrecherche und Jahresabschluss","frage":"Welches Stichwort wird bei der Unternehmensrecherche unmittelbar dem Punkt Unternehmensform zugeordnet?","optionen":["Selbststaendigkeit","Haftungssumme","Mitarbeiterzahl","Betriebsergebnis"],"richtig":0,"erklaerung":"Der Punkt Unternehmensform wird direkt mit dem Stichwort **Selbststaendigkeit** verknuepft. Haftungssumme, Mitarbeiterzahl und Betriebsergebnis gehoeren nicht zu den genannten Stichworten der Unternehmensrecherche.","quelle":"f47","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q181","thema":"Unternehmensrecherche und Jahresabschluss","frage":"Welche Zusammenstellung besteht ausschliesslich aus Anlaufstellen der Unternehmensrecherche?","optionen":["Handelsregister, Bundesanzeiger und Kununu","Handelsregister, Grundbuch und Kununu","Vereinsregister, Bundesanzeiger und Kununu","Handelsregister, Bundesanzeiger und Schufa"],"richtig":0,"erklaerung":"Zur Unternehmensrecherche dienen **Handelsregister**, **Bundesanzeiger**, **Kununu**, soziale Netze und Markenregister. **Grundbuch**, **Vereinsregister** und **Schufa** zaehlen nicht zu diesen Anlaufstellen und machen die uebrigen Zusammenstellungen falsch.","quelle":"f47","schwierigkeit":"mittel","essential":true,"wiederholung":true},{"id":"q182","thema":"Unternehmensrecherche und Jahresabschluss","frage":"Fuer ein neues Unternehmen soll geprueft werden, ob ein geplanter Name bereits als Marke eingetragen ist. Welcher der genannten Rechercheorte ist dafuer vorgesehen?","optionen":["Markenregister","Handelsregister","Bundesanzeiger","Kununu"],"richtig":0,"erklaerung":"Fuer eingetragene Marken ist das **Markenregister** der vorgesehene Rechercheort. Handelsregister, Bundesanzeiger und Kununu werden als eigenstaendige Anlaufstellen mit anderem Gegenstand genannt.","quelle":"f47","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"thema":"Grundlagen der BWL","frage":"Welche der folgenden Punkte gehören zu den grundlegenden BWL-Kenntnissen, die für Designer nützlich sein können?","optionen":["die Planung und die Budgetierung","die Verwaltung von Finanzen und Buchhaltung","das Management von Ressourcen und Mitarbeitern/Team","die Begründung von unternehmerischen Entscheidungen","die ideale Ausnutzung ökonomischer Möglichkeiten"],"richtig":[0,1,2],"erklaerung":"Die Folie nennt **fünf** grundlegende BWL-Kenntnisse: **Planung und Budgetierung**, **Management von Ressourcen und Mitarbeitern/Team**, **Verwaltung von Finanzen und Buchhaltung**, **Marketing** und **Vertrieb**. Die beiden übrigen Optionen gehören nicht in diese Aufzählung, sondern zum Abschnitt **Ziel der BWL**: Dort geht es darum, Entscheidungen zu **begründen/zu fällen** und die **ökonomischen Möglichkeiten ideal auszunutzen**.","quelle":"f50","schwierigkeit":"leicht","familie":"bwl-grundkenntnisse","id":"q183"},{"thema":"Grundlagen der BWL","frage":"Welche der folgenden Gründe sprechen dafür, dass Designer BWL-Kenntnisse brauchen?","optionen":["um eigene Unternehmen oder Projekte zu leiten und zu verwalten","um effektiv zu planen, zu budgetieren, zu verwalten und zu vermarkten","um smart für oder gegen Arbeitgeber zu agieren","um gestalterische Entwürfe schneller und technisch sauberer umzusetzen","um rechtliche Vorgaben in Verträgen selbstständig zu formulieren"],"richtig":[0,1,2],"erklaerung":"Die Folie führt genau **drei** Gründe auf: eigene **Unternehmen oder Projekte leiten und verwalten**, effektiv **planen, budgetieren, verwalten und vermarkten** sowie **smart für/gegen Arbeitgeber agieren**. Die technische Umsetzung von Entwürfen und das Formulieren rechtlicher Vertragsvorgaben werden auf den Folien **nicht** als Grund genannt; der Nutzen wird dort mit dem **Verständnis dafür, wie Unternehmen funktionieren**, begründet.","quelle":"f49","schwierigkeit":"mittel","id":"q184"},{"thema":"Grundlagen der BWL","frage":"Welche Aussagen zum Ziel der BWL sind richtig?","optionen":["Die BWL liefert Methoden, Prozesse und Verständnis für Entscheidungen","Entscheidungen im Betrieb beruhen auf klaren betriebswirtschaftlichen Prinzipien","Die ökonomischen Möglichkeiten sollen dadurch ideal ausgenutzt werden","Entscheidungen werden im Betrieb überwiegend nach Erfahrungswerten getroffen","Die Entscheidungen sollen vor allem die gestalterische Qualität sichern"],"richtig":[0,1,2],"erklaerung":"Laut Folie ist es Hauptziel der BWL, **Methoden, Prozesse und Verständnis** zu liefern, um **Entscheidungen** zu begründen/zu fällen; diese basieren **in der Regel auf klaren, betriebswirtschaftlichen Prinzipien**, sodass die **ökonomischen Möglichkeiten ideal** ausgenutzt werden. Genau deshalb ist die Aussage zu den **Erfahrungswerten** falsch – sie steht im Widerspruch zu den klaren Prinzipien. Die **gestalterische Qualität** ist ebenfalls nicht gemeint: Die Entscheidungen sollen das Unternehmen **in wirtschaftlicher Hinsicht** weiterbringen; gestalterische Aspekte gehören zum Designberuf selbst, nicht zum Ziel der BWL.","quelle":"f51","schwierigkeit":"mittel","id":"q185"},{"thema":"Rechtsformen","frage":"Bei welchen der folgenden Rechtsformen zählt die Haftungsbeschränkung zu den Vorteilen?","optionen":["UG (haftungsbeschränkt)","Partnerschaftsgesellschaft","GmbH","Einzelunternehmen","GbR"],"richtig":[0,1,2],"erklaerung":"Die Folie ordnet den Vorteil **Haftungsbeschränkung** genau drei Rechtsformen zu: der **UG (haftungsbeschränkt)** (geringe Gründungskosten, Haftungsbeschränkung), der **Partnerschaftsgesellschaft** (Haftungsbeschränkung, flexible Gestaltung) und der **GmbH** (Haftungsbeschränkung, solider kreditwürdiger Auftritt, eigene Anstellung). Beim **Einzelunternehmen** stehen als Vorteile sofortiger Start und geringe Kosten, bei der **GbR** flexible Gestaltung > Team – für beide nennt die Nachteils-Folie stattdessen die gesamtschuldnerische unbeschränkte Haftung.","quelle":"f45, f44","schwierigkeit":"mittel","id":"q186","fachhinweis":{"hinweis":"Eine normale Partnerschaftsgesellschaft hat keine allgemeine Haftungsbeschränkung. Sonderregeln gelten bei beruflichen Fehlern; eine weitergehende Beschränkung setzt insbesondere eine PartG mbB voraus.","quelle":"§ 8 PartGG","url":"https://www.gesetze-im-internet.de/partgg/__8.html"}},{"thema":"Rechtsformen","frage":"Welche der folgenden Nachteile hat die UG (haftungsbeschränkt)?","optionen":["Verwaltungskosten","Geringe Kreditwürdigkeit","Steuer","Scheinselbstständigkeit","Gesamtschuldnerische unbeschränkte Haftung"],"richtig":[0,1,2],"erklaerung":"Zur **UG (haftungsbeschränkt)** listet die Folie genau drei Nachteile: **Verwaltungskosten, geringe Kreditwürdigkeit, Steuer**. Die **Scheinselbstständigkeit** ist auf derselben Folie der Nachteil des **Freelancers**, die **gesamtschuldnerische unbeschränkte Haftung** der Nachteil von **Einzelunternehmen und GbR** – die UG wird auf der Vorteils-Folie ausdrücklich mit Haftungsbeschränkung geführt.","quelle":"f44","schwierigkeit":"mittel","familie":"rechtsform-nachteile-ug","id":"q187"},{"thema":"Rechtsformen","frage":"Bei welchen der folgenden Rechtsformen zählt die gesamtschuldnerische unbeschränkte Haftung zu den Nachteilen?","optionen":["Einzelunternehmen","GbR","UG (haftungsbeschränkt)","Partnerschaftsgesellschaft","GmbH"],"richtig":[0,1],"erklaerung":"Die **gesamtschuldnerische unbeschränkte Haftung** steht auf der Folie ausschließlich beim **Einzelunternehmen** und bei der **GbR**. Für die **UG (haftungsbeschränkt)** nennt die Folie Verwaltungskosten, geringe Kreditwürdigkeit und Steuer, für die **Partnerschaftsgesellschaft** die gemeinsame Haftung für Büro- und Personalkosten, für die **GmbH** Gründungs- und Verwaltungskosten > Steuerproblematik. Alle drei werden auf der Vorteils-Folie mit **Haftungsbeschränkung** geführt.","quelle":"f44, f45","schwierigkeit":"leicht","id":"q188","fachhinweis":{"hinweis":"Die unbeschränkte persönliche Haftung des Einzelunternehmers ist richtig. „Gesamtschuldnerisch“ ist hier aber falsch, weil dafür mehrere Schuldner nötig wären.","quelle":"§ 421 BGB","url":"https://www.gesetze-im-internet.de/bgb/__421.html"}},{"thema":"Rechtsformen","frage":"Welche der folgenden Vorteile hat die GmbH?","optionen":["Haftungsbeschränkung","Solider kreditwürdiger Auftritt","Eigene Anstellung","Geringe Gründungskosten","Wenig Akquiseaufwand"],"richtig":[0,1,2],"erklaerung":"Zur **GmbH** nennt die Folie drei Vorteile: **Haftungsbeschränkung, solider kreditwürdiger Auftritt, eigene Anstellung**. **Geringe Gründungskosten** sind auf derselben Folie der Vorteil der **UG (haftungsbeschränkt)** – bei der GmbH stehen Gründungs- und Verwaltungskosten sogar unter den Nachteilen. **Wenig Akquiseaufwand** gehört zum **Freelancer** (relativ risikolos, wenig Akquiseaufwand).","quelle":"f45, f44","schwierigkeit":"mittel","familie":"rechtsform-vorteile-gmbh","id":"q189"},{"thema":"Rechtsformen","frage":"Welche der folgenden Rechtsformen zählen zu den Kapitalgesellschaften (juristische Personen)?","optionen":["Gesellschaft mit beschränkter Haftung (GmbH)","Aktiengesellschaft (AG)","Gesellschaft bürgerlichen Rechts (GbR)","Einzelunternehmen","Freelancer"],"richtig":[0,1],"erklaerung":"Unter der Überschrift **Kapitalgesellschaften (juristische Personen)** nennt die Folie genau zwei Rechtsformen: die **GmbH** (Gesellschafter/Eigentümer haften nicht persönlich für die Schulden, geführt von einem oder mehreren Geschäftsführern) und die **AG** (Unternehmen ist in Aktien aufgeteilt, Aktionäre halten sie und dürfen über Angelegenheiten des Unternehmens abstimmen). **GbR, Einzelunternehmen und Freelancer** tauchen in der Vorlesung nur auf den Folien zu Vorteilen und Nachteilen auf, nicht in dieser Kategorie.","quelle":"f48","schwierigkeit":"leicht","id":"q190"},{"thema":"Urheber- und Nutzungsrecht","frage":"In welchen Hinsichten können Nutzungsrechte laut Vorlesung beschränkt übertragen werden?","optionen":["räumlich beschränkt","zeitlich beschränkt","inhaltlich beschränkt","personell beschränkt","sprachlich beschränkt"],"richtig":[0,1,2],"erklaerung":"Die Folie „NUTZUNGSRECHTE – UMFANG\" nennt genau **drei** Beschränkungsarten: **räumlich**, **zeitlich** und **inhaltlich**. Eine **personelle** oder **sprachliche** Beschränkung kommt auf den Folien nicht vor – der Umfang wird ausschließlich über diese drei Dimensionen definiert.","quelle":"f33","schwierigkeit":"leicht","id":"q191","wiederholung":true},{"thema":"Urheber- und Nutzungsrecht","frage":"Welche der folgenden Beispiele beziehen sich auf die räumliche Nutzung eines Werkes?","optionen":["Nutzung international","Nutzung europaweit","Nutzung nur regional","Nutzung für 5 Jahre","Nutzung für 10 Jahre"],"richtig":[0,1,2],"erklaerung":"Die Folie führt für die **räumliche Nutzung** auf: „**international, weltweit, europaweit oder nur regional**\". Damit sind **international**, **europaweit** und **nur regional** gedeckt. **5 Jahre** und **10 Jahre** stehen dagegen in der Zeile **zeitliche Nutzung** derselben Tabelle („von **1 Jahr, 5 Jahre, 10 Jahre** bis **zeitlich unbegrenzt**\") – sie betreffen also die Dauer, nicht das Gebiet der Nutzung.","quelle":"f33","schwierigkeit":"leicht","id":"q192","wiederholung":true},{"thema":"Urheber- und Nutzungsrecht","frage":"Welche der folgenden Punkte zählen zu den Ausnahmen im Urheberrecht?","optionen":["Gemeinfreiheit nach 70 Jahren","Zitatrecht und Wissenschaft","Panoramafreiheit und Beiwerk","Zustimmung sämtlicher Rechteinhaber","Einschränkung der Honorierung"],"richtig":[0,1,2],"erklaerung":"Unter **„Ausnahmen\"** listet die Wiederholungsfolie genau vier Punkte auf: **gemeinfrei (70 Jahre)**, **Wissenschaft**, **Zitatrecht** und **Panoramafreiheit/Beiwerk** – damit sind die Optionen 1, 2 und 3 gedeckt. Die **schriftliche Zustimmung sämtlicher Rechteinhaber** steht auf derselben Folie unter dem Stichwort **„Bilder\"** und ist eine Voraussetzung der Nutzung, keine Ausnahme. Die **eingeschränkte Honorierung** (= eingeschränkte Übertragung) gehört zum Stichwort **„Kalkulation\"**.","quelle":"f34","schwierigkeit":"mittel","id":"q193","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Die Regelschutzfrist endet 70 Jahre nach dem Tod des Urhebers, nicht pauschal 70 Jahre nach Entstehung oder Veröffentlichung. Auch „Wissenschaft“ ist keine allgemeine Ausnahme, sondern nur im Rahmen konkreter gesetzlicher Schranken relevant.","quelle":"§§ 60a ff., 64 UrhG","url":"https://www.gesetze-im-internet.de/urhg/__64.html"}},{"thema":"Urheber- und Nutzungsrecht","frage":"Vor welchen unbefugten Handlungen Dritter schützt das Urheberrecht das Werk?","optionen":["vor der Vervielfältigung des Werkes","vor der Verbreitung des Werkes","vor der öffentlichen Wiedergabe des Werkes","vor der Vermietung der Sache durch ihren Eigentümer","vor der Zerstörung der Sache durch ihren Eigentümer"],"richtig":[0,1,2],"erklaerung":"Das Urheberrecht entsteht **automatisch** mit der Schaffung des Werkes und schützt es vor unbefugter **Vervielfältigung**, **Verbreitung**, **öffentlicher Wiedergabe**, **Bearbeitung** und anderer Nutzung durch Dritte. **Vermieten** und **Zerstören** sind dagegen Befugnisse des **Eigentümers** aus dem Eigentumsrecht (Folie „EIGENTUM ≠ URHEBERSCHAFT“) und damit eine andere Rechtsart.","quelle":"f32, f31","schwierigkeit":"mittel","id":"q194","wiederholung":true},{"thema":"Urheber- und Nutzungsrecht","frage":"Welche Aussagen zu exklusiven und nicht-exklusiven Nutzungsrechten sind richtig?","optionen":["Exklusive Rechte geben dem Kunden das alleinige Recht, das Design zu nutzen.","Nicht-exklusive Rechte erlauben dem Designer, das Design auch an andere Kunden zu lizenzieren.","Nicht-exklusive Rechte werden auf der Folie auch als einfache Rechte bezeichnet.","Einfache Rechte geben dem Kunden das alleinige Recht, das Design zu nutzen.","Exklusive Rechte gelten laut Folie ausschließlich bei rein regionaler Nutzung."],"richtig":[0,1,2],"erklaerung":"Die Folie „NUTZUNGSARTEN\" nennt zwei Haupttypen: **exklusive (ausschließliche)** Rechte mit dem **alleinigen** Nutzungsrecht für den Kunden und **nicht-exklusive (einfache)** Rechte, bei denen der **Designer weiter an andere Kunden lizenzieren** darf. Option 4 dreht die Begriffe um – das alleinige Recht gehört zu den **exklusiven**, nicht zu den einfachen Rechten. **„Regional\"** stammt aus der **räumlichen Beschränkung** und hat mit der Nutzungsart nichts zu tun.","quelle":"f35, f34","schwierigkeit":"mittel","id":"q195","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Ein ausschließliches Nutzungsrecht schließt den Urheber nicht zwingend vollständig aus. Die eigene Nutzung kann vertraglich vorbehalten werden.","quelle":"§ 31 Abs. 3 UrhG","url":"https://www.gesetze-im-internet.de/urhg/__31.html"}},{"thema":"Urheber- und Nutzungsrecht","frage":"Welche der folgenden Bedingungen können an den Erwerb eines Nutzungsrechts geknüpft sein?","optionen":["die Art und Weise der Nutzung","die Dauer der Nutzung","die Höhe der Vergütung","die Befugnis zur Zerstörung der Sache","die Gemeinfreiheit nach 70 Jahren"],"richtig":[0,1,2],"erklaerung":"Wer ein Nutzungsrecht erwirbt, darf das Werk in der Regel **für einen begrenzten Zeitraum** und unter bestimmten Bedingungen nutzen: **Art und Weise der Nutzung**, **Dauer der Nutzung** und **Höhe der Vergütung**. Die Befugnis, eine Sache **zu zerstören**, gehört dagegen zum **Eigentumsrecht**, die **Gemeinfreiheit nach 70 Jahren** zu den **Ausnahmen** der Wiederholungsfolie.","quelle":"f30","schwierigkeit":"mittel","id":"q196","wiederholung":true},{"thema":"Businessplan und Gründung","frage":"An welche der folgenden Adressaten richtet sich ein Businessplan?","optionen":["Das Finanzamt","Die Bank","Die Konkurrenz","Das Arbeitsamt","Der Investor"],"richtig":[1,3,4],"erklaerung":"Die Wiederholungsfolie beantwortet die Frage **\"Wer?\"** mit **Bank, Arbeitsamt, Gründer, Investor und Finanzgeber** – mit dem Zusatz **\"für einen selbst!\"**. Aus dieser Reihe stammen **Bank**, **Arbeitsamt** und **Investor**. Das **Finanzamt** steht nirgends auf der Folie (leicht mit **Arbeitsamt** und **Finanzgeber** zu verwechseln). Die **Konkurrenz** gehört zur Folie **METHODE**: dort sollen im Abschnitt Geschäftsidee **Markt und Konkurrenz analysiert** werden – sie ist also Analyseobjekt und kein Empfänger des Plans.","quelle":"f17, f21, f15","schwierigkeit":"leicht","familie":"businessplan-adressaten","id":"q197","essential":true,"wiederholung":true},{"thema":"Businessplan und Gründung","frage":"Welche der folgenden Punkte gehören inhaltlich in einen Businessplan?","optionen":["Das Marketing","Die Kontrolle","Das Team und das Netzwerk","Die Planung","Die Motivation"],"richtig":[0,2,4],"erklaerung":"Unter **\"Was gehoert rein?\"** listet die Folie: **Executive Summary, Idee, Motivation, Team/Netzwerk, Finanzen, Marketing**. **Planung** und **Kontrolle** stehen dagegen in der Zeile **\"Warum?\"** (Klaerung, Planung, Kontrolle > Wirtschaftlichkeit) – sie sind Gruende fuer das Schreiben eines Businessplans, keine Gliederungspunkte darin.","quelle":"f17","schwierigkeit":"mittel","id":"q198","wiederholung":true},{"thema":"Businessplan und Gründung","frage":"Welche drei der folgenden Fragen gehoeren zu den Saeulen des Geschaeftsmodells?","optionen":["Die Frage \"Warum?\"","Die Frage \"Was?\"","Die Frage \"Wer?\"","Die Frage \"Wann?\"","Die Frage \"Wie viel?\""],"richtig":[1,2,4],"erklaerung":"Die Folie nennt als **Saeulen des Geschaeftsmodells: wer, was, wie, wie viel**. Die Frage **\"Warum?\"** gehoert zu einem anderen Abschnitt derselben Folie, naemlich zu den Gruenden fuer den Businessplan (**Klaerung, Planung, Kontrolle > Wirtschaftlichkeit**). Die Frage **\"Wann?\"** kommt auf der Folie ueberhaupt nicht vor.","quelle":"f17","schwierigkeit":"leicht","id":"q199","wiederholung":true},{"thema":"Businessplan und Gründung","frage":"Welche der folgenden Stichworte zählen zu den Gründen für einen Businessplan?","optionen":["Die Finanzen","Die Klaerung","Die Kontrolle","Die Executive Summary","Die Planung"],"richtig":[1,2,4],"erklaerung":"Zur Frage **\"Warum?\"** nennt die Wiederholungsfolie **Klaerung, Planung, Kontrolle > Wirtschaftlichkeit**. Die Folie WER? bestaetigt das: Ein Businessplan hilft, **Strategien zu planen und Ziele zu definieren und nachzuhalten bzw. zu kontrollieren**. **Executive Summary** und **Finanzen** stammen aus der anderen Aufzaehlung derselben Folie, naemlich **\"Was gehoert rein?\"**.","quelle":"f17, f21","schwierigkeit":"mittel","id":"q200","wiederholung":true},{"thema":"Steuern","frage":"Welche der folgenden Steuern zählen zu den Verbrauchssteuern?","optionen":["Grundsteuer","Tabaksteuer","Gewerbesteuer","Mineralölsteuer","Stromsteuer"],"richtig":[1,3,4],"erklaerung":"Die Folie nennt als Verbrauchssteuern **Strom-, Tabak-, Branntwein- und Mineralölsteuer**. Die **Grundsteuer** steht auf derselben Folie bei den **Substanzsteuern**, die **Gewerbesteuer** bei den **Gewinnsteuern**.","quelle":"f25","schwierigkeit":"mittel","familie":"steuergruppe-verbrauch","id":"q201","wiederholung":true,"fachhinweis":{"hinweis":"Die Bezeichnungen der Folie sind veraltet: Die frühere Branntweinsteuer heißt seit 2018 Alkoholsteuer, die frühere Mineralölsteuer seit 2006 Energiesteuer.","quelle":"Alkoholsteuergesetz und Energiesteuergesetz","url":"https://www.gesetze-im-internet.de/alkstg/"}},{"thema":"Steuern","frage":"Welche der folgenden Steuern zählen zur Gruppe der Substanzsteuern?","optionen":["Vermögensteuer","Umsatzsteuer","Grundsteuer","Branntweinsteuer","Erbschaftsteuer"],"richtig":[0,2,4],"erklaerung":"Die Substanzsteuern umfassen laut Folie **Grundsteuer, Vermögensteuer und Erbschaftsteuer**. Die **Umsatzsteuer** ist dort die **Verkehrsteuer**, die **Branntweinsteuer** gehört zu den **Verbrauchssteuern**.","quelle":"f25","schwierigkeit":"mittel","id":"q202","wiederholung":true},{"thema":"Steuern","frage":"Welche der folgenden Begriffe bezeichnen Steuer-Gruppen?","optionen":["Körperschaftsteuer","Verkehrsteuer","Substanzsteuer","Kapitalertragsteuer","Verbrauchssteuer"],"richtig":[1,2,4],"erklaerung":"Die Wiederholungsfolie listet als Steuer-Gruppen **Verkehrs-, Verbrauchs-, Gewinn- und Substanzsteuern**. **Körperschaftsteuer** und **Kapitalertragsteuer** sind dagegen einzelne **Steuer-Arten** von der Folie \"STEUERN\".","quelle":"f24, f25","schwierigkeit":"mittel","id":"q203","wiederholung":true},{"thema":"Steuern","frage":"In welchen der folgenden Zusammenhänge wird die Steuer-ID gebraucht?","optionen":["Bei Banken und beim Arbeitsamt","Auf Rechnungen und in der Steuererklärung","Beim Kindergeld und beim BAföG-Antrag","Zur Kennzeichnung von Unternehmern im Warenverkehr","Beim Kauf von Aktien und beim Arbeitgeber"],"richtig":[0,2,4],"erklaerung":"Die Steuer-ID dient der persönlichen Kennzeichnung und wird gebraucht bei **Banken, Arbeitsamt, Arbeitgeber, Aktien, Kindergeld und BAföG-Antrag**. **Rechnung und Steuererklärung** laufen über die **Steuer-Nr.**, die **Kennzeichnung von Unternehmern** über die **Umsatz-ID**.","quelle":"f22","schwierigkeit":"leicht","id":"q204","wiederholung":true,"fachhinweis":{"hinweis":"„Arbeitsamt“ ist eine veraltete Behördenbezeichnung. Heute sind je nach Aufgabe die Bundesagentur für Arbeit oder das Jobcenter zuständig; die Steuer-ID wird nur in steuerlich relevanten Verfahren benötigt.","quelle":"Bundesagentur für Arbeit","url":"https://www.arbeitsagentur.de/ueber-uns"}},{"thema":"Steuern","frage":"Welche der folgenden Zuordnungen von Steuernummern und Stellenzahlen sind korrekt?","optionen":["Steuer-Nr. – 10","Steuer-ID – 9","Umsatzsteuer-ID – 9","Steuer-ID – 11","Umsatzsteuer-ID – 11"],"richtig":[0,2,3],"erklaerung":"Die Folie führt auf: **Steuer-ID (11), Steuer-Nr. (10), Umsatzsteuer-ID (9)**. Die **9** gehört also zur **Umsatzsteuer-ID**, die **11** zur **Steuer-ID** – die beiden übrigen Angaben vertauschen genau diese Werte.","quelle":"f24","schwierigkeit":"mittel","id":"q205","wiederholung":true,"fachhinweis":{"hinweis":"Eine deutsche Steuernummer hat nicht allgemein zehn Stellen. Das Format unterscheidet sich je nach Bundesland; im bundeseinheitlichen ELSTER-Schema hat sie 13 Stellen. Steuer-ID mit 11 und USt-IdNr. mit „DE“ plus 9 Ziffern sind dagegen stabil.","quelle":"ELSTER: Aufbau der Steuernummer","url":"https://www.elster.de/elsterweb/infoseite/steuernummer"}},{"thema":"Steuern","frage":"Welche der folgenden Beschreibungen von Steuerarten sind zutreffend?","optionen":["Die Grundsteuer ist eine Steuer auf den Verkauf von Waren und Dienstleistungen","Die Körperschaftsteuer ist eine Einkommensteuer auf die Gewinne von Unternehmen","Die Vermögensteuer ist eine Steuer für Erbschaften von Einzelpersonen","Die Kapitalertragsteuer ist eine Einkommensteuer auf Zinsen und Erträge aus Wertpapieren","Die Grunderwerbsteuer fällt beim Erwerb von Immobilien und Grundstücken an"],"richtig":[1,3,4],"erklaerung":"Die Folie definiert **Körperschaftsteuer**, **Kapitalertragsteuer** und **Grunderwerbsteuer** genau so. Die **Grundsteuer** ist dort eine Steuer auf den **Wert von Immobilien und Grundstücken** (der Verkauf von Waren und Dienstleistungen gehört zur **Umsatzsteuer**), und die **Vermögensteuer** besteuert das **Vermögen von Einzelpersonen** (die Steuer für Erbschaften ist die **Erbschaftsteuer**).","quelle":"f23","schwierigkeit":"schwer","id":"q206","fachhinweis":{"hinweis":"Körperschaftsteuer ist nicht die Gewinnsteuer aller Unternehmen. Sie betrifft insbesondere Körperschaften wie GmbH und AG; Einzelunternehmer versteuern ihren Gewinn grundsätzlich über die Einkommensteuer.","quelle":"§ 1 KStG","url":"https://www.gesetze-im-internet.de/kstg_1977/__1.html"}},{"thema":"Steuern","frage":"Welche der folgenden Aussagen zu Umsatzsteuer und Vorsteuer sind richtig?","optionen":["Die Umsatzsteuer wird auf die erbrachten Lieferungen und Dienstleistungen erhoben","Die Umsatzsteuer wird auf das Vermögen von Einzelpersonen erhoben","Die Umsatzsteuer wird vom Kunden des liefernden Unternehmens gezahlt","Die Vorsteuer ist die an andere Unternehmen für Einkäufe gezahlte Umsatzsteuer","Die Vorsteuer wird mit der eigenen Ausgangsrechnung vom Kunden gezahlt"],"richtig":[0,2,3],"erklaerung":"Laut Folie ist die **USt.** eine Steuer, die auf die **von einem Unternehmen erbrachten Lieferungen und Dienstleistungen** erhoben wird und **vom Kunden gezahlt** wird; die **VSt.** ist die Umsatzsteuer, die man **auf von anderen Unternehmen gekaufte Waren oder Dienstleistungen gezahlt** hat. Die Zahlung durch den eigenen Kunden betrifft also die **USt., nicht die Vorsteuer**. Die Steuer auf das **Vermögen von Einzelpersonen** ist nach der Folie STEUERN die **Vermögensteuer**.","quelle":"f24","schwierigkeit":"mittel","id":"q207","essential":true,"wiederholung":true},{"thema":"Rechnungen und E-Rechnung","frage":"Welche der folgenden Angaben sind Pflichtbestandteile einer Rechnung?","optionen":["Unterschrift des Rechnungsstellers auf dem Dokument","Nettosumme des abgerechneten Betrags","Umsatzgrenze von 800.000 Euro des Ausstellers","Mehrwertsteuervermerk mit dem anzuwendenden Steuersatz","Leistungsdatum als Zeitpunkt der Lieferung"],"richtig":[1,3,4],"erklaerung":"Die Folie \"Was gehört rein?\" hebt genau drei Angaben hervor: **Leistungsdatum** (Zeitpunkt der Lieferung oder Zeitraum der Erstellung), **Nettosumme** und **Mehrwertsteuervermerk** (anzuwendender Steuersatz oder im Fall einer Steuerbefreiung ein Hinweis darauf). Eine **Unterschrift** gehört gerade nicht dazu: Die Definition der Rechnung lautet \"Dokument zur Abrechnung einer Leistung | Lieferung > **keine Unterschrift**\". Die **800.000 Euro** stammen aus einem anderen Abschnitt, nämlich der Übergangsfrist der E-Rechnung für kleine Unternehmen bis Ende 2027.","quelle":"f28, f29, f27","schwierigkeit":"leicht","id":"q208","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Das Leistungsdatum bezeichnet den Zeitpunkt der Lieferung oder sonstigen Leistung. Bei einer Designleistung kann stattdessen ein Leistungszeitraum angegeben werden; „Zeitraum der Erstellung“ ist kein allgemeiner Gesetzesbegriff.","quelle":"§ 14 Abs. 4 Nr. 6 UStG","url":"https://www.gesetze-im-internet.de/ustg_1980/__14.html"}},{"thema":"Rechnungen und E-Rechnung","frage":"Welche Aussagen zu den Fristen der E-Rechnung treffen laut Vorlesung zu?","optionen":["Bis Ende 2026 dürfen noch Papierrechnungen oder PDF versendet werden.","Ab 2025 müssen alle Unternehmen E-Rechnungen ausstellen und versenden.","Ab 2025 müssen alle Unternehmen E-Rechnungen empfangen können.","Unternehmen unter 800.000 Euro Umsatz sind dauerhaft von der Pflicht befreit.","Ab dem 1.1.2028 gilt die Pflicht zur Ausstellung ausnahmslos."],"richtig":[0,2,4],"erklaerung":"Die Folie unterscheidet sauber zwischen Empfangen und Versenden: **Ab 2025** müssen alle Unternehmen in Deutschland elektronische Rechnungen **empfangen** können. Als Übergangsfrist dürfen **bis Ende 2026** noch Papierrechnungen oder andere Formate (PDF) **versendet** werden. **Ohne Ausnahmen** gilt die E-Rechnungspflicht für Ausstellung und Versendung **ab 1.1.2028**. Falsch ist deshalb die Ausstellungspflicht ab 2025 – ab 2025 gilt nur die Empfangspflicht. Ebenfalls falsch ist die dauerhafte Befreiung kleiner Unternehmen: Für sie (Umsatz **unter 800.000 Euro**) gilt die Übergangsregelung nur **bis Ende 2027**.","quelle":"f27","schwierigkeit":"mittel","id":"q209","fachhinweis":{"hinweis":"Die Aussage „ab 2028 ohne Ausnahmen“ ist falsch. Dauerhafte Ausnahmen bestehen unter anderem für Kleinbetragsrechnungen, Fahrausweise, Leistungen von Kleinunternehmern und bestimmte steuerfreie Umsätze.","quelle":"BMF: FAQ zur E-Rechnung","url":"https://www.bundesfinanzministerium.de/Content/DE/FAQ/e-rechnung.html"}},{"thema":"Rechnungen und E-Rechnung","frage":"Welche der folgenden Themen betreffen Rechnungen allgemein und nicht speziell die E-Rechnungspflicht?","optionen":["Übergangsfrist","Gutschrift","Vorsteuerabzug","Empfangspflicht","Mahnung"],"richtig":[1,2,4],"erklaerung":"Die Folie \"Zur Wiederholung\" listet als eigene Stichpunkte unter anderem **Vorsteuerabzug**, **Gutschrift** und **Mahnung** auf – neben Definition, \"Was gehört rein\", Rechnungsbeispielen, Kleinunternehmerregelung (§19 UStG) und netto–brutto. **Übergangsfrist** und **Empfangspflicht** stehen dort nicht: Beide Begriffe gehören zur Folie über die **E-Rechnung** (Empfangspflicht ab 2025, Übergangsfristen bis Ende 2026 bzw. Ende 2027).","quelle":"f29, f27","schwierigkeit":"leicht","id":"q210","wiederholung":true},{"thema":"Rechnungen und E-Rechnung","frage":"Welche der folgenden Angaben gehören zu den Pflichtangaben einer Rechnung?","optionen":["Kontaktdaten von Rechnungssteller und Empfänger","Rechnungsnummer des ausgestellten Dokuments","Angabe des Übermittlungsformats Papier oder PDF","Steuernummer des ausstellenden Unternehmens","Hinweis auf den Vorsteuerabzug des Empfängers"],"richtig":[0,1,3],"erklaerung":"Die Wiederholungsfolie zählt unter \"Was gehört rein\" auf: **Kontaktdaten, Re.Nr. (Rechnungsnummer), Steuer.Nr. (Steuernummer), Leistungszeitraum, Frist, Datum, Leistung**. Das **Übermittlungsformat** (Papier oder PDF) gehört nicht in diese Liste, sondern in den Abschnitt zur **E-Rechnung**, wo Papier und PDF als bis Ende 2026 zulässige Versandformate genannt werden. Der **Vorsteuerabzug** ist auf derselben Wiederholungsfolie ein **eigener Stichpunkt** und damit kein Bestandteil der Pflichtangaben.","quelle":"f29, f27","schwierigkeit":"mittel","id":"q211","wiederholung":true,"fachhinweis":{"hinweis":"Auf einer normalen Rechnung ist nicht zwingend die Steuernummer erforderlich. Gesetzlich genügt alternativ die vom Bundeszentralamt erteilte Umsatzsteuer-Identifikationsnummer.","quelle":"§ 14 Abs. 4 Nr. 2 UStG","url":"https://www.gesetze-im-internet.de/ustg_1980/__14.html"}},{"thema":"Angebot, Vertrag und Briefing","frage":"Welche der folgenden Beschreibungen kennzeichnen das Rebriefing gegenüber dem Briefing des Kunden?","optionen":["Als eine Zusammenfassung dessen, was der Kunde wünscht","Als eine Interpretation dessen, was der Kunde wünscht","Als eine Ergänzung dessen, was der Kunde wünscht","Als eine Wiederholung dessen, was der Kunde wünscht","Als eine Bestätigung dessen, was der Kunde wünscht"],"richtig":[0,1,2],"erklaerung":"Die Folie definiert das Rebriefing als **Zusammenfassung / Interpretation / Ergänzung** dessen, was der Kunde im Briefing wünscht. Ausdrücklich gilt: Ein Rebriefing ist **keine Wiederholung** des Briefings. Die **Bestätigung** gehört nicht hierher, sondern zur **Auftragsbestätigung** aus dem Wiederholungsblock zu Angeboten und Auftragsabwicklung (Rabatt, Skonto, Reduktion, Pauschale, Paket, Retainer).","quelle":"f42","schwierigkeit":"leicht","id":"q212","wiederholung":true},{"thema":"Angebot, Vertrag und Briefing","frage":"Wofür ist das Rebriefing laut Vorlesung eine Chance? (Mehrere Antworten richtig)","optionen":["Für eine Erweiterung, also das Schließen von Lücken","Für das Ausräumen von Missverständnissen beim Kunden","Für das Profilieren und Identifizieren mit dem Projekt","Für das Festlegen der Zahlungsbedingungen des Angebots","Für das Einräumen eines Rabatts in der Auftragsbestätigung"],"richtig":[0,1,2],"erklaerung":"Die Folie listet das Rebriefing als Chance **für eine Erweiterung (Lücken)**, **für eine Ergänzung**, **um Verständnis zu zeigen (Feedback)**, **um Missverständnisse auszuräumen** und **um sich zu profilieren** (mit dem Projekt identifizieren, Verbesserung erkennen und korrigieren). **Zahlungsbedingungen** sind ein Punkt der Angebotsfolie, der **Rabatt** ein Stichwort der **Auftragsbestätigung** – beides gehört nicht zum Rebriefing.","quelle":"f42","schwierigkeit":"leicht","id":"q213","wiederholung":true},{"thema":"Angebot, Vertrag und Briefing","frage":"Welche der folgenden Punkte gehören zu den Bestandteilen eines Angebots?","optionen":["Die Zahlungsbedingungen sowie 30% Akonto","Eine detaillierte Übersicht über die Leistungen","Das Verhältnis von Leistung und Gegenleistung","Die Vereinbarung von Skonto und Retainer","Die Feststellung von Konsens oder Dissens"],"richtig":[0,1,2],"erklaerung":"Die Angebotsfolie führt genau vier Punkte auf: **Zahlungsbedingungen**, **30% Akonto**, **detaillierte Leistungsübersicht** sowie **Leistung und Gegenleistung**. **Skonto und Retainer** stehen dagegen bei den Stichworten zur **Auftragsbestätigung**, **Konsens und Dissens** gehören zur Frage, ob beim Vertrag eine **Einigung** zustande gekommen ist.","quelle":"f39","schwierigkeit":"leicht","id":"q214","essential":true,"wiederholung":true},{"thema":"Angebot, Vertrag und Briefing","frage":"Auf welche Aspekte muss sich die Detailgenauigkeit einer Leistungsbeschreibung beziehen?","optionen":["Auf den Umfang der beschriebenen Leistung","Auf die Rahmenbedingungen und die Annahmen","Auf die Zeit, also die zeitliche Dimension","Auf die Höhe des Akontos von 30 Prozent","Auf den gewährten Rabatt beziehungsweise Skonto"],"richtig":[0,1,2],"erklaerung":"Zur **Beschreibung der Leistung** verlangt die Folie **Schriftform** und **Detailgenauigkeit**, und zwar bezogen auf **Umfang, Rahmenbedingungen, Annahmen und Zeit**. Weil die Leistungsbeschreibung Teil des Angebots ist, birgt sie Potenzial für Missverständnisse. Das **Akonto von 30%** stammt aus der Aufzählung der Angebotsbestandteile, **Rabatt und Skonto** aus den Stichworten zur **Auftragsbestätigung**.","quelle":"f36","schwierigkeit":"mittel","id":"q215","wiederholung":true},{"thema":"Angebot, Vertrag und Briefing","frage":"Welche der folgenden Stichworte betreffen die Preisgestaltung in einer Auftragsbestätigung?","optionen":["Rabatt und Skonto","Reduktion und Pauschale","Paket und Retainer","Akonto und Zahlungsbedingungen","Konsens und Essentialia Negotii"],"richtig":[0,1,2],"erklaerung":"Die Wiederholungsfolie nennt zur **Auftragsbestätigung** die Stichworte **Rabatt, Skonto, Reduktion, Pauschale, Paket, Retainer**. **Akonto und Zahlungsbedingungen** gehören zur Aufzählung der **Angebotsbestandteile**, **Konsens und Essentialia Negotii** zur Frage, wie ein **Vertrag** zustande kommt.","quelle":"f38","schwierigkeit":"mittel","id":"q216","essential":true,"wiederholung":true},{"thema":"Kalkulation und Liquidität","frage":"Welche der folgenden Zwecke erfüllt eine Kalkulation im Design?","optionen":["Den Preis gegenüber dem Kunden nachvollziehbar zu rechtfertigen","Unklarheiten und Missverständnisse zwischen Designer und Kunde zu vermeiden","Die eigenen Arbeitsprozesse zu optimieren und effizienter zu arbeiten","Die Zahlungsunfähigkeit des eigenen Unternehmens formal festzustellen","Honorare und Fremdkosten in einer gemeinsamen Angebotsposition zusammenzufassen"],"richtig":[0,1,2],"erklaerung":"Die Folie listet als Nutzen der Kalkulation unter anderem: den Kunden **transparent informieren**, den Preis **rechtfertigen**, **Unklarheiten und Missverständnisse** zwischen Designer und Kunde vermeiden, eine klare Grundlage für die Zusammenarbeit schaffen, die **Arbeitsprozesse optimieren** und effizienter arbeiten sowie Ressourcen besser planen und Kosten senken. Die **Zahlungsunfähigkeit** gehört zum Thema **Liquidität** (illiquide = Insolvenz droht) und nicht zu dieser Nutzenliste. Das Zusammenfassen von Honoraren und Fremdkosten widerspricht der Folie sogar ausdrücklich: Beide Positionen sollen **separat ausgewiesen** werden.","quelle":"f43","schwierigkeit":"mittel","id":"q217","essential":true,"wiederholung":true},{"thema":"Kalkulation und Liquidität","frage":"Welche Aussagen zu Honoraren und Fremdkosten treffen laut Vorlesung zu?","optionen":["Honorare betreffen die eigene Dienstleistung, Fremdkosten den Einkauf bei Dritten","Honorare sind normalerweise variabel und hängen von Art und Dauer der Leistung ab","Für Designleistungen sollten beide Positionen im Angebot separat ausgewiesen werden","Honorare und Fremdkosten sind zwei verschiedene Arten von Einnahmen im Angebot","Fremdkosten fallen abhängig von der Menge der gekauften Waren und Leistungen an"],"richtig":[0,1,2],"erklaerung":"Der **Hauptunterschied** liegt darin, dass Honorare die **eigene Dienstleistung** betreffen, während Fremdkosten für den **Kauf von Waren oder Dienstleistungen von Dritten** anfallen. Honorare sind normalerweise **variabel** und hängen von **Art und Dauer** der erbrachten Dienstleistungen ab; für Designleistungen/Angebote sollen **beide Positionen separat** ausgewiesen werden. Falsch ist die Einordnung als Einnahmen: Die Folie spricht ausdrücklich von zwei Arten von **Ausgaben**, die im Angebot stehen. Ebenfalls falsch ist die Mengenabhängigkeit: Fremdkosten sind feste (oder variable) Kosten, die **unabhängig von der Menge** der gekauften Waren oder Dienstleistungen anfallen.","quelle":"f41","schwierigkeit":"mittel","id":"q218","fachhinweis":{"hinweis":"Honorare können auch pauschal oder fest vereinbart werden. Fremdkosten können klar mengenabhängig sein, etwa bei Druckauflage oder Material; variable Kosten sind definitionsgemäß nicht mengenunabhängig.","quelle":"Fachliche Kostenrechnung"}},{"thema":"Kalkulation und Liquidität","frage":"Welche der folgenden Stichworte gehören zum Thema Kalkulation?","optionen":["Fixkosten – variable Kosten – Gewinnmarge","direkte Kosten – indirekte Kosten","Stundensätze – Tagessätze","Zahlungsverpflichtungen – offene Rechnungen – Insolvenz","Anzahlung – Zwischenrechnung – Schlussrechnung"],"richtig":[0,1,2],"erklaerung":"Die Wiederholungsfolie zur Kalkulation nennt als Stichworte unter anderem Calculatio = Berechnung, Historie, Nutzen und Einsatz der Kalkulation, **Fixkosten – variable Kosten – Gewinnmarge**, **direkte Kosten – indirekte Kosten**, Briefing > Rebriefing, Kalkulation-Schwierigkeiten, Risiko > Risikotyp sowie **Stundensätze – Tagessätze**. Zahlungsverpflichtungen, offene Rechnungen und Insolvenz stammen aus dem Abschnitt zur **Liquidität**; eine Staffelung von Anzahlung bis Schlussrechnung kommt in dieser Stichwortliste nicht vor.","quelle":"f46","schwierigkeit":"mittel","id":"q219","essential":true,"wiederholung":true},{"thema":"Kalkulation und Liquidität","frage":"Welche Aussagen zur Liquidität eines Unternehmens treffen laut Vorlesung zu?","optionen":["Die Liquidität bestimmt, ob ein Unternehmen seinen Zahlungsverpflichtungen nachkommen kann","Ein liquides Unternehmen kann fällige Zahlungen wie offene Rechnungen begleichen","Einem zahlungsunfähigen Unternehmen droht eine Insolvenz, es gilt als illiquide","Liquidität bezeichnet den Anteil der Gewinnmarge an den variablen Kosten","Ein illiquides Unternehmen verfügt über besonders hohe Zahlungsreserven"],"richtig":[0,1,2],"erklaerung":"Die Folie definiert: Die **Liquidität** eines Unternehmens bestimmt, ob es in der Lage ist, seinen **Zahlungsverpflichtungen** nachzukommen. Unter einem **liquiden** Unternehmen versteht man, dass **fällige Zahlungen wie offene Rechnungen** beglichen werden können. Ist ein Unternehmen dazu nicht mehr fähig, ist es **zahlungsunfähig = Insolvenz droht = illiquide**. Die **Gewinnmarge** ist ein Stichwort der Kalkulation und keine Definition der Liquidität; hohe Zahlungsreserven kennzeichnen gerade nicht ein **illiquides**, sondern ein liquides Unternehmen.","quelle":"f40","schwierigkeit":"leicht","id":"q220","wiederholung":true,"fachhinweis":{"hinweis":"Zahlungsunfähigkeit ist ein gesetzlicher Insolvenzgrund. Ob nur eine Insolvenz „droht“ oder bereits ein Insolvenzantrag erforderlich ist, hängt insbesondere von Rechtsform und Umständen ab.","quelle":"§§ 17, 15a InsO","url":"https://www.gesetze-im-internet.de/inso/__17.html"}},{"thema":"Marketing","frage":"Welche der folgenden Schritte gehören zur Positionierung?","optionen":["Botschaft definieren – aus dem USP eine klare Botschaft formulieren","Kommunikationskanäle festlegen – passende Kanäle für die Zielgruppe bestimmen","Positionierung überprüfen – Relevanz und Wirksamkeit sicherstellen","Preisbildung vornehmen – den Preis unter Marktbedingungen festlegen","Vertriebsstrategie umsetzen – Produkte über Vertriebskanäle verkaufen"],"richtig":[0,1,2],"erklaerung":"Die Folie POSITIONIERUNG nennt genau drei Schritte: **Botschaft definieren** (aus dem USP wird eine klare Botschaft formuliert), **Kommunikationskanäle festlegen** (Online- und Offline-Kanäle wie Social Media, Anzeigen oder Events) und **Positionierung überprüfen** (um sicherzustellen, dass sie noch relevant und wirksam ist). **Preisbildung** und **Vertrieb** sind dagegen eigene Marketingbereiche aus der Folie WAS IST MARKETING? und gehören nicht zu den Positionierungsschritten.","quelle":"f09","schwierigkeit":"leicht","familie":"positionierung-schritte","id":"q221","wiederholung":true},{"thema":"Marketing","frage":"Welche der folgenden Kanäle gehören zum Online-Marketing?","optionen":["Social Media zur Steigerung des Bewusstseins für Produkte","E-Mail-Marketing zur Ansprache potenzieller Kunden","Suchmaschinenoptimierung (SEO) neben Suchmaschinenmarketing (SEM)","Durchführung von Events zur Gewinnung neuer Kunden","Empfehlungen bestehender Kunden zur Neukundengewinnung"],"richtig":[0,1,2],"erklaerung":"Online-Marketing ist auf der Folie als **Nutzung digitaler Kanäle** definiert: **Social Media**, **E-Mail-Marketing**, **Suchmaschinenoptimierung (SEO)** und **Suchmaschinenmarketing (SEM)** – mit dem Ziel, das Bewusstsein für Produkte und Dienstleistungen zu steigern. Die **Organisation und Durchführung von Events** gehört dagegen zum **Eventmarketing**, das die Folie als eigenen Bereich führt; in der Positionierungsfolie erscheinen Events zudem ausdrücklich als **Offline-Kanal**. Die **Empfehlung** ist kein Online-Kanal, sondern eine eigene **Akquiseform** der Wiederholungsfolie, die dort neben Online-Marketing aufgezählt wird.","quelle":"f10, f14","schwierigkeit":"leicht","id":"q222","wiederholung":true},{"thema":"Marketing","frage":"Welche der folgenden Bestandteile gehören zum Branding?","optionen":["Markenstrategie – strategische Ausrichtung der Marke","Markenkommunikation – Kommunikation der Marke nach außen","Markendesign – gestalterische Umsetzung der Marke","Preisbildung – Festlegung der Preise am Markt","Vertriebskanäle – Wege des Verkaufs an die Kunden"],"richtig":[0,1,2],"erklaerung":"Die Wiederholungsfolie führt unter **Branding**: Analyse, **Markenstrategie**, **Markenkommunikation**, **Markendesign** und Markenmanagement. **Preisbildung** und **Vertrieb** stehen dagegen auf den Folien WAS IST MARKETING? als eigenständige Marketingbereiche und sind kein Bestandteil des Branding.","quelle":"f14, f11, f12","schwierigkeit":"mittel","id":"q223","wiederholung":true},{"thema":"Marketing","frage":"Welche der folgenden Formen nennt die Vorlesung als Akquiseformen?","optionen":["Direkte Ansprache potenzieller Kunden","Networking zum Aufbau von Kontakten","Partnerschaften mit anderen Unternehmen","Ausschreibungen als Zugang zu Aufträgen","SWOT zur Einschätzung der eigenen Lage"],"richtig":[0,1,2],"erklaerung":"Unter **Akquise** listet die Wiederholungsfolie: **Direkte Ansprache**, **Networking**, Empfehlung, **Partnerschaften** und Online-Marketing. **Ausschreibungen** gehören auf derselben Folie zum Stichwort **Pitch** (Rahmenbedingungen, Ausschreibungen, Pitchberater-Agenturen), **SWOT** ist dort als **Methode** aufgeführt.","quelle":"f14","schwierigkeit":"mittel","id":"q224","wiederholung":true},{"thema":"Marketing","frage":"Welche der folgenden Punkte führt die Wiederholungsfolie als Marketingmethoden auf?","optionen":["Influencer Marketing zur Ansprache über Multiplikatoren","Zielgruppenanalyse zur Bestimmung der Adressaten","SWOT zur strukturierten Bewertung der Ausgangslage","Eventmarketing zur Durchführung eigener Veranstaltungen","Kundenbindung zur langfristigen Bindung von Bestandskunden"],"richtig":[0,1,2],"erklaerung":"Als **Methoden** nennt die Wiederholungsfolie: Positionierung, SEO, SEM, **Influencer Marketing**, **Zielgruppenanalyse** und **SWOT**. **Eventmarketing** und **Kundenbindung** stehen dagegen auf den Folien WAS IST MARKETING? als Marketingbereiche und tauchen in der Methodenliste nicht auf.","quelle":"f14, f10, f11","schwierigkeit":"mittel","id":"q225","wiederholung":true},{"thema":"Marketing","frage":"Welche der folgenden Punkte sind Ziele des Marketings?","optionen":["Bestmöglicher Absatz von Produkten und Dienstleistungen","Langfristige Zufriedenheit der Kundinnen und Kunden","Möglichst niedrige Preise gegenüber dem Wettbewerb","Durchführung quantitativer und qualitativer Interviews","Auswahl geeigneter Pitchberater-Agenturen für Aufträge"],"richtig":[0,1],"erklaerung":"Die Folie MARKETING und die Wiederholungsfolie nennen als **Ziele** ausdrücklich den **bestmöglichen Absatz** von Produkten oder Dienstleistungen **und** die **langfristige Kundenzufriedenheit**. Möglichst niedrige Preise sind kein genanntes Ziel – die Preisbildung berücksichtigt laut Folie Marktbedingungen und Wettbewerbsfähigkeit. **Quantitative und qualitative Interviews** gehören zur **MaFo**, **Pitchberater-Agenturen** zum Stichwort **Pitch**.","quelle":"f13, f14","schwierigkeit":"leicht","id":"q226","wiederholung":true},{"thema":"Projektmanagement","frage":"Welche der folgenden Tätigkeiten gehören zum Projektmanagement?","optionen":["Das Delegieren von Projekten","Das Auswerten von Projekten","Das Dokumentieren von Projekten","Das Initiieren von Projekten","Das Abschließen von Projekten"],"richtig":[1,3,4],"erklaerung":"Die Folie PROJEKT MANAGEMENT nennt genau sechs Tätigkeiten: **Initiieren**, **Planen**, **Steuern**, **Kontrollieren**, **Abschließen** und **Auswerten** von Projekten. Aus dieser Liste stammen die drei richtigen Optionen **Auswerten**, **Initiieren** und **Abschließen**. **Delegieren** und **Dokumentieren** kommen in dieser Aufzählung nicht vor – auch die Wiederholungsfolie führt unter \"Wozu?\" nur **planen, organisieren, umsetzen und kontrollieren** und unter \"Projekt Prozess\" nur **Planung, Überwachung und Anpassung** auf.","quelle":"f07","schwierigkeit":"leicht","id":"q227","wiederholung":true},{"thema":"Projektmanagement","frage":"Welche der folgenden Vorgaben sind nach der Definition eines Projekts bei der Zielerreichung zu berücksichtigen?","optionen":["Die Vorgabe Qualität","Die Vorgabe Inhalt","Die Vorgabe Zeit","Die Vorgabe Risiko","Die Vorgabe Ressourcen"],"richtig":[0,2,4],"erklaerung":"Die Projektdefinition nennt als Vorgaben **Zeit**, **Ressourcen** und **Qualität**. **Inhalt** gehört nicht hierher, sondern zum **magischen Dreieck** (Zeit – Kosten – Qualität | Inhalt) der Wiederholungsfolie. **Risiko** taucht nur als **Risikomanagement** bzw. **Risikoanalyse** im Zusammenhang mit Projektmanagement und PM-Methoden auf, nicht als Vorgabe der Definition.","quelle":"f05","schwierigkeit":"leicht","id":"q228","wiederholung":true},{"thema":"Projektmanagement","frage":"Welche der folgenden Punkte führt die Projektdefinition als Beispiele für Ressourcen an?","optionen":["Zeit bis zur Zielerreichung","Personal und Betriebsmittel","Standardisierte Begriffe und Verfahren","Produktions- und Arbeitsbedingungen","Qualität des Projektergebnisses"],"richtig":[1,3],"erklaerung":"Als Ressourcen nennt die Folie **Finanzierung bzw. Kosten**, **Produktions- und Arbeitsbedingungen** sowie **Personal und Betriebsmittel**. **Zeit** und **Qualität** sind auf derselben Folie eigenständige Vorgaben und damit gerade keine Ressourcenbeispiele. **Standardisierte Begriffe und Verfahren** stammen aus der Folie PROJEKT MANAGEMENT, wo es heißt, dass viele Begriffe und Verfahrensweisen etabliert und standardisiert sind.","quelle":"f05","schwierigkeit":"mittel","id":"q229","wiederholung":true},{"thema":"Projektmanagement","frage":"Welche der folgenden Punkte sind typische Fehler im Projektmanagement?","optionen":["Mangelnde Überwachung und Kontrolle","Zu geringe Größe des Projektteams","Unklare oder unrealistische Ziele","Fehlende Zertifizierung der Projektleitung","Mangelnde Planung des Vorhabens"],"richtig":[0,2,4],"erklaerung":"Unter **PM Fehler** listet die Folie genau drei Punkte: **Unklare oder unrealistische Ziele**, **Mangelnde Planung** und **Mangelnde Überwachung und Kontrolle**. Weder die **Teamgröße** noch eine **Zertifizierung der Projektleitung** werden auf den Folien erwähnt; Teamarbeit erscheint nur positiv als Bestandteil des Projektmanagements (Teamarbeit und Koordination).","quelle":"f08","schwierigkeit":"leicht","id":"q230","wiederholung":true},{"thema":"Projektmanagement","frage":"Welche der folgenden Begriffe zählen zu den Methoden des Projektmanagements?","optionen":["Magisches Dreieck","Critical Path Method","Risikoanalyse","Teamarbeit und Koordination","Netzplantechnik"],"richtig":[1,2,4],"erklaerung":"Als **PM Methoden** nennt die Folie **Risikoanalyse**, **Critical Path Method**, **Projektstrukturplanung** und **Netzplantechnik**. Das **Magische Dreieck** ist ein eigener Punkt derselben Folie (**Zeit – Kosten – Qualität | Inhalt**) und keine Methode. **Teamarbeit und Koordination** steht unter dem Punkt **Projekt Management** zusammen mit Ressourcennutzung, Zielerreichung, Zeit- und Kostenkontrolle sowie Risikomanagement.","quelle":"f08","schwierigkeit":"mittel","id":"q231","essential":true,"wiederholung":true},{"thema":"Personal, Motivation und Lob","frage":"Welche der folgenden Unterformen gehören zum materiellen Lob?","optionen":["Kleine Geschenke oder Sachprämien als Zeichen der Wertschätzung","Finanzielle Prämien wie Boni oder Gehaltserhöhungen als Anerkennung","Gemeinsame Erlebnisse, Aktivitäten und Teamevents für Mitarbeitende","Beförderungen als Ausdruck der Anerkennung einer guten Leistung","Anerkennungszertifikate für besondere Leistungen der Mitarbeitenden"],"richtig":[0,1,2],"erklaerung":"Zum **materiellen Lob** zählt die Folie genau drei Unterformen: **Geschenke** (kleine Geschenke oder Sachprämien), **finanzielle Prämien** (Boni oder Gehaltserhöhungen) sowie **Erlebnisse, Aktivitäten, Teamevents**. **Beförderungen** gehören zur **professionellen Anerkennung** (zusammen mit Weiterbildungsmöglichkeiten), **Anerkennungszertifikate** zur **symbolischen Anerkennung** (zusammen mit Anerkennungsmauern bzw. Tafeln).","quelle":"f01","schwierigkeit":"leicht","id":"q232","wiederholung":true},{"thema":"Personal, Motivation und Lob","frage":"Welche der folgenden Unterformen gehören zum öffentlichen Lob?","optionen":["Lob, das in Team- oder Abteilungsmeetings ausgesprochen wird","Anerkennung in Unternehmensnewslettern, Berichten oder auf der Website","Eine E-Mail des Vorgesetzten, die die Leistungen eines Mitarbeiters hervorhebt","Anerkennende Gesten wie ein Lächeln, ein Daumen hoch oder ein Applaus","Weiterbildungsmöglichkeiten als Zeichen der Anerkennung der geleisteten Arbeit"],"richtig":[0,1],"erklaerung":"Das **öffentliche Lob** hat laut Folie zwei Unterformen: **in Meetings** (Lob in Team- oder Abteilungsmeetings) und **in Newslettern oder Berichten** (Anerkennung in Unternehmensnewslettern, Berichten oder auf der Firmenwebsite). Die **E-Mail des Vorgesetzten** ist ein Beispiel für **schriftliches Lob**, **Gesten** gehören zum **nonverbalen Lob**, **Weiterbildungsmöglichkeiten** zur **professionellen Anerkennung**.","quelle":"f03","schwierigkeit":"leicht","id":"q233","wiederholung":true},{"thema":"Personal, Motivation und Lob","frage":"Welche der folgenden Unterformen gehören zum schriftlichen Lob?","optionen":["Notizen und Briefe, etwa ein Dankesbrief für hervorragende Projektarbeit","E-Mails, die die Leistungen eines Mitarbeiters ausdrücklich hervorheben","Direktes Lob als klare Aussage, die eine bestimmte Leistung anerkennt","Indirektes Lob als eher beiläufige oder subtile Form der Anerkennung","Symbole wie Trophäen oder Medaillen, die eine Anerkennung darstellen"],"richtig":[0,1],"erklaerung":"Beim **schriftlichen Lob** unterscheidet die Folie **Notizen und Briefe** (Beispiel: Dankesbrief für hervorragende Arbeit an einem Projekt) und **E-Mails** (Beispiel: E-Mail des Vorgesetzten, die Leistungen hervorhebt). **Direktes** und **indirektes Lob** sind dagegen die beiden Unterformen des **verbalen Lobs**, **Symbole** wie Trophäen und Medaillen gehören zum **nonverbalen Lob**.","quelle":"f02","schwierigkeit":"leicht","id":"q234","wiederholung":true},{"thema":"Personal, Motivation und Lob","frage":"Welche Aussagen zur intrinsischen und extrinsischen Motivation treffen laut Vorlesung zu?","optionen":["Intrinsische Motivation basiert auf persönlichen Interessen und der Aufgabe selbst","Bei intrinsischer Motivation wirkt ausgesprochenes Lob verstärkend","Bei extrinsischer Motivation gilt das Lob als externer Anreiz","Extrinsische Motivation entsteht ohne äußere Anreize aus dem Vergnügen an der Arbeit","Intrinsische Motivation wird ausschließlich durch Belohnungen von außen ausgelöst"],"richtig":[0,1,2],"erklaerung":"Die Folie beschreibt **intrinsische Motivation** als Motivation **von innen heraus**, die auf **persönlichen Interessen und dem Vergnügen an der Aufgabe selbst** beruht; **Lob wirkt hier verstärkend**. **Extrinsische Motivation** wird durch **äußere Anreize wie Belohnungen oder Anerkennung (Lob)** beeinflusst, **Lob gilt dort als externer Anreiz**. Die beiden übrigen Optionen **vertauschen genau diese Zuordnung**: Das „Vergnügen an der Arbeit ohne äußere Anreize\" gehört zur **intrinsischen**, das Auslösen „durch Belohnungen von außen\" zur **extrinsischen** Motivation.","quelle":"f04","schwierigkeit":"mittel","id":"q235","essential":true,"wiederholung":true},{"thema":"Personal, Motivation und Lob","frage":"Welche der folgenden Themen gehören zum Themenbereich \"Lob, Anerkennung und Wertschätzung\"?","optionen":["Maslowsche Bedürfnispyramide","Feedback und Kritik","Selbstmotivation","Personalauswahl und Einstellung","Konfliktmanagement im Team"],"richtig":[0,1,2],"erklaerung":"Die Wiederholungsfolie nennt sechs Punkte: **Lob – Warum wichtig für den Erfolg?**, **Lob – Formen und Wirkungsmechanismen**, **Motivation – intrinsisch und extrinsisch, verschiedene Typen**, **Selbstmotivation**, **Maslowsche Bedürfnispyramide** und **Feedback und Kritik**. Drei davon stehen hier zur Auswahl. **Personalauswahl und Einstellung** sowie **Konfliktmanagement im Team** stehen weder auf dieser Wiederholungsfolie noch auf den übrigen Folien – dort geht es ausschließlich um die **Formen von Lob** und um **intrinsische vs. extrinsische Motivation**.","quelle":"f06","schwierigkeit":"mittel","id":"q236","essential":true,"wiederholung":true},{"thema":"Geld, Finanzen und Altersvorsorge","frage":"Welche der folgenden Begriffe sind Funktionen des Geldes?","optionen":["Money Mindset","Wertmesser","Zinses-Zins-Effekt","Wertaufbewahrungsmittel","Wertübertragungsmittel"],"richtig":[1,3,4],"erklaerung":"Die Folie listet unter **Funktion** auf: **Zahlungsmittel, Wertmesser, Wertaufbewahrungsmittel, Wertübertragungsmittel und Freiheit**. **Money Mindset** ist ein eigener Punkt derselben Folie (Denkweise „Ich bin finanziell erfolgreich!“), der **Zinses-Zins-Effekt** ebenfalls (Zinsen werden reinvestiert und mitverzinst) – beide gehören nicht zu den Geldfunktionen.","quelle":"f20","schwierigkeit":"leicht","id":"q237","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Üblicherweise werden drei Kernfunktionen unterschieden: Zahlungsmittel, Recheneinheit beziehungsweise Wertmesser und Wertaufbewahrungsmittel. „Wertübertragungsmittel“ kann daraus abgeleitet werden; „Freiheit“ ist keine eigenständige Standardfunktion.","quelle":"Deutsche Bundesbank","url":"https://www.bundesbank.de/de/aufgaben/themen/vertrauen-kern-des-geldes-663226"}},{"thema":"Geld, Finanzen und Altersvorsorge","frage":"Welche der folgenden Punkte sind Grundsätze der Altersvorsorge?","optionen":["Frühzeitig mit der Planung beginnen","Dividenden aus dem Reingewinn ausschütten","Arbeitgeberleistungen des Betriebs nutzen","ETF-Anteile an der Börse handeln","Zu Monatsbeginn regelmäßig Geld sparen"],"richtig":[0,2,4],"erklaerung":"Die Folie nennt vier Grundsätze: **frühzeitig mit der Planung beginnen** (mehr Zeit für Vermögensaufbau und Zinseszinsen), **Budgetplanung und Sparen**, **Arbeitgeberleistungen nutzen** (betriebliche Altersvorsorgepläne, betriebliche Rentenbeiträge) und **Sparen zu Monatsbeginn** (zu Beginn der Berufstätigkeit). **Dividende** und **ETF** stammen aus der Begriffsliste der Wiederholungsfolie und sind dort Definitionen von Anlagebegriffen, keine Vorsorgegrundsätze.","quelle":"f16, f18","schwierigkeit":"leicht","id":"q238"},{"thema":"Geld, Finanzen und Altersvorsorge","frage":"Welche Anteile ordnet die 50-30-20-Regel den jeweiligen Kategorien zu?","optionen":["30 % für Fixkosten","50 % für Fixkosten","20 % für das Sparen","50 % für das Sparen","30 % für Freizeit und Konsum"],"richtig":[1,2,4],"erklaerung":"Die Folie definiert die 50-30-20-Regel als **50 % für Fixkosten**, **30 % für Freizeit | Konsum** und **20 % sparen**. Die beiden übrigen Optionen vertauschen die Anteile: **30 %** gehören zu Freizeit und Konsum, nicht zu den Fixkosten, und **50 %** entfallen auf die Fixkosten, nicht auf das Sparen.","quelle":"f20","schwierigkeit":"leicht","id":"q239","wiederholung":true},{"thema":"Geld, Finanzen und Altersvorsorge","frage":"Welche Aussagen zum Altersvorsorge-Depot sind richtig?","optionen":["Der Start ist zum 1.1.2027 vorgesehen","Der Arbeitgeber verdoppelt den jährlichen Eigenbeitrag","Bis 360 Euro Eigenbeitrag gibt es 50 Cent je gespartem Euro","Es ist eine renditeorientierte Vorsorgemöglichkeit","Erst ab 1.801 Euro Eigenbeitrag gibt es 25 Cent je Euro"],"richtig":[0,2,3],"erklaerung":"Die Folie beschreibt das Altersvorsorge-Depot als **Reform der geförderten privaten Altersvorsorge** und als **renditeorientierte Vorsorgemöglichkeit** mit **Start zum 1.1.2027**. Bis zu einem jährlichen Eigenbeitrag von **360 Euro** gibt es **50 Cent Grundzulage je gespartem Euro**. Die **25 Cent** je Euro gelten für die **weiteren 1.440 Euro, also von 361 bis 1.800 Euro** – nicht erst ab 1.801 Euro. Eine Verdopplung durch den Arbeitgeber steht nirgends; Arbeitgeberleistungen sind ein eigener Punkt der Grundsätze-Folie (betriebliche Altersvorsorgepläne).","quelle":"f19","schwierigkeit":"mittel","id":"q240"},{"thema":"Geld, Finanzen und Altersvorsorge","frage":"Welche der folgenden Begriffserklärungen sind korrekt?","optionen":["Liquidität meint die Wiederanlage von Zinserträgen","Aktien sind eine Beteiligung an Unternehmen","Ein ETF ist ein börsengehandelter Indexfonds","Der Zinses-Zins-Effekt meint das verfügbare Vermögen","Die Dividende ist der jährliche Gewinnanteil je Aktie"],"richtig":[1,2,4],"erklaerung":"Die Folie definiert **Aktien** als **Beteiligung an Unternehmen**, **ETF** als **Exchange Traded Fund, einen börsengehandelten Indexfonds**, und die **Dividende** als den **jährlich auf eine Aktie entfallenden Anteil vom Reingewinn**. Die beiden falschen Optionen tauschen zwei andere Begriffe derselben Folie: Die **Wiederanlage und Mitverzinsung von Zinsen** ist der **Zinses-Zins-Effekt**, und **Planbarkeit sowie verfügbares Vermögen** beschreiben die **Liquidität**.","quelle":"f20","schwierigkeit":"mittel","id":"q241","wiederholung":true,"fachhinweis":{"hinweis":"Zwei Definitionen sind zu absolut: Ein ETF muss kein passiver Indexfonds sein, und eine Dividende wird nicht zwingend jährlich aus dem Reingewinn gezahlt, sondern aus dem Bilanzgewinn beschlossen.","quelle":"BaFin und § 174 AktG","url":"https://www.bafin.de/DE/Verbraucher/GeldanlageWertpapiere/Produkte/ETF/ETF_node.html"}},{"thema":"Unternehmensrecherche und Jahresabschluss","frage":"Welche der folgenden sind Anlaufstellen für die Unternehmensrecherche?","optionen":["Handelsregister","Bundesanzeiger","Lagebericht","Markenregister","Unternehmensaufbau"],"richtig":[0,1,3],"erklaerung":"Die Folie listet als Rechercheorte auf: **Handelsregister**, **Bundesanzeiger**, **Kununu**, **Soziale Netze** und **Markenregister**. Der **Lagebericht** gehört nicht dorthin, sondern steht auf der Folie unter der **Bilanz**-Seite des Jahresabschlusses. Der **Unternehmensaufbau** ist ein eigener Themenpunkt der Unternehmensrecherche, aber keine Quelle bzw. kein Register, in dem man nachschlägt.","quelle":"f47","schwierigkeit":"leicht","id":"q242","essential":true,"wiederholung":true},{"thema":"Unternehmensrecherche und Jahresabschluss","frage":"Welche der folgenden Bestandteile gehören zum Jahresabschluss in Form der Bilanz?","optionen":["Gewinn- und Verlustrechnung","Einnahmen-Überschuss-Rechnung","Lagebericht","Anhang","Unternehmensform"],"richtig":[0,2,3],"erklaerung":"Unter der **Bilanz** stehen auf der Folie bündig die **Gewinn- und Verlustrechnung**, der **Lagebericht** und der **Anhang**. Die **Einnahmen-Überschuss-Rechnung** ist gerade die Gegenseite des Vergleichs 'E/Ü-Rechnung vs. Bilanz' und damit kein Bestandteil der Bilanz-Seite. Die **Unternehmensform** ist ein eigener Gliederungspunkt der Unternehmensrecherche (mit dem Stichwort Selbstständigkeit) und hat mit dem Jahresabschluss auf dieser Folie nichts zu tun.","quelle":"f47","schwierigkeit":"mittel","id":"q243","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Der Lagebericht ist rechtlich kein Bestandteil des Jahresabschlusses. Bei Kapitalgesellschaften bilden Bilanz, GuV und Anhang eine Einheit; der Lagebericht wird separat aufgestellt und ist für kleine Kapitalgesellschaften nicht generell vorgeschrieben.","quelle":"§ 264 HGB","url":"https://www.gesetze-im-internet.de/hgb/__264.html"}},{"thema":"Unternehmensrecherche und Jahresabschluss","frage":"Welche der folgenden sind Formen des Jahresabschlusses?","optionen":["Die Bilanz","Der Lagebericht","Die Einnahmen-Überschuss-Rechnung","Der Anhang","Das Handelsregister"],"richtig":[0,2],"erklaerung":"Die Folie schreibt beim Jahresabschluss ausdrücklich **E/Ü Rechnung vs. Bilanz** – gegenübergestellt werden also die **Einnahmen-Überschuss-Rechnung** und die **Bilanz**. **Lagebericht** und **Anhang** stehen auf der Folie zwar direkt darunter, aber auf der **Bilanz-Seite** dieses Vergleichs (zusammen mit der Gewinn- und Verlustrechnung) – sie sind nicht die beiden gegenübergestellten Formen. Das **Handelsregister** gehört zur Liste der Rechercheorte (**Handelsregister, Bundesanzeiger, Kununu, Soziale Netze, Markenregister**) und nicht zum Jahresabschluss.","quelle":"f47","schwierigkeit":"mittel","id":"q244","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Die Einnahmen-Überschuss-Rechnung ist eine steuerliche Gewinnermittlungsart und kein handelsrechtlicher Jahresabschluss. Präziser wäre „Formen der Gewinnermittlung beziehungsweise des Abschlusses“.","quelle":"§§ 242 HGB, 4 Abs. 3 EStG","url":"https://www.gesetze-im-internet.de/hgb/__242.html"}},{"thema":"Marketing","frage":"Welche Stichworte ordnet die Wiederholungsfolie dem Pitch zu?","optionen":["Rahmenbedingungen","Ausschreibungen","Pitchberater-Agenturen","Direkte Ansprache","Markenmanagement"],"richtig":[0,1,2],"erklaerung":"Die Wiederholungsfolie nennt beim **Pitch** die drei Stichworte **Rahmenbedingungen**, **Ausschreibungen** und **Pitchberater-Agenturen**. **Direkte Ansprache** gehört zur Akquise, **Markenmanagement** zum Branding.","quelle":"f14","schwierigkeit":"mittel","id":"q245","essential":true,"wiederholung":true},{"thema":"Projektmanagement","frage":"Die Folie zählt auf, welche Tätigkeiten als Projektmanagement (PM) bezeichnet werden. Welche der folgenden Tätigkeiten gehören zu dieser Aufzählung?","optionen":["Organisieren","Initiieren","Steuern","Budgetieren","Kontrollieren","Umsetzen","Abschließen","Optimieren","Auswerten","Verwalten"],"richtig":[1,2,4,6,8],"erklaerung":"Als **Projektmanagement** wird das **Initiieren**, das **Planen**, das **Steuern**, das **Kontrollieren**, das **Abschließen** und das **Auswerten** von Projekten bezeichnet (sechs Tätigkeiten; **Planen** stand hier nicht zur Auswahl).\n\n**Organisieren** und **Umsetzen** gehören dagegen zum Stichpunkt **Wozu?** der Wiederholungsfolie (*planen, organisieren, umsetzen und kontrollieren*). **Budgetieren** und **Verwalten** stammen aus den grundlegenden **BWL-Kenntnissen für Designer** (*die Planung und Budgetierung*, *die Verwaltung von Finanzen und Buchhaltung*). **Optimieren** gehört zum Nutzen der **Kalkulation** (*seine Arbeitsprozesse zu optimieren und effizienter zu arbeiten*).","quelle":"f07, f08, f43, f50","schwierigkeit":"schwer","familie":"pm-taetigkeiten","id":"q246","wiederholung":true},{"thema":"Projektmanagement","frage":"Die Projektdefinition nennt Ressourcen als eine der Vorgaben und führt dazu ausdrücklich Beispiele an. Welche der folgenden Begriffe stehen dort als Beispiele für Ressourcen?","optionen":["Gewinnmarge","Personal","Finanzierung bzw. Kosten","Zielgruppenanalyse","Betriebsmittel","Qualität","Stundensätze und Tagessätze","Produktions- und Arbeitsbedingungen","Quantitative und qualitative Marktforschung","Buchhaltung"],"richtig":[1,2,4,7],"erklaerung":"Die Projektdefinition nennt als Ressourcen ausdrücklich **Finanzierung bzw. Kosten**, **Produktions- und Arbeitsbedingungen**, **Personal** und **Betriebsmittel**.\n\n**Qualität** ist auf derselben Folie keine Ressource, sondern steht neben **Zeit** und **Ressourcen** als eigene der drei **Vorgaben**. **Gewinnmarge** sowie **Stundensätze und Tagessätze** gehören zur **Kalkulation**. **Zielgruppenanalyse** und **quan
