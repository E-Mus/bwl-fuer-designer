ert Prozent Euphorie."}]</script>
<script>
"use strict";

const FRAGEN = JSON.parse(document.getElementById('fragen-data').textContent);
const MEMES = JSON.parse(document.getElementById('meme-data').textContent);
const MEME_NACH_TERM = new Map(MEMES.map(m=>[m.term,m]));
const MEME_FALLBACK = {
  'Grundlagen der BWL':'unternehmen',
  'Rechtsformen':'unternehmen',
  'Urheber- und Nutzungsrecht':'eigentum',
  'Businessplan und Gründung':'investor',
  'Steuern':'steuer',
  'Rechnungen und E-Rechnung':'rechnung',
  'Angebot, Vertrag und Briefing':'vertrag',
  'Kalkulation und Liquidität':'kalkulation',
  'Marketing':'marketing',
  'Projektmanagement':'leistung',
  'Personal, Motivation und Lob':'leistung',
  'Geld, Finanzen und Altersvorsorge':'vermögen',
  'Unternehmensrecherche und Jahresabschluss':'unternehmen'
};
const PRUEFUNGS_LAENGE = 40, PRUEFUNGS_ZEIT = 40*60, BLITZ_ZEIT = 60;
const LS='bwl-v3', LS_SET='bwl-einstellungen';
const LS_WILLKOMMEN='bwl-willkommen-v2';
const TAG=86400000;
// Sofort-Wiedervorlage: falsch beantwortete Fragen kommen im SELBEN Durchgang wieder.
// Beim Pauken bringt das mehr als Tagesintervalle - die greifen vor der Pruefung nicht mehr.
const WV_ABSTAND=[6,12];              // erste Wiederholung nach 6, zweite nach 12 Fragen
const WV_MODI=new Set(['fehler','thema','alle']);

// Globale Einstellungen - gelten fuer ALLE Uebungsmodi
const EINST_VERSION = 3;
const EINST_STD = {
  umfang:'essential',
  schwierigkeit:'gemischt',
  zeitlimit:true,
  bwlTest:null,
  pruefung:'2026-07-29',
  version:EINST_VERSION
};
let einst = (()=>{
  let gespeichert={};
  try{ gespeichert=JSON.parse(localStorage.getItem(LS_SET))||{}; }catch(e){}
  if(gespeichert.version!==EINST_VERSION){
    const alt=gespeichert.schwierigkeit;
    gespeichert.umfang=(alt==='essential'||alt==='alle')
      ? alt
      : ['leicht','mittel','schwer'].includes(alt)
        ? 'alle'
        : 'essential';
    gespeichert.schwierigkeit=['leicht','mittel','schwer'].includes(alt)?alt:'gemischt';
    gespeichert.version=EINST_VERSION;
  }
  const wert=Object.assign({}, EINST_STD, gespeichert);
  if(!['essential','wiederholung','alle'].includes(wert.umfang)) wert.umfang='essential';
  if(!['gemischt','leicht','mittel','schwer'].includes(wert.schwierigkeit)) wert.schwierigkeit='gemischt';
  try{localStorage.setItem(LS_SET,JSON.stringify(wert))}catch(e){}
  return wert;
})();
function setzeEinst(k,v){ einst[k]=v; try{localStorage.setItem(LS_SET,JSON.stringify(einst))}catch(e){} }

const stil='editorial';
function setzeStil(){
  document.getElementById('app').dataset.style=stil;
}

let willkommenOffen=(()=>{
  try{
    return !localStorage.getItem(LS_WILLKOMMEN);
  }catch(e){ return true }
})();
let onboardingRecht=null;

FRAGEN.forEach(f=>{
  f.multi=Array.isArray(f.richtig);
  f.richtigSet=new Set(f.multi?f.richtig:[f.richtig]);
  f.strikt=f.schwierigkeit==='schwer';
});

/* ───────── Speicher ───────── */
function laden(){
  try{const s=JSON.parse(localStorage.getItem(LS));
    if(s&&s.stats) return Object.assign({stats:{},versuche:[],rekorde:{},tage:{},xp:0},s);
  }catch(e){}
  return {stats:{},versuche:[],rekorde:{},tage:{},xp:0};
}
function sichern(){try{localStorage.setItem(LS,JSON.stringify(stand))}catch(e){}}
let stand=laden();

const datumLokal=d=>{
  const z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
};
const heute=()=>datumLokal(new Date());
function statFuer(id){
  if(!stand.stats[id]) stand.stats[id]={gesehen:0,richtig:0,falsch:0,zuletzt:null};
  return stand.stats[id];
}
// Vier Zustaende statt Karteikasten-Faecher
function status(f){
  const s=stand.stats[f.id];
  if(!s||!s.gesehen) return 'neu';
  if(s.zuletzt==='falsch') return 'falsch';
  return (s.richtig>=2 && s.falsch===0) ? 'sitzt' : 'wackelig';
}
function merkeAntwort(id,punkte,schwierigkeit){
  const st=statFuer(id), voll=punkte>=1;
  st.gesehen++;
  if(voll){st.richtig++;st.zuletzt='richtig';}
  else{st.falsch++;st.zuletzt='falsch';}
  const d=heute();
  if(!stand.tage[d]) stand.tage[d]={n:0,ok:0};
  stand.tage[d].n++; if(voll) stand.tage[d].ok++;
  stand.xp=(stand.xp||0)+Math.round(punkte*(schwierigkeit==='schwer'?18:schwierigkeit==='mittel'?12:8));
  sichern();
}
const LVL=xp=>Math.floor(Math.sqrt((xp||0)/40))+1;
const LVL_XP=l=>Math.pow(l-1,2)*40;
function fehlerIds(){return basis().filter(f=>stand.stats[f.id]&&stand.stats[f.id].zuletzt==='falsch').map(f=>f.id)}
const ungesehen=()=>basis().filter(f=>status(f)==='neu');
const luecken=()=>basis().filter(f=>{const st=status(f);return st==='falsch'||st==='wackelig'});
function statusVerteilung(pool=basis()){
  const v={neu:0,falsch:0,wackelig:0,sitzt:0};
  pool.forEach(f=>v[status(f)]++);
  return v;
}
function statusTabelle(v){
  return `<div class="boxes status-boxes" style="grid-template-columns:repeat(4,1fr)">
    <div class="boxcol" data-state="falsch"><span class="boxn">${v.falsch}</span><span class="boxl">Falsch</span></div>
    <div class="boxcol" data-state="wackelig"><span class="boxn">${v.wackelig}</span><span class="boxl">Wackelt</span></div>
    <div class="boxcol" data-state="neu"><span class="boxn">${v.neu}</span><span class="boxl">Neu</span></div>
    <div class="boxcol" data-state="sitzt"><span class="boxn">${v.sitzt}</span><span class="boxl">Sitzt</span></div>
  </div>`;
}
function statusBalken(v,{kompakt=false}={}){
  const ges=v.falsch+v.wackelig+v.neu+v.sitzt||1;
  const segment=(status,n)=>`<span class="status-segment" data-state="${status}"
    style="width:${(n/ges*100).toFixed(4)}%" title="${n}"></span>`;
  return `<div class="status-progress${kompakt?' compact':''}" role="img"
      aria-label="${v.falsch} falsch, ${v.wackelig} wackelt, ${v.neu} neu, ${v.sitzt} sitzt">
      ${segment('falsch',v.falsch)}${segment('wackelig',v.wackelig)}
      ${segment('sitzt',v.sitzt)}${segment('neu',v.neu)}
    </div>`;
}
function rekord(k,w){
  if(!stand.rekorde) stand.rekorde={};
  if(!stand.rekorde[k]||w>stand.rekorde[k]){stand.rekorde[k]=w;sichern();return true}

function mische(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function entdoppleFamilien(pool){
  const g=new Set();
  return pool.filter(f=>{if(!f.familie)return true;if(g.has(f.familie))return false;g.add(f.familie);return true});
}
function gewichtet(pool,n){
  const b=pool.map(f=>{
    const s=stand.stats[f.id]; let g=1;
    if(!s||s.gesehen===0)g=3; else if(s.zuletzt==='falsch')g=4; else if(s.richtig>=2)g=.45;
    return{f,s:Math.random()/g};
  });
  b.sort((x,y)=>x.s-y.s);
  return b.slice(0,n).map(x=>x.f);
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function bewerte(f,gew){
  const g=new Set(gew);
  if(!f.multi) return g.has(f.richtig)?1:0;
  let t=0,x=0; g.forEach(i=>f.richtigSet.has(i)?t++:x++);
  const alle=t===f.richtigSet.size&&x===0;
  if(f.strikt) return alle?1:0;
  if(alle) return 1;
  return Math.max(0,Math.min(1,(t-x)/f.richtigSet.size));
}
function themaQuote(t,pool=FRAGEN){
  const ids=pool.filter(f=>f.thema===t);

const zuletztGezogen=new Map();
function zufallAus(liste,gruppe){
  if(!liste||!liste.length) return null;
  if(liste.length===1) return liste[0];
  const vorher=zuletztGezogen.get(gruppe);
  let wahl;
  do{ wahl=liste[Math.floor(Math.random()*liste.length)] }while(wahl===vorher);
  zuletztGezogen.set(gruppe,wahl);
  return wahl;
}

function zaehlHoch(el,ziel,dauer=650){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=ziel;return}
  const start=performance.now(), von=0;
  const eins=Number.isInteger(ziel);
  (function tick(t){
    const p=Math.min(1,(t-start)/dauer), e=1-Math.pow(1-p,3);
    const w=von+(ziel-von)*e;
    el.textContent=eins?Math.round(w):(Math.round(w*10)/10).toString().replace('.',',');
    if(p<1) requestAnimationFrame(tick);
  })(start);
}

/* ───────── Diagramme (reines SVG) ───────── */
function ring(pct,size=76){
  const r=size/2-3, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="ringsvg"
    aria-hidden="true" focusable="false">
    <circle class="ringbg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="2"/>
    <circle class="ringfg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="2"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="butt"/>
  </svg>`;
}
function verlauf(werte,w=280,h=54){
  if(werte.length<2) return `<div class="leer">Noch keine abgeschlossenen Lernrunden.</div>`;
  const max=100, dx=w/(werte.length-1);
  const pts=werte.map((v,i)=>[i*dx, h-4-(v/max)*(h-10)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const flaeche=d+` L ${w} ${h} L 0 ${h} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"
    class="linesvg" aria-hidden="true" focusable="false">
    <path class="linefill" d="${flaeche}"/>
    <path class="linestroke" d="${d}" fill="none" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"/>
    ${pts.slice(-1).map(p=>`<circle class="linedot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/>`).join('')}
  </svg>`;
}
function heatmap(){
  const tage=[];
  for(let i=13;i>=0;i--){
    const d=datumLokal(new Date(Date.now()-i*TAG));
    const e=stand.tage[d];
    tage.push({d,n:e?e.n:0});
  }
  const max=Math.max(1,...tage.map(t=>t.n));
  return `<div class="heat">${tage.map(t=>{
    const lv=t.n===0?0:Math.min(4,Math.ceil(t.n/max*4));
    return `<div class="heatd" data-lv="${lv}" title="${t.d}: ${t.n} Fragen"></div>`;
  }).join('')}</div>`;
}

let tab='ueben', sitzung=null, ticker=null, zettel=false, zettelOffen=true;
const app=document.getElementById('app');
function stopTicker(){if(ticker){clearInterval(ticker);ticker=null}}
const istEssential = f => f.essential===true;
const istWiederholung = f => f.wiederholung===true;
function umfangPool(umfang=einst.umfang){
  if(umfang==='essential') return FRAGEN.filter(istEssential);
  if(umfang==='wiederholung') return FRAGEN.filter(istWiederholung);
  return FRAGEN.slice();
}
// Stoffumfang und Schwierigkeit gelten global fuer jeden Uebungsmodus.
function basis(){
  const pool=umfangPool();
  if(einst.schwierigkeit==='gemischt') return pool;
  return pool.filter(f=>f.schwierigkeit===einst.schwierigkeit);
}
const umfangName = s => s==='wiederholung'
  ? 'Wiederholung'
  : s==='alle'
    ? 'Alles'
    : 'Essential';
const stufeName = s => s==='gemischt' ? 'Gemischt' : s[0].toUpperCase()+s.slice(1);

function starte(modus,opt={}){
  stopTicker();
  let pool,titel='',endlos=false,zeit=0;
  const B=basis();
  if(modus==='pruefung'){
    const p=entdoppleFamilien(mische(B));
    pool=gewichtet(p,Math.min(PRUEFUNGS_LAENGE,p.length)); titel='Prüfung';
    if(einst.zeitlimit) zeit=PRUEFUNGS_ZEIT;
  }else if(modus==='lernen'){
    const neu=mische(B.filter(f=>status(f)==='neu'));
    const luecke=mische(B.filter(f=>{const s=status(f);return s==='falsch'||s==='wackelig'}));
    const sicher=mische(B.filter(f=>status(f)==='sitzt'));
    pool=entdoppleFamilien(neu.concat(luecke,sicher)).slice(0,10); titel='Lernen';
  }else if(modus==='thema'){
    pool=mische(B.filter(f=>f.thema===opt.thema)); titel=opt.thema;
  }else if(modus==='fehler'){
    const ids=new Set(fehlerIds()); pool=mische(B.filter(f=>ids.has(f.id))); titel='Fehler';
  }else if(modus==='fehlerAlle'){
    pool=mische(luecken()); titel='Lücken';
  }else if(modus==='blitz'){
    pool=mische(B); titel='Blitz'; zeit=BLITZ_ZEIT; endlos=true;
  }else{pool=mische(B); titel='Alle'}

  if(!pool.length){toast('Keine Fragen für diese Auswahl');return}
  sitzung={modus,titel,endlos,fragen:pool.map(f=>({frage:f,reihenfolge:mische(f.optionen.map((_,i)=>i)),noetig:0})),
    i:0,gewaehlt:new Set(),aufgedeckt:false,punkte:0,antworten:[],serie:0,besteSerie:0,
    zeitGesamt:zeit,zeitRest:zeit,fertig:false,xpVor:stand.xp||0,erstmalig:pool.length,wdh:0};
  if(zeit){
    ticker=setInterval(()=>{
      if(!sitzung||sitzung.fertig){stopTicker();return}
      sitzung.zeitRest--;
      if(sitzung.zeitRest<=0){zeitAbgelaufen();return}
      uhrAktualisieren();
    },1000);
  }
  zeichne();
}
const sofort=()=>sitzung.modus!=='pruefung';
const aktuelle=()=>sitzung.fragen[sitzung.i%sitzung.fragen.length];

function waehle(pos){
  if(sitzung.aufgedeckt)return;
  const f=aktuelle().frage;
  if(f.multi){
    sitzung.gewaehlt.has(pos)?sitzung.gewaehlt.delete(pos):sitzung.gewaehlt.add(pos);
    zeichne();
  }else{
    sitzung.gewaehlt=new Set([pos]);
    sofort()?decke():zeichne();
  }
}
// Falsche Frage kommt im selben Durchgang wieder - erst nach 6, dann nach 12 Fragen.
function wiedervorlage(e,p){
  if(!WV_MODI.has(sitzung.modus)) return;
  let noetig = e.noetig||0;
  if(p<1) noetig = 2;                 // falsch: muss zweimal sitzen
  else if(noetig>0) noetig -= 1;      // Wiederholung richtig: einmal weniger noetig
  else return;
  if(noetig<=0) return;
  const abstand = WV_ABSTAND[noetig===2?0:1];
  const pos = Math.min(sitzung.i+abstand, sitzung.fragen.length);
  sitzung.fragen.splice(pos,0,{
    frage:e.frage, reihenfolge:mische(e.frage.optionen.map((_,k)=>k)), noetig, wdh:true
  });
  sitzung.wdh++;
}

function decke(){
  const e=aktuelle(), echt=[...sitzung.gewaehlt].map(p=>e.reihenfolge[p]);
  const p=bewerte(e.frage,echt);
  sitzung.aufgedeckt=true; sitzung.punkte+=p;
  sitzung.antworten.push({id:e.frage.id,punkte:p,gewaehlt:echt,wdh:!!e.wdh});
  // Spruch und Zitat einmal beim Aufdecken ziehen, damit sie beim Neuzeichnen stehen bleiben.
  sitzung.spruch=feedbackSatire(p);
  sitzung.zitat=sitzung.antworten.length%ZITAT_ABSTAND===0?zitatZiehen():null;
  merkeAntwort(e.frage.id,p,e.frage.schwierigkeit);
  wiedervorlage(e,p);
  if(p>=1){
    sitzung.serie++; sitzung.besteSerie=Math.max(sitzung.besteSerie,sitzung.serie);
    if(sitzung.serie>0&&sitzung.serie%5===0)
      toast(satireStufe('serie').replace('${n}',sitzung.serie));
  }else sitzung.serie=0;
  if(sitzung.modus==='blitz'){zeichne();setTimeout(()=>{if(sitzung&&!sitzung.fertig)weiter()},680);return}
  zeichne();
}
function zeitAbgelaufen(){
  if(!sitzung||sitzung.fertig)return;
  sitzung.zeitRest=0;
  // Eine im Moment des Timeouts gewaehlte Antwort zaehlt noch zur Pruefung.
  if(sitzung.modus==='pruefung'&&!sitzung.aufgedeckt&&sitzung.gewaehlt.size){
    const e=aktuelle(), echt=[...sitzung.gewaehlt].map(p=>e.reihenfolge[p]);
    const p=bewerte(e.frage,echt);
    sitzung.punkte+=p;
    sitzung.antworten.push({id:e.frage.id,punkte:p,gewaehlt:echt,wdh:false});
    merkeAntwort(e.frage.id,p,e.frage.schwierigkeit);
  }
  ergebnis();
}
function weiter(){
  if(!sitzung.aufgedeckt){
    if(!sitzung.gewaehlt.size)return;
    decke();
    if(sofort())return;
  }
  if(!sitzung.endlos&&sitzung.i>=sitzung.fragen.length-1){ergebnis();return}
  sitzung.i++;
  if(sitzung.endlos&&sitzung.i>=sitzung.fragen.length){
    sitzung.fragen=mische(basis()).map(f=>({frage:f,reihenfolge:mische(f.optionen.map((_,i)=>i))}));
    sitzung.i=0;
  }
  sitzung.gewaehlt=new Set(); sitzung.aufgedeckt=false;
  zeichne();
}
function ergebnis(){
  stopTicker(); sitzung.fertig=true; sitzung.endzitat=zitatZiehen();
  // Gewertet wird der ERSTE Versuch je Frage - Wiedervorlagen wuerden die Quote sonst schoenrechnen
  const erst=sitzung.antworten.filter(a=>!a.wdh);
  const n=erst.length, gesamt=sitzung.modus==='pruefung'?sitzung.erstmalig:n;
  const voll=erst.filter(a=>a.punkte>=1).length;
  if(sitzung.modus==='blitz') sitzung.neu=rekord('blitz',voll);
  sitzung.serieRekord=rekord('serie',sitzung.besteSerie);
  const pErst=erst.reduce((x,a)=>x+a.punkte,0);
  if(gesamt) stand.versuche.push({modus:sitzung.modus,punkte:Math.round(pErst*10)/10,gesamt,ts:Date.now()});
  if(stand.versuche.length>80) stand.versuche=stand.versuche.slice(-80);
  sichern();
  zeichne();
  const quote=gesamt?pErst/gesamt:0;
  if(sitzung.neu||sitzung.serieRekord||quote>=.9){
    setTimeout(()=>monetenregen(sitzung.neu?110:70,{banknote:quote>=1}),260);
  }
}

// Kurze Kernaussage; die vollstaendige Begruendung bleibt ueber den Info-Button erreichbar.
function kernsatz(t){
  const sauber=String(t).replace(/\*\*/g,'').replace(/\s+/g,' ').trim();
  const m=sauber.match(/^(.{0,120}?[.!?])(\s|$)/);
  if(m) return m[1];
  if(sauber.length<=120) return sauber;
  return sauber.slice(0,117).replace(/\s+\S*$/,'').trim()+'…';
}

function zeichneFrage(){
  const e=aktuelle(), f=e.frage, n=sitzung.fragen.length;
  const bodyVorher=app.querySelector('.qbody');
  const scrollVorher=bodyVorher?bodyVorher.scrollTop:0;
  const gleicheAnzeige=sitzung.anzeigeIndex===sitzung.i&&sitzung.anzeigeId===f.id;
  const gew=[...sitzung.gewaehlt].map(p=>e.reihenfolge[p]);
  const p=sitzung.aufgedeckt?bewerte(f,gew):0;
  const zeig=sitzung.aufgedeckt&&sofort();
  const meme=zeig&&p>=1?memeFuerFrage(f):null;
  const spruch=zeig?(sitzung.spruch||''):'';
  const prog=sitzung.zeitGesamt?(sitzung.zeitRest/sitzung.zeitGesamt*100):(sitzung.endlos?100:sitzung.i/n*100);
  let btn=T('weiter');
  if(sitzung.aufgedeckt) btn=(!sitzung.endlos&&sitzung.i>=n-1)?T('auswerten'):T('weiter');
  else if(sofort()&&f.multi) btn=T('pruefen');
  else if(!sofort()&&sitzung.i>=n-1) btn=T('auswerten');

  setzeInhalt(`<div class="quiz">
    <div class="qtop">
      <button class="qx" data-ab aria-label="Training beenden">✕</button>
      <div class="qprog${sitzung.zeitGesamt?' time':''}" role="progressbar"
        aria-label="${sitzung.zeitGesamt?'Verbleibende Zeit':'Fortschritt'}"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(prog)}">
        <div class="qprogfill" id="pf" style="width:${prog}%"></div></div>
      ${sitzung.zeitGesamt?`<span class="qcount market-clock" id="uhr">${mmss(sitzung.zeitRest)}</span>`:
        sitzung.endlos?`<span class="qcount blitz-yield">€ ${sitzung.serie}</span>`:`<span class="qcount">${sitzung.i+1}/${n}</span>`}
    </div>
    <div class="qbody">
      <div class="qmeta">
        <span class="qtag">${esc(f.thema)}</span>
        <span class="qtag diff" data-d="${f.schwierigkeit}">${stufeName(f.schwierigkeit)}</span>
        <span class="qtag qserial">BWL–${esc(f.id.toUpperCase())}–EUR</span>
        ${e.wdh?`<span class="qtag">nochmal</span>`:''}
      </div>
      <div class="qtext">${md(f.frage)}</div>
      <div class="qhint${f.multi?' multi':''}">${f.multi
        ? `${f.richtigSet.size} von ${f.optionen.length} ankreuzen · ${f.strikt?'alles oder nichts':'Teilpunkte'}`
        : 'Eine Antwort ist richtig'}</div>
      <div class="opts${f.optionen.length>6?' dense':''}">
        ${e.reihenfolge.map((echt,pos)=>{
          let cls='';
          const g=sitzung.gewaehlt.has(pos);
          if(sitzung.aufgedeckt){
            if(f.richtigSet.has(echt)) cls=g?' is-right':' is-missed';
            else if(g) cls=' is-wrong';
          }else if(g) cls=' is-sel';
          const z=sitzung.aufgedeckt?(f.richtigSet.has(echt)?'✓':(g?'✕':(pos===9?'0':pos+1)))
                                    :(f.multi&&g?'✓':(pos===9?'0':pos+1));
          return `<button class="opt${cls}${f.multi?' multi':' single'}" data-pos="${pos}"
            ${f.multi?`aria-pressed="${g}"`:''} ${sitzung.aufgedeckt?'disabled':''}>
            <span class="opt-k">${z}</span><span class="opt-t">${md(f.optionen[echt])}</span></button>`;
        }).join('')}
      </div>
    </div>
    ${zeig?`<div class="answer-feedback" role="status" data-r="${p>=1?'ok':p>0?'teil':'bad'}">
      <span class="fb-v">${p>=1?esc(T('istRichtig')):p>0?`${esc(T('istTeilweise'))} · ${Math.round(p*100)} %`:esc(T('istFalsch'))}</span>

        </div>
      </figure>`:''}
      <span class="fb-p">${md(kernsatz(f.erklaerung))}</span>
      ${meme?'':zitatHtml(sitzung.zitat)}
      <div class="answer-detail" id="answer-detail" hidden>
        <span class="answer-detail-title">Erklärung</span>
        <span>${md(f.erklaerung)}</span>
        ${f.quelle?`<span class="fb-q">Folie ${esc(f.quelle)}</span>`:''}

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>waehle(+b.dataset.pos));
  app.querySelector('[data-weiter]').onclick=weiter;
  app.querySelector('[data-ab]').onclick=()=>{stopTicker();sitzung=null;zeichne()};
  const info=app.querySelector('[data-info]');
  if(info) info.onclick=()=>{
    const detail=app.querySelector('#answer-detail'), offen=detail.hidden;
    const meme=app.querySelector('.meme-reaction');
    detail.hidden=!offen;
    if(meme) meme.hidden=offen;
    info.setAttribute('aria-expanded',String(offen));
    info.classList.toggle('is-on',offen);
  };
  const memeBild=app.querySelector('.meme-reaction img');
  if(memeBild) memeBild.addEventListener('error',()=>{
    memeBild.hidden=true;
    const ersatz=app.querySelector('.meme-fallback');
    if(ersatz) ersatz.hidden=false;

  const body=app.querySelector('.qbody');
  body.scrollTop=gleicheAnzeige?scrollVorher:0;
  sitzung.anzeigeIndex=sitzung.i;
  sitzung.anzeigeId=f.id;
}

  u.classList.toggle('low',sitzung.zeitRest<=60);
  if(pf){
    const pct=sitzung.zeitRest/sitzung.zeitGesamt*100;
    pf.style.width=pct+'%';
    pf.parentElement.setAttribute('aria-valuenow',Math.round(pct));
  }
}

function zeichneErgebnis(){
  const erst=sitzung.antworten.filter(a=>!a.wdh);
  const n=erst.length, gesamt=sitzung.modus==='pruefung'?sitzung.erstmalig:n;
  const offen=Math.max(0,gesamt-n), voll=erst.filter(a=>a.punkte>=1).length;
  const pErst=erst.reduce((x,a)=>x+a.punkte,0);
  const pkt=Math.round(pErst*10)/10, pct=gesamt?Math.round(pErst/gesamt*100):0;
  const xpNeu=(stand.xp||0)-sitzung.xpVor;
  // Ab Stufe 3 wird die Wissensdividende in eine erfundene Waehrung umgerechnet.
  const k=xpKurs();
  const kurs=bwlStufe()>=ZITAT_AB
    ? ` ≙ ${(xpNeu*k).toFixed(2).replace('.',',')} Shareholder Value`
      +(bwlStufe()>=BWL_MAX?` (Tageskurs ${k.toFixed(2).replace('.',',')})`:'')
    : '';
  const stempel=pct===100?T('stempelTop'):pct>=60?T('stempelOk'):T('stempelBad');
  const abschluss=abschlussText(pct);
  let gross,unter;
  if(sitzung.modus==='blitz'){gross=voll;unter=`in 60 Sekunden${sitzung.neu?' · NEUER REKORD':' · Rekord '+stand.rekorde.blitz}`}
  else{gross=pkt+' / '+gesamt;unter=`${pct} % · ${voll} vollständig richtig${offen?' · '+offen+' offen':''}`}

  const proThema={};
  erst.forEach(a=>{
    const f=FRAGEN.find(x=>x.id===a.id);
    const t=proThema[f.thema]||(proThema[f.thema]={p:0,n:0});
    t.n++;t.p+=a.punkte;
  });
  const falsch=erst.filter(a=>a.punkte<1);

  setzeInhalt(`<div class="quiz">
    <div class="qbody" aria-live="polite" style="padding-top:calc(14px + env(safe-area-inset-top))">
      <div class="res-hero">
        <div class="res-report">${esc(T('ergebnisKopf'))}</div>
        <div class="res-stamp" data-grade="${pct===100?'top':pct>=60?'ok':'bad'}"
          title="Satirischer Prüfvermerk">${esc(stempel)}</div>
        <div class="res-num">${gross}</div>
        <div class="res-sub">${unter}</div>
        <div class="res-sub">${esc(T('xp'))} +${xpNeu} XP${kurs}${sitzung.besteSerie>1?` · ${esc(T('serie'))} ${sitzung.besteSerie}`:''}${sitzung.wdh?` · ${sitzung.wdh} Wiedervorlagen`:''}</div>
        <div class="res-closing">${abschluss}</div>
        ${zitatHtml(sitzung.endzitat)}
      </div>
      <div class="chartcard">
        <span class="chart-t">${esc(T('nachThema'))}</span>
        ${Object.entries(proThema).sort((a,b)=>a[0].localeCompare(b[0],'de')).map(([t,v])=>{
          const q=Math.round(v.p/v.n*100);
          return `<div class="topic-stat">
            <div class="topic-stat-head"><span class="barlab">${esc(t)}</span>
              <span class="barval">${Math.round(v.p*10)/10}/${v.n}</span></div>
            <div class="bartrack"><div class="barfill" data-w="${q}"></div></div>
          </div>`;
        }).join('')}
      </div>
      ${falsch.length?`<div class="chartcard rev">
        <span class="chart-t">Zu wiederholen (${falsch.length})</span>
        ${falsch.map(a=>{
          const f=FRAGEN.find(x=>x.id===a.id);
          const rt=[...f.richtigSet].map(i=>f.optionen[i]);
          const dein=a.gewaehlt.length?a.gewaehlt.map(i=>f.optionen[i]):['nichts gewählt'];
          return `<details><summary><span class="mark" data-t="${a.punkte>0?'teil':'bad'}">${a.punkte>0?'~':'✕'}</span><span>${md(f.frage)}</span></summary>
            <div class="rev-b">
              <span>Deine Antwort: ${dein.map(md).join(' · ')}</span>
              <span>Richtig: <b>${rt.map(md).join(' · ')}</b></span>
              <span>${md(f.erklaerung)}</span>
            </div></details>`;
        }).join('')}
      </div>`:''}
    </div>
    <div class="qact">
      ${falsch.length?`<button class="btn btn-ghost narrow" data-fehler>${esc(T('fehler'))} üben</button>`:''}
      <button class="btn btn-primary" data-home>Fertig</button>
    </div>
  </div>`);

  app.querySelector('[data-home]').onclick=()=>{sitzung=null;tab='ueben';zeichne()};
  const fb=app.querySelector('[data-fehler]');
  if(fb) fb.onclick=()=>starte('fehler');
  animiereBalken();
  const rn=app.querySelector('.res-num');
  if(rn&&typeof gross==='number') zaehlHoch(rn,gross);
}

function bindeStart(){
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;zeichne()});
  app.querySelectorAll('[data-tab-jump]').forEach(b=>b.onclick=()=>{tab=b.dataset.tabJump;zeichne()});
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>starte(b.dataset.go));
  const z=app.querySelector('[data-zettel]');
  if(z) z.onclick=()=>{zettel=true;zeichne()};
  app.querySelectorAll('[data-thema]').forEach(b=>b.onclick=()=>starte('thema',{thema:b.dataset.thema}));
  app.querySelectorAll('[data-umfang]').forEach(b=>b.onclick=()=>{
    setzeEinst('umfang',b.dataset.umfang); zeichne(); toast(umfangName(einst.umfang));
  });
  app.querySelectorAll('[data-schwer]').forEach(b=>b.onclick=()=>{
    setzeEinst('schwierigkeit',b.dataset.schwer); zeichne(); toast(stufeName(einst.schwierigkeit));
  });
  app.querySelectorAll('[data-zeit]').forEach(b=>b.onclick=()=>{
    setzeEinst('zeitlimit',b.dataset.zeit==='1'); zeichne();
  });
  const bwlAuto=app.querySelector('[data-bwl-auto]');
  if(bwlAuto) bwlAuto.onclick=()=>{ setzeEinst('bwlTest',null); zeichne(); };
  const bwlHand=app.querySelector('[data-bwl-hand]');
  if(bwlHand) bwlHand.onclick=()=>{ setzeEinst('bwlTest',bwlStufe()); zeichne(); };
  const bwlRegler=app.querySelector('[data-bwl-slider]');
  if(bwlRegler) bwlRegler.oninput=()=>{
    setzeEinst('bwlTest',+bwlRegler.value);
    setzeBwl();
    // Nur die Beschriftung nachziehen: ein Neuzeichnen wuerde den Regler
    // waehrend des Ziehens unter dem Finger wegreissen.
    const note=bwlRegler.closest('.chartcard').querySelector('.setting-note');
    const s=+bwlRegler.value;
    if(note) note.textContent=`Stufe ${s} · ${BWL_STUFEN[s].rolle}. `
      +`Der Regler überschreibt den automatischen Wert (aktuell Stufe ${bwlStufeAuto()}).`;
    bwlRegler.parentElement.querySelectorAll('.bwl-reglerskala span')
      .forEach((el,i)=>el.classList.toggle('is-on',i===s));
  };
  if(bwlRegler) bwlRegler.onchange=()=>zeichne();
  const tm=app.querySelector('[data-termin]');
  if(tm) tm.onclick=()=>{
    const v=prompt('Prüfungstermin (JJJJ-MM-TT)', einst.pruefung||'');
    const wert=v&&v.trim(), datum=wert&&new Date(wert+'T00:00:00');
    if(wert && /^\d{4}-\d{2}-\d{2}$/.test(wert) && !Number.isNaN(datum.getTime()) && datumLokal(datum)===wert){
      setzeEinst('pruefung',wert); zeichne();
    }
    else if(v!==null) toast('Format: 2026-07-29');
  };
  const tw=app.querySelector('[data-termin-weg]');
  if(tw) tw.onclick=()=>{ setzeEinst('pruefung',''); zeichne(); };
  const r=app.querySelector('[data-reset]');
  if(r) r.onclick=()=>{
    if(confirm('Allen Fortschritt löschen? Auch Rekorde, XP und Karteikasten.')){
      stand={stats:{},versuche:[],rekorde:{},tage:{},xp:0}; sichern(); zeichne();
    }
  };
  const rn=app.querySelector('[data-count]');
  if(rn) zaehlHoch(rn,+rn.dataset.count);
}
function animiereBalken(){
  requestAnimationFrame(()=>{
    app.querySelectorAll('[data-w]').forEach(el=>{el.style.width=el.dataset.w+'%'});
  });
}

document.addEventListener('keydown',ev=>{
  if(!sitzung||sitzung.fertig)return;
  const f=aktuelle().frage;
  if(/^[0-9]$/.test(ev.key)){
    const pos=ev.key==='0'?9:+ev.key-1;
    if(pos<f.optionen.length){ev.preventDefault();waehle(pos)}
  }else if(ev.key==='Enter'||ev.key===' '){
    if(sitzung.gewaehlt.size||sitzung.aufgedeckt){ev.preventDefault();weiter()}
  }else if(ev.key==='Escape'){stopTicker();sitzung=null;zeichne()}
});

setzeStil();
zeichne();
</script>
</body>
</html>
