,"Er ist entbehrlich, weil ein Businessplan nur bei der erstmaligen Gründung nötig ist","Er ist vorgeschrieben, weil bestehende Unternehmen ihn jährlich neu erstellen müssen","Er ist verzichtbar, weil ein Businessplan ausschließlich für Kapitalgeber gedacht ist"],"richtig":0,"erklaerung":"Auch **etablierte Unternehmen** profitieren von einem Businessplan, wenn sie neue Geschäftsbereiche erschließen oder ihre Geschäftstätigkeit erweitern wollen. Er ist damit weder auf Neugründungen noch auf externe Kapitalgeber beschränkt.","quelle":"f21","schwierigkeit":"schwer","wiederholung":true},{"id":"q055","thema":"Steuern","frage":"Wie werden Steuern definiert?","optionen":["Als Geldleistung an den Staat ohne Anspruch auf eine Gegenleistung","Als Geldleistung an den Staat mit Anspruch auf eine konkrete Gegenleistung","Als Beitrag an den Staat für die Nutzung bestimmter öffentlicher Einrichtungen","Als freiwillige Zahlung an den Staat zur Förderung öffentlicher Aufgaben"],"richtig":0,"erklaerung":"Steuern sind definiert als **Geldleistung an den Staat ohne Anspruch auf eine Gegenleistung**. Entscheidend ist damit, dass der Zahlung **keine konkrete Gegenleistung** gegenübersteht und sie auch nicht freiwillig erfolgt.","quelle":"f24","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Die Definition ist stark verkürzt: Steuern sind Geldleistungen ohne Gegenleistung für eine besondere Leistung, die ein öffentlich-rechtliches Gemeinwesen zur Einnahmeerzielung auferlegt.","quelle":"§ 3 AO","url":"https://www.gesetze-im-internet.de/ao_1977/__3.html"}},{"id":"q056","thema":"Steuern","frage":"Wie viele Ziffern haben Steuer-ID, Steuer-Nr. und Umsatzsteuer-ID jeweils?","optionen":["Steuer-ID 11, Steuer-Nr. 10, Umsatzsteuer-ID 9","Steuer-ID 10, Steuer-Nr. 11, Umsatzsteuer-ID 9","Steuer-ID 9, Steuer-Nr. 10, Umsatzsteuer-ID 11","Steuer-ID 11, Steuer-Nr. 9, Umsatzsteuer-ID 10"],"richtig":0,"erklaerung":"Die Ziffernzahlen lauten **Steuer-ID 11**, **Steuer-Nr. 10** und **Umsatzsteuer-ID 9**. Die längste Nummer ist damit die persönliche Steuer-ID, die kürzeste die Umsatzsteuer-ID.","quelle":"f24","schwierigkeit":"mittel","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Eine deutsche Steuernummer hat nicht allgemein zehn Stellen. Das Format unterscheidet sich je nach Bundesland; im bundeseinheitlichen ELSTER-Schema hat sie 13 Stellen. Steuer-ID mit 11 und USt-IdNr. mit „DE“ plus 9 Ziffern sind dagegen stabil.","quelle":"ELSTER: Aufbau der Steuernummer","url":"https://www.elster.de/elsterweb/infoseite/steuernummer"}},{"id":"q057","thema":"Steuern","frage":"Wofür wird die Steuer-Nr. verwendet?","optionen":["Für Rechnungen und die Steuererklärung; sie ist vom zuständigen Finanzamt abhängig","Für die persönliche Kennzeichnung; sie wird für Kindergeld und BAföG benötigt","Für die Kennzeichnung von Unternehmern im geschäftlichen Waren- und Leistungsverkehr","Für die Beantragung steuerlicher Vergünstigungen bei Banken und beim Arbeitsamt"],"richtig":0,"erklaerung":"Die Steuer-Nr. wird **für Rechnung und Steuererklärung** genutzt und ist **abhängig vom Finanzamt**. Die persönlichen Zwecke wie Kindergeld oder BAföG gehören dagegen zur Steuer-ID, die Kennzeichnung von Unternehmern zur Umsatzsteuer-ID.","quelle":"f22","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Auf einer normalen Rechnung ist nicht zwingend die Steuernummer erforderlich. Gesetzlich genügt alternativ die vom Bundeszentralamt erteilte Umsatzsteuer-Identifikationsnummer.","quelle":"§ 14 Abs. 4 Nr. 2 UStG","url":"https://www.gesetze-im-internet.de/ustg_1980/__14.html"}},{"id":"q058","thema":"Steuern","frage":"Wozu dient die Umsatzsteuer-ID?","optionen":["Zur Kennzeichnung von Unternehmern, die geschäftlich Waren oder Dienstleistungen erbringen oder beziehen","Zur Kennzeichnung von Privatpersonen, die Waren oder Dienstleistungen für den eigenen Bedarf beziehen","Zur Beantragung steuerlicher Vergünstigungen bei Banken, beim Arbeitsamt und beim Arbeitgeber","Zur Abgabe der jährlichen Steuererklärung beim jeweils zuständigen örtlichen Finanzamt"],"richtig":0,"erklaerung":"Die Umsatz-ID dient der **Kennzeichnung von Unternehmern**, die geschäftlich Waren oder Dienstleistungen **erbringen oder beziehen**. Sie ist damit eine reine Unternehmerkennzeichnung, keine persönliche Nummer.","quelle":"f22","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Die USt-IdNr. ist nicht einfach eine allgemeine Unternehmernummer für jeden Waren- oder Leistungsbezug. Ihre zentrale Funktion liegt in der umsatzsteuerlichen Identifikation, besonders im EU-Binnenmarkt.","quelle":"Bundeszentralamt für Steuern","url":"https://www.bzst.de/DE/Unternehmen/Identifikationsnummern/Umsatzsteuer-Identifikationsnummer/umsatzsteuer-identifikationsnummer_node.html"}},{"id":"q059","thema":"Steuern","frage":"Welche Steuernummer wird für den Kindergeld- und den BAföG-Antrag benötigt?","optionen":["Die Steuer-ID, die der persönlichen Kennzeichnung einer Person dient","Die Steuer-Nr., die für Rechnung und Steuererklärung genutzt wird","Die Umsatzsteuer-ID, die Unternehmer im Geschäftsverkehr kennzeichnet","Die Steuer-Nr., die vom jeweils zuständigen Finanzamt abhängig ist"],"richtig":0,"erklaerung":"Die **Steuer-ID** dient der persönlichen Kennzeichnung und wird unter anderem bei Banken, Arbeitsamt, Arbeitgeber, Aktien sowie für **Kindergeld und den BAföG-Antrag** verwendet. Die **Steuer-Nr.** ist davon abzugrenzen: Sie wird für Rechnung und Steuererklärung genutzt und hängt vom zuständigen Finanzamt ab.","quelle":"f22","schwierigkeit":"mittel","wiederholung":true},{"id":"q060","thema":"Steuern","frage":"Wie wird die Körperschaftsteuer beschrieben?","optionen":["Als Einkommensteuer auf die Gewinne von Unternehmen","Als Steuer auf den Verkauf von Waren und Dienstleistungen","Als Steuer auf das Vermögen von einzelnen Privatpersonen","Als Einkommensteuer auf Zinsen und Erträge aus Wertpapieren"],"richtig":0,"erklaerung":"Die Körperschaftsteuer ist eine **Einkommensteuer auf die Gewinne von Unternehmen**. Die Einkommensteuer im engeren Sinn betrifft dagegen das Einkommen von Einzelpersonen.","quelle":"f23","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Körperschaftsteuer ist nicht die Gewinnsteuer aller Unternehmen. Sie betrifft insbesondere Körperschaften wie GmbH und AG; Einzelunternehmer versteuern ihren Gewinn grundsätzlich über die Einkommensteuer.","quelle":"§ 1 KStG","url":"https://www.gesetze-im-internet.de/kstg_1977/__1.html"}},{"id":"q061","thema":"Steuern","frage":"Worauf wird die Kapitalertragsteuer erhoben?","optionen":["Auf Zinsen und Erträge aus Wertpapieren","Auf die erzielten Gewinne von Unternehmen","Auf das Vermögen von einzelnen Personen","Auf den Wert von Immobilien und Grundstücken"],"richtig":0,"erklaerung":"Die Kapitalertragsteuer ist eine Einkommensteuer auf **Zinsen und Erträge aus Wertpapieren**. Auf den Wert von Immobilien und Grundstücken wird dagegen die Grundsteuer erhoben.","quelle":"f23","schwierigkeit":"leicht"},{"id":"q062","thema":"Steuern","frage":"Wodurch unterscheidet sich die Grunderwerbsteuer von der Grundsteuer?","optionen":["Die Grunderwerbsteuer fällt beim Erwerb von Immobilien und Grundstücken an, die Grundsteuer auf deren Wert","Die Grunderwerbsteuer fällt auf den Wert von Immobilien und Grundstücken an, die Grundsteuer beim Erwerb","Die Grunderwerbsteuer fällt beim Erwerb von Wertpapieren an, die Grundsteuer beim Erwerb von Grundstücken","Die Grunderwerbsteuer fällt auf geerbte Immobilien an, die Grundsteuer auf den Verkauf von Grundstücken"],"richtig":0,"erklaerung":"Die Grunderwerbsteuer entsteht **beim Erwerb** von Immobilien und Grundstücken, die Grundsteuer bemisst sich dagegen **am Wert** von Immobilien und Grundstücken. Für Erbschaften ist die Erbschaftsteuer zuständig.","quelle":"f23","schwierigkeit":"mittel"},{"id":"q063","thema":"Steuern","frage":"Welche Steuern werden den Verbrauchssteuern zugeordnet?","optionen":["Strom-, Tabak-, Branntwein- und Mineralölsteuer","Umsatz-, Mehrwert-, Einkommen- und Gewerbesteuer","Grund-, Vermögen-, Erbschaft- und Gewerbesteuer","Einkommen-, Gewerbe-, Grund- und Umsatzsteuer"],"richtig":0,"erklaerung":"Zu den Verbrauchssteuern zählen **Strom-, Tabak-, Branntwein- und Mineralölsteuer**. Umsatz- und Mehrwertsteuer gehören zu den Verkehrsteuern, Einkommen- und Gewerbesteuer zu den Gewinnsteuern.","quelle":"f25","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Die Bezeichnungen der Folie sind veraltet: Die frühere Branntweinsteuer heißt seit 2018 Alkoholsteuer, die frühere Mineralölsteuer seit 2006 Energiesteuer.","quelle":"Alkoholsteuergesetz und Energiesteuergesetz","url":"https://www.gesetze-im-internet.de/alkstg/"}},{"id":"q064","thema":"Steuern","frage":"Zu welcher Steuergruppe zählt die Umsatzsteuer?","optionen":["Zu den Verkehrsteuern","Zu den Verbrauchssteuern","Zu den Gewinnsteuern","Zu den Substanzsteuern"],"richtig":0,"erklaerung":"Die Umsatzsteuer bzw. Mehrwertsteuer gehört zur Gruppe der **Verkehrsteuern**. Verbrauchssteuern sind zum Beispiel Strom- und Tabaksteuer.","quelle":"f25","schwierigkeit":"mittel","wiederholung":true},{"id":"q065","thema":"Steuern","frage":"Welche Steuer zählt zu den Substanzsteuern?","optionen":["Die Erbschaftsteuer","Die Gewerbesteuer","Die Tabaksteuer","Die Mehrwertsteuer"],"richtig":0,"erklaerung":"Zu den Substanzsteuern gehören Grundsteuer, Vermögensteuer und **Erbschaftsteuer**. Die Gewerbesteuer ist eine Gewinnsteuer, die Tabaksteuer eine Verbrauchssteuer.","quelle":"f25","schwierigkeit":"leicht","wiederholung":true},{"id":"q066","thema":"Steuern","frage":"Welche beiden Steuern werden der Gruppe der Gewinnsteuern zugeordnet?","optionen":["Einkommensteuer und Gewerbesteuer","Einkommensteuer und Erbschaftsteuer","Gewerbesteuer und Umsatzsteuer","Grundsteuer und Vermögensteuer"],"richtig":0,"erklaerung":"Als Gewinnsteuern werden **Einkommensteuer und Gewerbesteuer** genannt. Grund-, Vermögen- und Erbschaftsteuer bilden dagegen die Substanzsteuern.","quelle":"f25","schwierigkeit":"mittel","wiederholung":true},{"id":"q067","thema":"Steuern","frage":"Wie lauten die vier Steuer-Gruppen?","optionen":["Verkehrs-, Verbrauchs-, Gewinn- und Substanzsteuern","Verkehrs-, Verbrauchs-, Einkommens- und Vermögensteuern","Erwerbs-, Verbrauchs-, Gewinn- und Ertragsteuern","Verkehrs-, Vermögens-, Gewinn- und Erbschaftsteuern"],"richtig":0,"erklaerung":"Die vier Steuer-Gruppen sind **Verkehrs-, Verbrauchs-, Gewinn- und Substanzsteuern**. Einkommen-, Vermögen- oder Erbschaftsteuer sind dagegen einzelne Steuerarten innerhalb dieser Gruppen.","quelle":"f24","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q068","thema":"Steuern","frage":"Welche Aussage beschreibt die Umsatzsteuer zutreffend?","optionen":["Sie wird auf die von einem Unternehmen erbrachten Lieferungen und Dienstleistungen erhoben und vom Kunden gezahlt","Sie wird auf die von einem Unternehmen erbrachten Lieferungen und Dienstleistungen erhoben und vom Lieferanten gezahlt","Sie wird auf die erzielten Gewinne eines Unternehmens erhoben und mit der jährlichen Steuererklärung abgeführt","Sie wird auf das gesamte Betriebsvermögen eines Unternehmens erhoben und jedes Geschäftsjahr neu berechnet"],"richtig":0,"erklaerung":"Die Umsatzsteuer wird auf die **von einem Unternehmen erbrachten Lieferungen und Dienstleistungen** erhoben und **vom Kunden gezahlt**. Die Steuer auf gekaufte Leistungen anderer Unternehmen ist dagegen die Vorsteuer.","quelle":"f24","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Der Kunde trägt die Umsatzsteuer wirtschaftlich. Rechtlich schuldet und führt sie grundsätzlich der leistende Unternehmer ab; „vom Kunden gezahlt“ allein beschreibt diesen Unterschied nicht vollständig.","quelle":"§ 13a UStG","url":"https://www.gesetze-im-internet.de/ustg_1980/__13a.html"}},{"id":"q069","thema":"Steuern","frage":"Ein Designbüro kauft bei einem anderen Unternehmen eine Software und zahlt dabei Umsatzsteuer. Wie ist dieser Steuerbetrag aus Sicht des Designbüros einzuordnen?","optionen":["Als Vorsteuer, weil das Büro sie für einen Einkauf bei einem anderen Unternehmen gezahlt hat","Als Umsatzsteuer, weil das Büro sie auf eine selbst erbrachte Leistung erhoben hat","Als Vorsteuer, weil das Büro sie auf eine selbst erbrachte Leistung erhoben hat","Als Umsatzsteuer, weil das Büro sie von seinen eigenen Kunden erhalten hat"],"richtig":0,"erklaerung":"Die **Vorsteuer** ist die Umsatzsteuer, die auf **von anderen Unternehmen gekaufte Waren oder Dienstleistungen gezahlt** wurde. Umsatzsteuer im eigentlichen Sinn ist dagegen der Betrag, den das Büro auf seine **eigenen erbrachten Leistungen** erhebt und vom Kunden erhält.","quelle":"f24","schwierigkeit":"mittel","essential":true,"wiederholung":true},{"id":"q070","thema":"Steuern","frage":"Was ist die KSK?","optionen":["Eine Sozialversicherungseinrichtung, die Künstler gegen soziale Risiken absichert","Eine Behörde, die Künstlern die Steuernummer für ihre Rechnungen zuteilt","Ein Verband, der Künstler bei Preisverhandlungen mit Auftraggebern vertritt","Eine Einrichtung, die Künstlern Zuschüsse für Material und Atelier gewährt"],"richtig":0,"erklaerung":"Die KSK ist eine **Sozialversicherungseinrichtung für Künstler** zur **Absicherung ihrer sozialen Risiken**. Sie vergibt dagegen keine Steuernummern – die Steuer-Nr. für Rechnung und Steuererklärung hängt vom **Finanzamt** ab.","quelle":"f24","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Die Künstlersozialkasse ist kein eigener Versicherungsträger. Sie führt das Künstlersozialversicherungsgesetz durch und koordiniert Beiträge zu Kranken-, Pflege- und Rentenversicherung.","quelle":"Künstlersozialkasse","url":"https://www.kuenstlersozialkasse.de/ueber-uns/die-kuenstlersozialkasse"}},{"id":"q071","thema":"Steuern","frage":"Bis zu welchem Umsatz im vorigen Geschäftsjahr kann die Kleinunternehmerregelung genutzt werden?","optionen":["25.000 €","17.500 €","35.000 €","50.000 €"],"richtig":0,"erklaerung":"Die Kleinunternehmerregelung kann nutzen, wer im vorigen Geschäftsjahr **maximal 25.000 € Umsatz** erwirtschaftet hat. **Achtung:** Die Wiederholungsfolie nennt abweichend 22.000 € (22 TEUR) – dieser Widerspruch sollte in der Vorlesung geklärt werden.","quelle":"f26","schwierigkeit":"mittel","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Die Antwort 25.000 Euro entspricht der seit 1. Januar 2025 geltenden Rechtslage. Die Wiederholungsfolie nennt noch die alte Grenze von 22.000 Euro und ist an dieser Stelle veraltet.","quelle":"§ 19 UStG","url":"https://www.gesetze-im-internet.de/ustg_1980/__19.html"}},{"id":"q072","thema":"Steuern","frage":"Welchen Umsatz darf ein Kleinunternehmen im laufenden Geschäftsjahr voraussichtlich nicht überschreiten?","optionen":["100.000 €","50.000 €","75.000 €","125.000 €"],"richtig":0,"erklaerung":"Der Umsatz im laufenden Geschäftsjahr darf voraussichtlich **100.000 €** nicht überschreiten. Diese Grenze gilt zusätzlich zur Umsatzgrenze des Vorjahres.","quelle":"f26","schwierigkeit":"leicht","fachhinweis":{"hinweis":"Die 100.000-Euro-Grenze im laufenden Kalenderjahr ist seit 2025 eine tatsächliche Umsatzgrenze und keine bloße Prognosegrenze. „Voraussichtlich“ ist daher falsch.","quelle":"§ 19 UStG","url":"https://www.gesetze-im-internet.de/ustg_1980/__19.html"}},{"id":"q073","thema":"Steuern","frage":"Welche Aussage trifft auf Kleinunternehmen zu?","optionen":["Sie unterliegen keiner Umsatzsteuerpflicht auf ihre Leistungen","Sie müssen keine jährliche Steuererklärung beim Finanzamt abgeben","Sie zahlen einen ermäßigten Umsatzsteuersatz auf ihre Leistungen","Sie sind von der Einkommensteuer auf ihre erzielten Gewinne befreit"],"richtig":0,"erklaerung":"Kleinunternehmen haben **keine Umsatzsteuerpflicht**: Nach § 19 UStG enthält der ausgewiesene Betrag keine Umsatzsteuer. Entscheidend ist die Abgrenzung, dass es sich nicht um einen **ermäßigten Satz** handelt, sondern um den vollständigen Wegfall der Umsatzsteuer; andere Steuerarten sind von der Regelung nicht erfasst.","quelle":"f26","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Kleinunternehmer sind nicht generell von jeder Umsatzsteuerpflicht befreit. Bestimmte eigene Umsätze sind nach § 19 UStG steuerfrei und auf diesen Rechnungen wird keine Umsatzsteuer ausgewiesen.","quelle":"§ 19 UStG","url":"https://www.gesetze-im-internet.de/ustg_1980/__19.html"}},{"id":"q074","thema":"Steuern","frage":"Eine Selbstständige nutzt die Kleinunternehmerregelung und schreibt eine Rechnung. Welcher Hinweis gehört auf diese Rechnung?","optionen":["Im Sinne der Kleinunternehmerregelung nach § 19 UStG enthält der ausgewiesene Betrag keine Umsatzsteuer.","Im Sinne der Kleinunternehmerregelung nach § 13 UStG enthält der ausgewiesene Betrag keine Umsatzsteuer.","Im Sinne der Kleinunternehmerregelung nach § 19 EStG enthält der ausgewiesene Betrag keine Umsatzsteuer.","Im Sinne der Kleinunternehmerregelung nach § 19 UStG enthält der ausgewiesene Betrag die ermäßigte Umsatzsteuer."],"richtig":0,"erklaerung":"Der vorgegebene Rechnungshinweis lautet: Im Sinne der Kleinunternehmerregelung nach **§ 19 UStG** enthält der ausgewiesene Betrag **keine Umsatzsteuer**. Entscheidend sind sowohl der richtige Paragraf im Umsatzsteuergesetz als auch der vollständige Wegfall der Umsatzsteuer.","quelle":"f26","schwierigkeit":"schwer","wiederholung":true},{"id":"q075","thema":"Rechnungen und E-Rechnung","frage":"Ab welchem Jahr müssen in Deutschland alle Unternehmen elektronische Rechnungen empfangen können?","optionen":["Ab 2025","Ab 2026","Ab 2027","Ab 2028"],"richtig":0,"erklaerung":"Die Empfangspflicht für E-Rechnungen im Geschäftsverkehr gilt **ab 2025**. Die späteren Jahreszahlen betreffen ausschließlich die Übergangsfristen für den **Versand**.","quelle":"f27","schwierigkeit":"leicht","fachhinweis":{"hinweis":"Die Empfangspflicht betrifft inländische Unternehmer im Rahmen der E-Rechnungsregeln für inländische B2B-Umsätze. „Alle Unternehmen“ ist ohne diesen Kontext zu weit formuliert.","quelle":"BMF: FAQ zur E-Rechnung","url":"https://www.bundesfinanzministerium.de/Content/DE/FAQ/e-rechnung.html"}},{"id":"q076","thema":"Rechnungen und E-Rechnung","frage":"Welche Verpflichtung trifft Unternehmen im Geschäftsverkehr seit 2025 im Zusammenhang mit der E-Rechnung?","optionen":["Sie müssen elektronische Rechnungen anderer Unternehmen empfangen können.","Sie müssen alle eigenen Ausgangsrechnungen elektronisch versenden.","Sie müssen alle Rechnungen elektronisch beim Finanzamt einreichen.","Sie müssen sämtliche Rechnungen an Privatkunden elektronisch ausstellen."],"richtig":0,"erklaerung":"Ab 2025 müssen alle Unternehmen lediglich in der Lage sein, E-Rechnungen im Geschäftsverkehr zu **empfangen**. Die Pflicht zur **Ausstellung und Versendung** gilt ausnahmslos erst ab dem **1.1.2028**, denn Papier- und PDF-Rechnungen bleiben übergangsweise bis Ende 2026 zulässig.","quelle":"f27","schwierigkeit":"mittel","fachhinweis":{"hinweis":"Die Aussage „ab 2028 ohne Ausnahmen“ ist falsch. Dauerhafte Ausnahmen bestehen unter anderem für Kleinbetragsrechnungen, Fahrausweise, Leistungen von Kleinunternehmern und bestimmte steuerfreie Umsätze.","quelle":"BMF: FAQ zur E-Rechnung","url":"https://www.bundesfinanzministerium.de/Content/DE/FAQ/e-rechnung.html"}},{"id":"q077","thema":"Rechnungen und E-Rechnung","frage":"Bis wann dürfen Unternehmen allgemein noch Papierrechnungen oder andere Formate wie PDF versenden?","optionen":["Bis Ende 2026","Bis Ende 2025","Bis Ende 2027","Bis Ende 2028"],"richtig":0,"erklaerung":"Die allgemeine Übergangsfrist für den Versand von Papierrechnungen oder anderen Formaten läuft **bis Ende 2026**. Nur für kleine Unternehmen verlängert sie sich darüber hinaus.","quelle":"f27","schwierigkeit":"leicht","fachhinweis":{"hinweis":"PDF-Rechnungen dürfen in der Übergangszeit grundsätzlich nur mit Zustimmung des Empfängers verwendet werden. Diese Voraussetzung fehlt in der Frage.","quelle":"BMF: FAQ zur E-Rechnung","url":"https://www.bundesfinanzministerium.de/Content/DE/FAQ/e-rechnung.html"}},{"id":"q078","thema":"Rechnungen und E-Rechnung","frage":"Bis zu welchem Umsatz können kleine Unternehmen die verlängerte Übergangsfrist für den Versand von Papier- und PDF-Rechnungen nutzen?","optionen":["Unter 800.000 Euro","Unter 500.000 Euro","Unter 100.000 Euro","Unter 22.000 Euro"],"richtig":0,"erklaerung":"Die verlängerte Übergangsfrist bis Ende 2027 gilt für kleine Unternehmen mit geringem Umsatz **unter 800.000 Euro**. Andere Umsatzgrenzen spielen für diese Frist keine Rolle.","quelle":"f27","schwierigkeit":"leicht","fachhinweis":{"hinweis":"Maßgeblich ist der Gesamtumsatz des vorangegangenen Kalenderjahres bis einschließlich 800.000 Euro. „Unter 800.000 Euro“ und ein nicht näher bestimmter Jahresumsatz sind ungenau; für sonstige Formate ist zudem die Zustimmung des Empfängers relevant.","quelle":"BMF: FAQ zur E-Rechnung","url":"https://www.bundesfinanzministerium.de/Content/DE/FAQ/e-rechnung.html"}},{"id":"q079","thema":"Rechnungen und E-Rechnung","frage":"Ab wann gilt die E-Rechnungspflicht für die Ausstellung und Versendung ohne Ausnahmen?","optionen":["Ab dem 1.1.2028","Ab dem 1.1.2026","Ab dem 1.1.2027","Ab dem 1.7.2028"],"richtig":0,"erklaerung":"Ohne Ausnahmen gilt die Pflicht zur Ausstellung und Versendung von E-Rechnungen **ab dem 1.1.2028**. Bis dahin greifen die gestaffelten Übergangsfristen.","quelle":"f27","schwierigkeit":"leicht","fachhinweis":{"hinweis":"Die Aussage „ab 2028 ohne Ausnahmen“ ist falsch. Dauerhafte Ausnahmen bestehen unter anderem für Kleinbetragsrechnungen, Fahrausweise, Leistungen von Kleinunternehmern und bestimmte steuerfreie Umsätze.","quelle":"BMF: FAQ zur E-Rechnung","url":"https://www.bundesfinanzministerium.de/Content/DE/FAQ/e-rechnung.html"}},{"id":"q080","thema":"Rechnungen und E-Rechnung","frage":"Ein Designstudio mit 400.000 Euro Jahresumsatz möchte im Jahr 2027 eine Rechnung als PDF per E-Mail versenden. Wie ist das zu bewerten?","optionen":["Zulässig, da die Übergangsfrist für Unternehmen unter 800.000 Euro Umsatz bis Ende 2027 läuft","Zulässig, da die Übergangsfrist für sämtliche Unternehmen bis Ende 2027 verlängert worden ist","Unzulässig, da der Versand anderer Formate für alle Unternehmen bereits Ende 2026 geendet hat","Unzulässig, da der Versand anderer Formate schon mit dem Jahr 2025 untersagt worden ist"],"richtig":0,"erklaerung":"Für kleine Unternehmen mit einem Umsatz **unter 800.000 Euro** verlängert sich die Übergangsfrist **bis Ende 2027**. Für alle übrigen Unternehmen endet der Versand von Papier- und PDF-Rechnungen bereits Ende 2026.","quelle":"f27","schwierigkeit":"schwer","fachhinweis":{"hinweis":"Maßgeblich ist der Gesamtumsatz des vorangegangenen Kalenderjahres bis einschließlich 800.000 Euro. „Unter 800.000 Euro“ und ein nicht näher bestimmter Jahresumsatz sind ungenau; für sonstige Formate ist zudem die Zustimmung des Empfängers relevant.","quelle":"BMF: FAQ zur E-Rechnung","url":"https://www.bundesfinanzministerium.de/Content/DE/FAQ/e-rechnung.html"}},{"id":"q081","thema":"Rechnungen und E-Rechnung","frage":"Was ist mit dem Leistungsdatum auf einer Rechnung gemeint?","optionen":["Der Zeitpunkt der Lieferung oder der Zeitraum der Erstellung","Der Zeitpunkt der Rechnungserstellung oder der Verbuchung","Der Zeitpunkt des Zahlungseingangs oder der Zahlungsfrist","Der Zeitpunkt der Auftragserteilung oder der Angebotsabgabe"],"richtig":0,"erklaerung":"Das Leistungsdatum bezeichnet den **Zeitpunkt der Lieferung** oder den **Zeitraum der Erstellung**. Es ist damit klar zu unterscheiden vom Datum der Rechnungserstellung und vom Zeitpunkt der Zahlung.","quelle":"f28","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Das Leistungsdatum bezeichnet den Zeitpunkt der Lieferung oder sonstigen Leistung. Bei einer Designleistung kann stattdessen ein Leistungszeitraum angegeben werden; „Zeitraum der Erstellung“ ist kein allgemeiner Gesetzesbegriff.","quelle":"§ 14 Abs. 4 Nr. 6 UStG","url":"https://www.gesetze-im-internet.de/ustg_1980/__14.html"}},{"id":"q082","thema":"Rechnungen und E-Rechnung","frage":"Was gibt der Mehrwertsteuervermerk auf einer Rechnung an?","optionen":["Den auf die Leistung anzuwendenden Steuersatz","Die Steuernummer des zuständigen Finanzamts","Den Betrag der bereits gezahlten Vorsteuer","Die Höhe des steuerpflichtigen Vorjahresumsatzes"],"richtig":0,"erklaerung":"Der Mehrwertsteuervermerk nennt den **anzuwendenden Steuersatz**. Nur wenn eine Steuerbefreiung vorliegt, tritt an dessen Stelle ein entsprechender Hinweis.","quelle":"f28","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Die Rechnungsangaben sind stärker differenziert: Erforderlich sind unter anderem das nach Steuersätzen aufgeschlüsselte Entgelt sowie Steuersatz und Steuerbetrag oder ein Befreiungshinweis. „Nettosumme“ beziehungsweise „Mehrwertsteuervermerk“ ist nur eine Kurzform.","quelle":"§ 14 Abs. 4 Nr. 7 und 8 UStG","url":"https://www.gesetze-im-internet.de/ustg_1980/__14.html"}},{"id":"q083","thema":"Rechnungen und E-Rechnung","frage":"Welche Angabe tritt im Mehrwertsteuervermerk einer Rechnung an die Stelle des Steuersatzes, wenn die Lieferung steuerbefreit ist?","optionen":["Ein Hinweis darauf, dass für die Lieferung eine Steuerbefreiung gilt","Eine Bestätigung der Steuerbefreiung durch das zuständige Finanzamt","Ein Vermerk über die im Vorjahr abgeführte Umsatzsteuer","Eine Aufstellung der abziehbaren Vorsteuerbeträge des Auftrags"],"richtig":0,"erklaerung":"Der **Mehrwertsteuervermerk** nennt normalerweise den anzuwendenden Steuersatz; bei einer Steuerbefreiung tritt an dessen Stelle ein **Hinweis darauf, dass für die Lieferung eine Steuerbefreiung gilt**. Eine behördliche Bestätigung oder Angaben zu Vorsteuer und Vorjahresumsatzsteuer gehören nicht zu den Pflichtangaben.","quelle":"f28","schwierigkeit":"leicht","wiederholung":true},{"id":"q084","thema":"Rechnungen und E-Rechnung","frage":"Welche Betragsangabe gehört zu den erforderlichen Bestandteilen einer Rechnung?","optionen":["Die Nettosumme der abgerechneten Leistung","Der Gesamtumsatz des laufenden Geschäftsjahres","Der im Angebot kalkulierte Stundensatz","Die Summe der offenen Forderungen der Kundschaft"],"richtig":0,"erklaerung":"Zu den Pflichtangaben zählt die **Nettosumme**. Interne Kalkulations- oder Umsatzgrößen gehören nicht auf die Rechnung.","quelle":"f28","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Die Rechnungsangaben sind stärker differenziert: Erforderlich sind unter anderem das nach Steuersätzen aufgeschlüsselte Entgelt sowie Steuersatz und Steuerbetrag oder ein Befreiungshinweis. „Nettosumme“ beziehungsweise „Mehrwertsteuervermerk“ ist nur eine Kurzform.","quelle":"§ 14 Abs. 4 Nr. 7 und 8 UStG","url":"https://www.gesetze-im-internet.de/ustg_1980/__14.html"}},{"id":"q085","thema":"Rechnungen und E-Rechnung","frage":"Wie wird eine Rechnung definiert?","optionen":["Ein Dokument zur Abrechnung einer erbrachten Leistung oder Lieferung","Ein Dokument zur verbindlichen Zusage eines Preises vor Auftragsbeginn","Ein Dokument zur Zahlungsaufforderung nach Ablauf der Zahlungsfrist","Ein Dokument zur Bestätigung eines bereits eingegangenen Zahlbetrags"],"richtig":0,"erklaerung":"Eine Rechnung ist ein **Dokument zur Abrechnung einer Leistung oder Lieferung** und benötigt **keine Unterschrift**. Die Zahlungsaufforderung nach Ablauf der Frist ist dagegen eine **Mahnung**.","quelle":"f29","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q086","thema":"Rechnungen und E-Rechnung","frage":"Welche Aussage trifft auf die Unterschrift bei Rechnungen zu?","optionen":["Eine Rechnung benötigt keine Unterschrift, um gültig zu sein.","Eine Rechnung muss vom Rechnungssteller unterschrieben werden.","Eine Rechnung muss von beiden Seiten unterschrieben werden.","Eine Rechnung wird erst mit der Unterschrift der Kundschaft wirksam."],"richtig":0,"erklaerung":"Für eine Rechnung ist **keine Unterschrift** erforderlich. Sie ist ein Abrechnungsdokument und kein zu unterzeichnender Vertrag.","quelle":"f29","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q087","thema":"Rechnungen und E-Rechnung","frage":"Welche Angabe gehört zu den erforderlichen Bestandteilen einer Rechnung?","optionen":["Die Steuernummer des Rechnungsstellers","Die Bankverbindung der Kundschaft","Der Umsatz des vergangenen Geschäftsjahres","Eine Kopie des zugrunde liegenden Angebots"],"richtig":0,"erklaerung":"Zu den Rechnungsbestandteilen zählen unter anderem Kontaktdaten, Rechnungsnummer, **Steuernummer**, Leistungszeitraum, Frist, Datum und die Leistung selbst.","quelle":"f29","schwierigkeit":"mittel","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Auf einer normalen Rechnung ist nicht zwingend die Steuernummer erforderlich. Gesetzlich genügt alternativ die vom Bundeszentralamt erteilte Umsatzsteuer-Identifikationsnummer.","quelle":"§ 14 Abs. 4 Nr. 2 UStG","url":"https://www.gesetze-im-internet.de/ustg_1980/__14.html"}},{"id":"q088","thema":"Rechnungen und E-Rechnung","frage":"Was beschreibt das Begriffspaar netto und brutto?","optionen":["Den Betrag vor und nach Abzügen oder Steuern","Den Betrag vor und nach Ablauf der Zahlungsfrist","Den Betrag mit und ohne Berücksichtigung von Mahngebühren","Den Betrag vor und nach Eingang der Zahlung"],"richtig":0,"erklaerung":"netto und brutto bezeichnen den Betrag **vor und nach Abzügen oder Steuern**. Zahlungsfristen, Mahngebühren oder der Zahlungseingang betreffen den Ablauf der Bezahlung und haben mit dieser Unterscheidung nichts zu tun.","quelle":"f29","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Im Rechnungskontext bedeutet netto ohne Umsatzsteuer und brutto einschließlich Umsatzsteuer. „Vor und nach Abzügen oder Steuern“ vermischt Preis- und Lohnbegriffe und ist richtungsunklar.","quelle":"Fachliche Begriffsklärung"}},{"id":"q089","thema":"Angebot, Vertrag und Briefing","frage":"Wodurch kommt ein Vertrag zustande?","optionen":["Durch zwei Willenserklärungen: Angebot und Annahme","Durch eine Willenserklärung des Auftraggebers","Durch die Unterschrift beider Seiten unter ein Schriftstück","Durch die Zahlung eines Akontos an den Auftragnehmer"],"richtig":0,"erklaerung":"Ein Vertrag entsteht nach dem BGB durch **zwei Willenserklärungen: Angebot + Annahme**. Weder Unterschrift noch Zahlung sind für das Zustandekommen erforderlich.","quelle":"f37","schwierigkeit":"leicht","wiederholung":true},{"id":"q090","thema":"Angebot, Vertrag und Briefing","frage":"Welcher Grundsatz gilt für die Form eines Vertrags?","optionen":["Formfreiheit – eine bestimmte Form ist nicht erforderlich","Schriftform – ein unterschriebenes Dokument ist erforderlich","Notarielle Beurkundung – ein Termin beim Notar ist erforderlich","Textform – eine Bestätigung per E-Mail ist erforderlich"],"richtig":0,"erklaerung":"Für die Form gilt der **Grundsatz: formfrei** – der Vertrag kommt bereits durch **zwei Willenserklärungen** (Angebot + Annahme) zustande. Schriftform wird für die Leistungsbeschreibung zwar empfohlen, ist aber keine Voraussetzung für den Vertragsschluss.","quelle":"f37","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Formfreiheit ist nur der Grundsatz. Für bestimmte Verträge gelten gesetzliche Formvorschriften; außerdem können Parteien selbst eine Form vereinbaren.","quelle":"§§ 125, 311b BGB","url":"https://www.gesetze-im-internet.de/bgb/__125.html"}},{"id":"q091","thema":"Angebot, Vertrag und Briefing","frage":"Was bezeichnet der Begriff Essentialia Negotii?","optionen":["Den notwendigen Mindestinhalt der Einigung","Die freiwilligen Zusatzabreden neben der Einigung","Die allgemeinen Geschäftsbedingungen eines Angebots","Die Auslegungsregeln bei unklaren Willenserklärungen"],"richtig":0,"erklaerung":"Essentialia Negotii sind der **notwendige Mindestinhalt** der Einigung, also das, worüber sich die Parteien zwingend verständigen müssen.","quelle":"f37","schwierigkeit":"leicht","wiederholung":true},{"id":"q092","thema":"Angebot, Vertrag und Briefing","frage":"Liegt zwischen den Parteien eine Einigung vor, spricht man von …","optionen":["Konsens","Dissens","Auslegung","Essentialia Negotii"],"richtig":0,"erklaerung":"Einigung (+) bedeutet **Konsens**; bei Unklarheiten kann zusätzlich eine Auslegung nötig sein. Dissens bezeichnet dagegen die fehlende Einigung.","quelle":"f37","schwierigkeit":"leicht","wiederholung":true},{"id":"q093","thema":"Angebot, Vertrag und Briefing","frage":"Welche Folge hat ein Dissens beim Vertragsschluss?","optionen":["Der Vertrag kommt in diesem Fall nicht zustande","Der Vertrag kommt mit dem Inhalt des Angebots zustande","Der Vertrag kommt zustande, ist aber formunwirksam","Der Vertrag kommt zustande und wird ausgelegt"],"richtig":0,"erklaerung":"Fehlt die **Einigung**, liegt **Dissens** vor und damit **kein Vertrag**. Die **Auslegung** greift nur bei bestehendem Konsens mit unklarem Inhalt.","quelle":"f37","schwierigkeit":"mittel","wiederholung":true,"fachhinweis":{"hinweis":"„Dissens = kein Vertrag“ ist zu pauschal. Beim offenen Dissens kommt der Vertrag im Zweifel nicht zustande; beim versteckten Dissens kann der übrige Vertrag bestehen bleiben.","quelle":"§§ 154, 155 BGB","url":"https://www.gesetze-im-internet.de/bgb/__154.html"}},{"id":"q094","thema":"Angebot, Vertrag und Briefing","frage":"Was besagt der Grundsatz „Pacta sunt servanda“?","optionen":["Verträge sind einzuhalten und schaffen damit Verlässlichkeit","Verträge dürfen inhaltlich frei gestaltet werden","Verträge müssen schriftlich geschlossen werden","Verträge können jederzeit einseitig geändert werden"],"richtig":0,"erklaerung":"„Pacta sunt servanda“ heißt **Verträge sind einzuhalten** und begründet die Verlässlichkeit. Die freie inhaltliche Gestaltung ist dagegen die Vertragsfreiheit.","quelle":"f36","schwierigkeit":"leicht"},{"id":"q095","thema":"Angebot, Vertrag und Briefing","frage":"Mit welcher Leitfrage lässt sich der Inhalt eines Vertrags bestimmen?","optionen":["Wer will was von wem?","Wer zahlt wann an wen?","Wer haftet wofür gegenüber wem?","Wer entscheidet was mit wem?"],"richtig":0,"erklaerung":"Der Vertragsinhalt wird über die Frage **„Wer will was von wem?“** bestimmt – sie klärt Parteien und geschuldete Leistung.","quelle":"f37, f38","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q096","thema":"Angebot, Vertrag und Briefing","frage":"Welcher Anteil ist im Angebot als Akonto vorgesehen?","optionen":["30 %","10 %","20 %","50 %"],"richtig":0,"erklaerung":"Zu den Zahlungsbedingungen eines Angebots gehört ein Akonto von **30 %**.","quelle":"f39","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Ein Akonto von 30 Prozent ist ein Beispiel beziehungsweise eine Empfehlung der Vorlesung, aber keine allgemeine rechtliche oder branchenweit verbindliche Vorgabe für Angebote.","quelle":"Einordnung der Folienaussage"}},{"id":"q097","thema":"Angebot, Vertrag und Briefing","frage":"Worauf bezieht sich die geforderte Detailgenauigkeit bei der Beschreibung der Leistung?","optionen":["Auf Umfang, Rahmenbedingungen, Annahmen und Zeit","Auf Rabatt, Skonto, Pauschale und Retainer","Auf Angebot, Annahme, Konsens und Dissens","Auf Zielgruppe, Wettbewerb, Budget und Medien"],"richtig":0,"erklaerung":"Die Detailgenauigkeit der Leistungsbeschreibung umfasst **Umfang, Rahmenbedingungen, Annahmen und Zeit**. Rabatt, Skonto, Pauschale und Retainer gehören dagegen zur Auftragsbestätigung.","quelle":"f36","schwierigkeit":"mittel","wiederholung":true},{"id":"q098","thema":"Angebot, Vertrag und Briefing","frage":"Die Leistungsbeschreibung ist Teil des Angebots. Welche Konsequenz ist damit verbunden?","optionen":["Sie birgt das Potenzial für Missverständnisse in sich","Sie ersetzt die Annahmeerklärung des Kunden vollständig","Sie macht eine Einigung über den Inhalt entbehrlich","Sie begründet einen Anspruch auf eine Akontozahlung"],"richtig":0,"erklaerung":"Weil die Leistungsbeschreibung Teil des Angebots ist, birgt sie ein **Potenzial für Missverständnisse** – deshalb die Anforderungen **Schriftform** und **Detailgenauigkeit** (Umfang, Rahmenbedingungen, Annahmen, Zeit). Die **Einigung** über den Inhalt wird dadurch nicht entbehrlich, denn ohne sie liegt Dissens und damit kein Vertrag vor.","quelle":"f36","schwierigkeit":"mittel","wiederholung":true},{"id":"q099","thema":"Angebot, Vertrag und Briefing","frage":"Wie ist ein Rebriefing zu verstehen?","optionen":["Als Zusammenfassung, Interpretation und Ergänzung der Kundenwünsche","Als wortgetreue Wiederholung des Briefings gegenüber dem Kunden","Als schriftliche Auftragsbestätigung mit den Zahlungsbedingungen","Als erstes Angebot mit einer detaillierten Leistungsübersicht"],"richtig":0,"erklaerung":"Ein Rebriefing ist **keine Wiederholung** des Briefings, sondern eine **Zusammenfassung, Interpretation und Ergänzung** dessen, was der Kunde wünscht.","quelle":"f42","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q100","thema":"Angebot, Vertrag und Briefing","frage":"Welche Chance bietet das Rebriefing?","optionen":["Missverständnisse auszuräumen und Lücken zu ergänzen","Die Vorgaben aus dem Briefing wortgleich zu wiederholen","Die Zahlungsbedingungen des Angebots festzulegen","Den Vertrag allein durch eine Willenserklärung zu schließen"],"richtig":0,"erklaerung":"Das Rebriefing ist eine Chance, **Missverständnisse auszuräumen**, **Lücken zu erweitern und zu ergänzen**, Verständnis zu zeigen und sich zu profilieren. Entscheidend ist die Abgrenzung: Es ist **keine Wiederholung** des Briefings, sondern Zusammenfassung, Interpretation und Ergänzung dessen, was der Kunde wünscht.","quelle":"f42","schwierigkeit":"mittel","wiederholung":true},{"id":"q101","thema":"Angebot, Vertrag und Briefing","frage":"Wofür steht der Merksatz „There is no free Lunch“?","optionen":["Dass jeder Leistung eine Gegenleistung gegenübersteht","Dass jedes Angebot kostenlos erstellt werden muss","Dass jede Zusatzleistung pauschal abgerechnet wird","Dass jede Erstberatung unentgeltlich angeboten wird"],"richtig":0,"erklaerung":"Der Merksatz steht für das Prinzip **Leistung – Gegenleistung**: Keine Leistung wird ohne Gegenwert erbracht.","quelle":"f38","schwierigkeit":"leicht","essential":true,"wiederholung":true,"fachhinweis":{"hinweis":"Leistung und Gegenleistung kennzeichnen entgeltliche Verträge. Nicht jeder Vertrag enthält zwingend eine Gegenleistung, etwa eine Schenkung.","quelle":"§ 516 BGB","url":"https://www.gesetze-im-internet.de/bgb/__516.html"}},{"id":"q102","thema":"Angebot, Vertrag und Briefing","frage":"Nach dem Briefing fasst ein Studio die Wünsche des Kunden zusammen, benennt offene Lücken und schlägt eigene Ergänzungen vor. Wie wird dieser Schritt bezeichnet?","optionen":["Rebriefing","Briefing","Angebot","Auftragsbestätigung"],"richtig":0,"erklaerung":"Ein **Rebriefing** ist keine Wiederholung des Briefings, sondern die Zusammenfassung, Interpretation und Ergänzung der Kundenwünsche und damit die Chance, Lücken zu schließen und Missverständnisse auszuräumen. Das Briefing selbst stammt vom Kunden, Angebot und Auftragsbestätigung regeln dagegen Leistung und Vergütung.","quelle":"f42","schwierigkeit":"mittel","wiederholung":true},{"id":"q103","thema":"Kalkulation und Liquidität","frage":"Was sagt die Liquidität über ein Unternehmen aus?","optionen":["Ob es in der Lage ist, seinen Zahlungsverpflichtungen nachzukommen","Ob es am Ende des Geschäftsjahres einen Gewinn erwirtschaftet hat","Ob es seine Angebote mit Stundensätzen oder mit Tagessätzen kalkuliert","Ob es seine Fremdkosten unterhalb der eigenen Honorare halten kann"],"richtig":0,"erklaerung":"Die Liquidität eines Unternehmens bestimmt, ob es seinen **Zahlungsverpflichtungen** nachkommen kann. Sie sagt nichts über Gewinn oder die Art der Kalkulation aus.","quelle":"f40","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q104","thema":"Kalkulation und Liquidität","frage":"Welche Aussage beschreibt ein illiquides Unternehmen zutreffend?","optionen":["Es kann seinen Zahlungsverpflichtungen nicht mehr nachkommen, und es droht eine Insolvenz.","Es kann seine Zahlungsverpflichtungen erfüllen, erzielt dabei aber keinen ausreichenden Gewinn.","Es kann seine Zahlungen leisten, hat aber die eigenen Honorare deutlich zu niedrig kalkuliert.","Es kann seine Rechnungen begleichen, weist im Angebot aber keine Fremdkosten gesondert aus."],"richtig":0,"erklaerung":"Ein Unternehmen, das seinen Zahlungsverpflichtungen nicht mehr nachkommen kann, ist **zahlungsunfähig = illiquide**, und es **droht eine Insolvenz**. Fehlender Gewinn oder eine schlechte Kalkulation bedeuten für sich genommen noch keine Illiquidität.","quelle":"f40","schwierigkeit":"leicht","wiederholung":true,"fachhinweis":{"hinweis":"Zahlungsunfähigkeit ist ein gesetzlicher Insolvenzgrund. Ob nur eine Insolvenz „droht“ oder bereits ein Insolvenzantrag erforderlich ist, hängt insbesondere von Rechtsform und Umständen ab.","quelle":"§§ 17, 15a InsO","url":"https://www.gesetze-im-internet.de/inso/__17.html"}},{"id":"q105","thema":"Kalkulation und Liquidität","frage":"Woran zeigt sich, dass ein Unternehmen liquide ist?","optionen":["Es kann fällige Zahlungen wie offene Rechnungen begleichen.","Es kann im Angebot Honorare und Fremdkosten separat ausweisen.","Es kann jeden erteilten Auftrag mit einem festen Tagessatz abrechnen.","Es kann seine Arbeitsprozesse ohne eine Kalkulation optimieren."],"richtig":0,"erklaerung":"Ein **liquides** Unternehmen ist dadurch gekennzeichnet, dass die **fälligen Zahlungen**, zum Beispiel offene Rechnungen, beglichen werden können. Die anderen Punkte betreffen die Kalkulation und das Angebot, nicht die Zahlungsfähigkeit.","quelle":"f40","schwierigkeit":"mittel","wiederholung":true},{"id":"q106","thema":"Kalkulation und Liquidität","frage":"Worin besteht der Hauptunterschied zwischen Honoraren und Fremdkosten?","optionen":["Honorare betreffen die eigene Dienstleistung, Fremdkosten den Kauf von Waren oder Dienstleistungen Dritter.","Honorare betreffen den Kauf von Waren oder Dienstleistungen Dritter, Fremdkosten die eigene Dienstleistung.","Honorare betreffen die laufenden Kosten des Büros, Fremdkosten die einmaligen Kosten eines Projekts.","Honorare betreffen Leistungen für Bestandskunden, Fremdkosten Leistungen für neu gewonnene Auftraggeber."],"richtig":0,"erklaerung":"Honorare betreffen die **eigene Dienstleistung**, während Fremdkosten für den **Kauf von Waren oder Dienstleistungen Dritter** anfallen. Beide Positionen sind im Angebot **separat auszuweisen**.","quelle":"f41","schwierigkeit":"leicht"},{"id":"q107","thema":"Kalkulation und Liquidität","frage":"Wie sind Honorare in der Regel ausgestaltet?","optionen":["Sie sind variabel und hängen von Art und Dauer der erbrachten Dienstleistung ab.","Sie sind fest und hängen von der Menge der bei Dritten eingekauften Waren ab.","Sie sind variabel und hängen von der Anzahl der am Projekt beteiligten Auftraggeber ab.","Sie sind fest und hängen von der Höhe der im Angebot ausgewiesenen Fremdkosten ab."],"richtig":0,"erklaerung":"Honorare betreffen die **eigene Dienstleistung** und sind normalerweise **variabel**, also abhängig von **Art und Dauer** der erbrachten Dienstleistungen. **Fremdkosten** entstehen dagegen beim Kauf von Waren oder Dienstleistungen **Dritter** und fallen unabhängig von der gekauften Menge an.","quelle":"f41","schwierigkeit":"leicht","fachhinweis":{"hinweis":"Honorare können auch pauschal oder fest vereinbart werden. Fremdkosten können klar mengenabhängig sein, etwa bei Druckauflage oder Material; variable Kosten sind definitionsgemäß nicht mengenunabhängig.","quelle":"Fachliche Kostenrechnung"}},{"id":"q108","thema":"Kalkulation und Liquidität","frage":"Welche Aussage über Fremdkosten trifft zu?","optionen":["Sie sind feste oder variable Kosten und fallen unabhängig von der eingekauften Menge an.","Sie sind variable Kosten und hängen von der Dauer der eigenen erbrachten Dienstleistung ab.","Sie sind feste Kosten und sinken mit der Menge der bei Dritten eingekauften Leistungen.","Sie sind variable Kosten und richten sich nach dem vereinbarten Stundensatz des Designbüros."],"richtig":0,"erklaerung":"Fremdkosten fallen für den Kauf von Waren oder Dienstleistungen **Dritter** an; sie sind **feste (oder variable) Kosten**, die **unabhängig von der Menge** der gekauften Waren oder Dienstleistungen anfallen. Eine Abhängigkeit von **Art und Dauer** der eigenen erbrachten Dienstleistung kennzeichnet dagegen das **Honorar**.","quelle":"f41","schwierigkeit":"mittel","fachhinweis":{"hinweis":"Honorare können auch pauschal oder fest vereinbart werden. Fremdkosten können klar mengenabhängig sein, etwa bei Druckauflage oder Material; variable Kosten sind definitionsgemäß nicht mengenunabhängig.","quelle":"Fachliche Kostenrechnung"}},{"id":"q109","thema":"Kalkulation und Liquidität","frage":"Wie sollten Honorare und Fremdkosten in einem Angebot für Designleistungen dargestellt werden?","optionen":["Als zwei getrennt voneinander ausgewiesene Positionen","Als eine gemeinsame Summe ohne weitere Aufschlüsselung","Als Positionen, die erst nach Projektabschluss genannt werden","Als Anlage, die nur auf ausdrückliche Nachfrage erstellt wird"],"richtig":0,"erklaerung":"Für Designleistungen und Angebote sollten Honorare und Fremdkosten **separat ausgewiesen** werden. Eine zusammengefasste Gesamtsumme widerspricht dieser Vorgabe.","quelle":"f41","schwierigkeit":"leicht","fachhinweis":{"hinweis":"Die getrennte Ausweisung von Honorar und Fremdkosten ist sinnvolle Kalkulations- und Angebotspraxis, aber keine allgemeine gesetzliche Pflicht.","quelle":"Einordnung der Folienaussage"}},{"id":"q110","thema":"Kalkulation und Liquidität","frage":"Ein Designbüro kauft für ein Projekt Bildlizenzen bei einer Fotoagentur ein und stellt zusätzlich die eigene Gestaltungsarbeit in Rechnung. Wie sind die beiden Positionen im Angebot einzuordnen?","optionen":["Die Bildlizenzen zählen zu den Fremdkosten, die Gestaltungsarbeit zählt zum Honorar.","Die Bildlizenzen zählen zum Honorar, die Gestaltungsarbeit zählt zu den Fremdkosten.","Beide Positionen zählen zu den Fremdkosten und werden gemeinsam als ein Posten ausgewiesen.","Beide Positionen zählen zum Honorar und werden gemeinsam als ein Posten ausgewiesen."],"richtig":0,"erklaerung":"Fremdkosten entstehen beim Kauf von Waren oder Dienstleistungen **Dritter** – hier die Lizenzen der Fotoagentur –, während das Honorar die **eigene Dienstleistung** abdeckt, also die Gestaltungsarbeit. Beide Positionen müssen im Angebot **separat** ausgewiesen werden.","quelle":"f41","schwierigkeit":"mittel"},{"id":"q111","thema":"Kalkulation und Liquidität","frage":"Welchen Nutzen hat eine Kalkulation im Umgang mit der Kundschaft?","optionen":["Sie informiert transparent und hilft dabei, den geforderten Preis zu rechtfertigen.","Sie verpflichtet die Kundschaft dazu, sämtliche Fremdkosten im Voraus zu bezahlen.","Sie sichert zu, dass der genannte Preis während des Projekts unverändert bleiben muss.","Sie ersetzt das Angebot und macht eine schriftliche Vereinbarung dadurch überflüssig."],"richtig":0,"erklaerung":"Eine Kalkulation hilft, den Kunden **transparent zu informieren** und den **Preis zu rechtfertigen**. Eine Zahlungspflicht im Voraus oder eine Preisgarantie ergibt sich daraus nicht.","quelle":"f43","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q112","thema":"Kalkulation und Liquidität","frage":"Welche Wirkung hat eine Kalkulation auf das Verhältnis zwischen Designer und Kunde?","optionen":["Sie vermeidet Missverständnisse und schafft eine klare Grundlage für die Zusammenarbeit.","Sie überträgt das gesamte wirtschaftliche Risiko des Projekts auf die auftraggebende Seite.","Sie legt fest, dass Änderungswünsche während des laufenden Projekts nicht mehr möglich sind.","Sie regelt, in welchen Fristen offene Rechnungen nach dem Projektende zu begleichen sind."],"richtig":0,"erklaerung":"Die Kalkulation soll **Unklarheiten und Missverständnisse** zwischen Designer und Kunde vermeiden und eine klare **Grundlage für die Zusammenarbeit** schaffen. Zahlungsfristen, die Verteilung des wirtschaftlichen Risikos oder der Ausschluss von Änderungswünschen gehören dagegen nicht zu ihren Zwecken.","quelle":"f43","schwierigkeit":"mittel","wiederholung":true},{"id":"q113","thema":"Kalkulation und Liquidität","frage":"Welchen Nutzen hat eine Kalkulation für die eigenen Abläufe im Betrieb?","optionen":["Arbeitsprozesse werden optimiert, Ressourcen besser geplant und Kosten gesenkt.","Steuerzahlungen werden gestundet, Rücklagen gebildet und Gewinne ausgeschüttet.","Aufträge werden schneller vergeben, Personal aufgebaut und Fremdkosten vermieden.","Honorare werden festgeschrieben, Tagessätze ersetzt und Projektrisiken beseitigt."],"richtig":0,"erklaerung":"Nach innen hilft die Kalkulation, die **Arbeitsprozesse zu optimieren**, effizienter zu arbeiten sowie die **Ressourcen besser zu planen und die Kosten zu senken**. Steuerliche oder personelle Effekte werden nicht genannt.","quelle":"f43","schwierigkeit":"mittel","essential":true,"wiederholung":true},{"id":"q114","thema":"Kalkulation und Liquidität","frage":"Das Wort Kalkulation geht auf den Begriff \"calculatio\" zurück. Welche Bedeutung hat dieser Begriff?","optionen":["\"calculatio\" bedeutet so viel wie Berechnung","\"calculatio\" bedeutet so viel wie Schätzung","\"calculatio\" bedeutet so viel wie Vereinbarung","\"calculatio\" bedeutet so viel wie Bewertung"],"richtig":0,"erklaerung":"**calculatio** wird mit **Berechnung** übersetzt, darauf geht der Begriff Kalkulation zurück. Schätzung, Vereinbarung oder Bewertung geben die Wortbedeutung nicht korrekt wieder.","quelle":"f46","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q115","thema":"Marketing","frage":"Was umfasst Marketing im Kern?","optionen":["Aktivitäten und Strategien, um die Herstellungskosten von Produkten zu senken und die Fertigung zu beschleunigen","Aktivitäten und Strategien, um die Buchführung zu ordnen und den Jahresabschluss des Unternehmens zu erstellen","Aktivitäten und Strategien, um die Bedürfnisse und Wünsche potenzieller Kunden zu identifizieren und zu befriedigen","Aktivitäten und Strategien, um geeignete Mitarbeitende zu finden und dauerhaft an das Unternehmen zu binden"],"richtig":2,"erklaerung":"Marketing umfasst Aktivitäten und Strategien, die dazu dienen, die **Bedürfnisse und Wünsche potenzieller Kunden zu identifizieren und zu befriedigen**. Fertigung, Buchführung und Personalgewinnung gehören zu anderen betrieblichen Funktionen.","quelle":"f12","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q116","thema":"Marketing","frage":"Welches Ziel verfolgt Marketing neben dem bestmöglichen Absatz von Produkten und Dienstleistungen besonders?","optionen":["Die kurzfristige Steigerung des Quartalsgewinns","Die langfristige Zufriedenheit der Kunden","Die dauerhafte Senkung der Produktionskosten","Die schnelle Vergrößerung der Produktpalette"],"richtig":1,"erklaerung":"Marketing beschäftigt sich nicht nur mit dem bestmöglichen Absatz, sondern besonders mit der **langfristigen Kundenzufriedenheit**. Kosten- und Sortimentsfragen sind nicht als Marketingziel genannt.","quelle":"f13, f14","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q117","thema":"Marketing","frage":"Wofür stehen die Kürzel B2C und B2B?","optionen":["brand to customer und brand to business","business to company und business to broker","buyer to customer und buyer to business","business to customer und business to business"],"richtig":3,"erklaerung":"**B2C steht für business to customer**, **B2B für business to business**. Beide Bereiche beschreiben die Relation zwischen Unternehmen und Empfänger.","quelle":"f13","schwierigkeit":"leicht","fachhinweis":{"hinweis":"B2C steht üblicherweise für „Business-to-Consumer“, nicht für „Business-to-Customer“. Die markierte Antwort übernimmt hier den fehlerhaften Folienbegriff.","quelle":"Etablierte Fachterminologie"}},{"id":"q118","thema":"Marketing","frage":"Welcher Marketingbereich analysiert die Bedürfnisse, Einstellungen und Verhaltensweisen der Kunden?","optionen":["Marktforschung","Preisbildung","Markenmanagement","Eventmarketing"],"richtig":0,"erklaerung":"Die **Marktforschung** analysiert Bedürfnisse, Einstellungen und Verhaltensweisen der Kunden, um darauf passende Produkte und Dienstleistungen zu entwickeln.","quelle":"f12","schwierigkeit":"leicht","wiederholung":true},{"id":"q119","thema":"Marketing","frage":"Was beschreibt der Marketingbereich Produktentwicklung?","optionen":["Die Festlegung des Preises für Produkte und Dienstleistungen unter Berücksichtigung der Marktlage","Die Entwicklung von Vertriebsstrategien und Vertriebskanälen für den Verkauf an die Kunden","Die Gestaltung und Entwicklung von Produkten und Dienstleistungen, die den Bedürfnissen der Kunden entsprechen","Die Analyse der Einstellungen und Verhaltensweisen der Kunden als Grundlage für Entscheidungen"],"richtig":2,"erklaerung":"Produktentwicklung meint die **Gestaltung und Entwicklung von Produkten und Dienstleistungen, die den Bedürfnissen der Kunden entsprechen**. Preisfestlegung gehört zur Preisbildung, die Analyse der Kunden zur Marktforschung.","quelle":"f12","schwierigkeit":"leicht"},{"id":"q120","thema":"Marketing","frage":"Was wird bei der Preisbildung berücksichtigt?","optionen":["Die Lagerbestände und die üblichen Lieferzeiten","Die Markenidentität und die Loyalität der Kunden","Die Personalkosten und die geltenden Arbeitszeiten","Die Marktbedingungen und die Wettbewerbsfähigkeit"],"richtig":3,"erklaerung":"Die Preisbildung legt den Preis für Produkte und Dienstleistungen unter Berücksichtigung der **Marktbedingungen und der Wettbewerbsfähigkeit** fest. Markenidentität und Kundenloyalität gehören dagegen zum **Markenmanagement**.","quelle":"f12","schwierigkeit":"leicht"},{"id":"q121","thema":"Marketing","frage":"Welche Kanäle werden dem Online-Marketing zugeordnet?","optionen":["Printanzeigen, Plakatwerbung, Messeauftritte und Produktproben im Handel","Social Media, E-Mail-Marketing, Suchmaschinenoptimierung und Suchmaschinenmarketing","Außendienst, Telefonverkauf, Katalogversand und Verkauf in eigenen Filialen","Sponsoring, Rabattaktionen, Gewinnspiele und Empfehlungen von Bestandskunden"],"richtig":1,"erklaerung":"Online-Marketing ist die Nutzung **digitaler Kanäle wie Social Media, E-Mail-Marketing, SEO und SEM**, um das Bewusstsein für Produkte und Dienstleistungen zu steigern.","quelle":"f10","schwierigkeit":"leicht","wiederholung":true},{"id":"q122","thema":"Marketing","frage":"Wofür steht die Abkürzung SEO?","optionen":["Suchmaschinenmarketing","Suchmaschinenwerbung","Suchmaschinenoptimierung","Suchmaschinenanalyse"],"richtig":2,"erklaerung":"**SEO steht für Suchmaschinenoptimierung**. Davon zu unterscheiden ist SEM, das für Suchmaschinenmarketing steht.","quelle":"f10, f14","schwierigkeit":"leicht","wiederholung":true},{"id":"q123","thema":"Marketing","frage":"Woraus wird bei der Positionierung die klare Botschaft formuliert?","optionen":["Aus dem USP des Unternehmens","Aus der SWOT-Analyse des Marktes","Aus der Preisbildung des Produkts","Aus der Vertriebsstrategie der Marke"],"richtig":0,"erklaerung":"Die Botschaft wird **aus dem USP** formuliert und vermittelt, was das Unternehmen oder die Marke ausmacht und welchen Nutzen es für die Zielgruppe bietet.","quelle":"f09","schwierigkeit":"leicht","wiederholung":true},{"id":"q124","thema":"Marketing","frage":"Welchem Zweck dient die Überprüfung der Positionierung?","optionen":["Um sicherzustellen, dass die Produktionskosten weiter sinken","Um sicherzustellen, dass die Positionierung noch relevant und wirksam ist","Um sicherzustellen, dass die Lieferzeiten eingehalten werden","Um sicherzustellen, dass die Zahl der Mitarbeitenden ausreicht"],"richtig":1,"erklaerung":"Nach dem Definieren der Botschaft und dem Festlegen der Kommunikationskanäle wird die Positionierung überprüft, um sicherzustellen, dass sie noch **relevant und wirksam** ist. Kosten, Lieferzeiten oder Personalbestand sind ausdrücklich **nicht** Gegenstand dieser Überprüfung.","quelle":"f09","schwierigkeit":"leicht","wiederholung":true},{"id":"q125","thema":"Marketing","frage":"Welche beiden Formen der Marktforschung werden unterschieden?","optionen":["Interne und externe Marktforschung","Strategische und operative Marktforschung","Direkte und indirekte Marktforschung","Quantitative und qualitative Marktforschung"],"richtig":3,"erklaerung":"Unterschieden werden die **quantitative und die qualitative Marktforschung**, etwa in Form von Interviews.","quelle":"f14","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q126","thema":"Marketing","frage":"Was umfasst der Marketingbereich Promotion?","optionen":["Die Entwicklung und Umsetzung von Werbe- und Verkaufsförderungsmaßnahmen","Die Entwicklung und Umsetzung von Vertriebsstrategien und Vertriebskanälen","Die Entwicklung und Pflege einer starken Markenidentität und Markenbekanntheit","Die Gestaltung und Entwicklung bedürfnisgerechter Produkte und Dienstleistungen"],"richtig":0,"erklaerung":"Promotion meint die Entwicklung und Umsetzung von **Werbe- und Verkaufsförderungsmaßnahmen**, um das Bewusstsein für Produkte zu steigern. Die übrigen Beschreibungen gehören zu Vertrieb, Markenmanagement und Produktentwicklung.","quelle":"f11, f12","schwierigkeit":"mittel"},{"id":"q127","thema":"Marketing","frage":"Welches Ziel verfolgt das Markenmanagement mit der Entwicklung und Pflege einer starken Markenidentität?","optionen":["Die Wettbewerbsfähigkeit des Preises dauerhaft zu sichern","Das Interesse an Veranstaltungen des Unternehmens zu wecken","Das Vertrauen und die Loyalität der Kunden zu gewinnen","Die Verhaltensweisen der Kunden systematisch zu analysieren"],"richtig":2,"erklaerung":"Markenmanagement entwickelt und pflegt eine starke Markenidentität und -bekanntheit, um **Vertrauen und Loyalität der Kunden** zu gewinnen. Preisfragen gehören zur Preisbildung, Veranstaltungen zum Eventmarketing.","quelle":"f11","schwierigkeit":"mittel","wiederholung":true},{"id":"q128","thema":"Marketing","frage":"Welche Kanäle werden bei der Positionierung genutzt, um die Botschaft an die Zielgruppe zu vermitteln?","optionen":["Ausschließlich digitale Kanäle wie Social Media, SEO oder SEM","Online- und Offline-Kanäle wie Social Media, Anzeigen oder Events","Ausschließlich klassische Kanäle wie Anzeigen, Plakate oder Messen","Vorrangig interne Kanäle wie Intranet, Meetings oder Rundschreiben"],"richtig":1,"erklaerung":"Bei der Positionierung werden passende **Online- und Offline-Kanäle wie Social Media, Anzeigen oder Events** festgelegt. Eine Beschränkung auf nur digitale oder nur klassische Kanäle ist nicht vorgesehen.","quelle":"f09","schwierigkeit":"mittel","wiederholung":true},{"id":"q129","thema":"Marketing","frage":"Welche Elemente gehören zum Branding?","optionen":["Analyse, Preisstrategie, Vertriebskommunikation, Produktdesign und Qualitätsmanagement","Ausschreibung, Markenstrategie, Networking, Eventdesign und Projektmanagement","Zielgruppenanalyse, Empfehlung, Partnerschaft, Markendesign und Kostenmanagement","Analyse, Markenstrategie, Markenkommunikation, Markendesign und Markenmanagement"],"richtig":3,"erklaerung":"Zum Branding zählen **Analyse, Markenstrategie, Markenkommunikation, Markendesign und Markenmanagement**. Empfehlung und Partnerschaft gehören dagegen zur Akquise.","quelle":"f14","schwierigkeit":"mittel","essential":true,"wiederholung":true},{"id":"q130","thema":"Marketing","frage":"Welche Vorgehensweisen zählen zur Akquise?","optionen":["Markenstrategie, Markenkommunikation, Markendesign und Analyse","Quantitative Befragungen, qualitative Interviews und deren Auswertung","Direkte Ansprache, Networking, Empfehlung und Partnerschaften","Rahmenbedingungen, Ausschreibungen und Beratung durch Pitchagenturen"],"richtig":2,"erklaerung":"Zur Akquise gehören **direkte Ansprache, Networking, Empfehlung, Partnerschaften und Online-Marketing**. Die anderen Aufzählungen beschreiben Branding, Marktforschung und den Pitch.","quelle":"f14","schwierigkeit":"mittel","essential":true,"wiederholung":true},{"id":"q131","thema":"Marketing","frage":"Ein Designbüro betreut seine bisherigen Auftraggeber mit festen Ansprechpersonen und jährlichen Treueleistungen, damit sie dem Büro dauerhaft erhalten bleiben. Welchem Marketingbereich entspricht das?","optionen":["Promotion","Kundenbindung","Marktforschung","Vertrieb"],"richtig":1,"erklaerung":"**Kundenbindung** umfasst Strategien zur Bindung von Kunden an das Unternehmen und seine Produkte oder Dienstleistungen. Entscheidend ist hier die dauerhafte Bindung bestehender Kunden, nicht die Werbung oder der Verkaufsvorgang.","quelle":"f11","schwierigkeit":"mittel"},{"id":"q132","thema":"Marketing","frage":"Ein Möbelhersteller veranstaltet eine Showroom-Eröffnung mit Vorführungen, um Interesse an seinen Produkten zu wecken und neue Kunden zu gewinnen. Welchem Marketingbereich entspricht das?","optionen":["Online-Marketing","Markenmanagement","Marktforschung","Eventmarketing"],"richtig":3,"erklaerung":"**Eventmarketing** ist die Organisation und Durchführung von Events, um das Interesse an Produkten und Dienstleistungen zu wecken und Kunden zu gewinnen. Online-Marketing nutzt dagegen digitale Kanäle.","quelle":"f10","schwierigkeit":"mittel"},{"id":"q133","thema":"Projektmanagement","frage":"Wie wird ein Projekt definiert?","optionen":["Als zielgerichtetes, einmaliges Vorhaben aus abgestimmten, gesteuerten Tätigkeiten","Als zielgerichtetes, unbefristetes Vorhaben aus eigenständigen, ungesteuerten Tätigkeiten","Als regelmäßig wiederkehrendes Vorhaben aus standardisierten, routinierten Tätigkeiten","Als einmaliges, ergebnisoffenes Vorhaben aus spontanen, unabgestimmten Tätigkeiten"],"richtig":0,"erklaerung":"Ein Projekt ist ein **zielgerichtetes, einmaliges Vorhaben**, das aus einem Satz von abgestimmten, **gesteuerten Tätigkeiten** besteht. Entscheidend sind damit die Einmaligkeit und die Steuerung der Tätigkeiten.","quelle":"f05, f08","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q134","thema":"Projektmanagement","frage":"Unter Berücksichtigung welcher drei Vorgaben soll in einem Projekt das Ziel erreicht werden?","optionen":["Zeit, Ressourcen und Qualität","Zeit, Ressourcen und Rentabilität","Zeit, Umfang und Qualität","Kosten, Personal und Qualität"],"richtig":0,"erklaerung":"Die Definition nennt als Vorgaben ausdrücklich **Zeit, Ressourcen und Qualität**. Kosten und Personal sind keine eigenständigen Vorgaben, sondern Bestandteile der Ressourcen.","quelle":"f05","schwierigkeit":"leicht","wiederholung":true},{"id":"q135","thema":"Projektmanagement","frage":"Welche Beispiele werden in der Projektdefinition den Ressourcen zugeordnet?","optionen":["Finanzierung bzw. Kosten, Produktions- und Arbeitsbedingungen, Personal und Betriebsmittel","Finanzierung bzw. Umsatz, Absatz- und Marktbedingungen, Kunden und Lieferanten","Terminplanung bzw. Fristen, Prüf- und Abnahmebedingungen, Normen und Standards","Rechtsform bzw. Haftung, Steuer- und Bilanzbedingungen, Eigen- und Fremdkapital"],"richtig":0,"erklaerung":"Als Ressourcen werden **Finanzierung bzw. Kosten, Produktions- und Arbeitsbedingungen sowie Personal und Betriebsmittel** genannt. Kosten sind also ein Unterpunkt der Ressourcen und keine eigene Vorgabe.","quelle":"f05","schwierigkeit":"mittel","wiederholung":true},{"id":"q136","thema":"Projektmanagement","frage":"Welche Tätigkeit zählt zum Projektmanagement?","optionen":["Das Auswerten von Projekten","Das Kalkulieren von Projekten","Das Zertifizieren von Projekten","Das Delegieren von Projekten"],"richtig":0,"erklaerung":"Zum Projektmanagement zählen das Initiieren, Planen, Steuern, Kontrollieren, Abschließen und das **Auswerten** von Projekten. Kalkulieren, Zertifizieren und Delegieren gehören nicht zu diesen sechs Tätigkeiten.","quelle":"f07","schwierigkeit":"leicht","wiederholung":true},{"id":"q137","thema":"Projektmanagement","frage":"Welche Aufzählung gibt die Tätigkeiten des Projektmanagements vollständig wieder?","optionen":["Initiieren, Planen, Steuern, Kontrollieren, Abschließen, Auswerten","Initiieren, Planen, Steuern, Kontrollieren, Abschließen, Archivieren","Analysieren, Planen, Steuern, Überwachen, Abschließen, Auswerten","Initiieren, Organisieren, Steuern, Kontrollieren, Umsetzen, Auswerten"],"richtig":0,"erklaerung":"Als Projektmanagement wird das **Initiieren, Planen, Steuern, Kontrollieren, Abschließen und Auswerten** von Projekten bezeichnet. Begriffe wie Archivieren, Analysieren oder Umsetzen gehören nicht zu dieser sechsteiligen Aufzählung.","quelle":"f07","schwierigkeit":"mittel","wiederholung":true},{"id":"q138","thema":"Projektmanagement","frage":"Welche drei Größen bilden das magische Dreieck des Projektmanagements?","optionen":["Zeit, Kosten und Qualität","Zeit, Kosten und Ressourcen","Zeit, Qualität und Risiko","Kosten, Qualität und Personal"],"richtig":0,"erklaerung":"Das magische Dreieck besteht aus **Zeit, Kosten und Qualität**. Ressourcen, Risiko und Personal sind keine Ecken dieses Dreiecks.","quelle":"f08","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q139","thema":"Projektmanagement","frage":"Welcher Begriff wird im magischen Dreieck ergänzend zu Zeit, Kosten und Qualität genannt?","optionen":["Inhalt","Risiko","Aufwand","Nutzen"],"richtig":0,"erklaerung":"Das magische Dreieck wird als Zeit – Kosten – Qualität ergänzt um den **Inhalt**. Risiko, Aufwand und Nutzen erscheinen dort nicht.","quelle":"f08","schwierigkeit":"mittel","wiederholung":true,"fachhinweis":{"hinweis":"Das magische Dreieck wird je nach Modell als Zeit, Kosten und Leistung beziehungsweise Qualität dargestellt. „Inhalt“ ist eine spezielle Darstellung der Vorlesung, keine allgemein feste vierte Ecke.","quelle":"Einordnung des Projektmanagement-Modells"}},{"id":"q140","thema":"Projektmanagement","frage":"Welche vier Aufgaben beschreiben, wozu Projektmanagement dient?","optionen":["Planen, organisieren, umsetzen und kontrollieren","Planen, kalkulieren, verkaufen und abrechnen","Analysieren, organisieren, dokumentieren und archivieren","Beauftragen, organisieren, umsetzen und bilanzieren"],"richtig":0,"erklaerung":"Auf die Frage nach dem Zweck des Projektmanagements lautet die Antwort **planen, organisieren, umsetzen und kontrollieren**. Kaufmännische Tätigkeiten wie Abrechnen oder Bilanzieren gehören nicht dazu.","quelle":"f08","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q141","thema":"Projektmanagement","frage":"Risikoanalyse, Critical Path Method und Projektstrukturplanung zählen zu den Methoden des Projektmanagements. Welches Verfahren gehört ebenfalls dazu?","optionen":["Deckungsbeitragsrechnung","Break-Even-Analyse","Netzplantechnik","Nutzwertanalyse"],"richtig":2,"erklaerung":"Neben Risikoanalyse, Critical Path Method und Projektstrukturplanung zählt die **Netzplantechnik** zu den vier Methoden des Projektmanagements. Deckungsbeitragsrechnung, Break-Even-Analyse und Nutzwertanalyse gehören nicht zu dieser Aufzählung.","quelle":"f08","schwierigkeit":"leicht","wiederholung":true},{"id":"q142","thema":"Projektmanagement","frage":"Welcher Punkt zählt zu den typischen Fehlern im Projektmanagement?","optionen":["Unklare oder unrealistische Ziele","Detaillierte Zeit- und Kostenplanung","Engmaschige Überwachung und Kontrolle","Standardisierte Begriffe und Verfahren"],"richtig":0,"erklaerung":"Als PM-Fehler gelten **unklare oder unrealistische Ziele**, mangelnde Planung sowie mangelnde Überwachung und Kontrolle. Die Fehler liegen also in **zu wenig** Planung und Kontrolle, nicht in deren sorgfältiger Ausführung.","quelle":"f08","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q143","thema":"Projektmanagement","frage":"Welche Beschreibung gehört zum Projektprozess?","optionen":["Effektive Planung, Überwachung und Anpassung","Ressourcennutzung, Zielerreichung und Risikomanagement","Unklare Ziele, mangelnde Planung und fehlende Kontrolle","Zeit, Kosten und Qualität als zentrale Zielgrößen"],"richtig":0,"erklaerung":"Der Projektprozess wird mit **effektiver Planung, Überwachung und Anpassung** beschrieben. Ressourcennutzung und Risikomanagement gehören zum Projektmanagement, unklare Ziele zu den PM-Fehlern und Zeit/Kosten/Qualität zum magischen Dreieck.","quelle":"f08","schwierigkeit":"mittel","essential":true,"wiederholung":true},{"id":"q144","thema":"Projektmanagement","frage":"Ein Designbüro bearbeitet mehrere Aufträge. Welches Vorhaben erfüllt die Merkmale eines Projekts?","optionen":["Die Gestaltung eines Messeauftritts mit festem Endtermin, Budget und Qualitätsvorgabe","Die monatliche Betreuung der Social-Media-Kanäle eines Kunden mit festem Leistungsumfang","Die laufende Bearbeitung eingehender Druckanfragen im alltäglichen Tagesgeschäft","Die jährlich wiederkehrende Aktualisierung der eigenen Preisliste zum Jahresbeginn"],"richtig":0,"erklaerung":"Nur der Messeauftritt ist ein **zielgerichtetes, einmaliges Vorhaben**, das unter den Vorgaben **Zeit, Ressourcen und Qualität** ein Ziel erreicht. Die übrigen Aufgaben laufen dauerhaft oder wiederholen sich und erfüllen damit das Merkmal der **Einmaligkeit** nicht.","quelle":"f05","schwierigkeit":"mittel","wiederholung":true},{"id":"q145","thema":"Personal, Motivation und Lob","frage":"Boni und Gehaltserhöhungen als Anerkennung für gute Leistungen zählen zu welcher Form von Lob?","optionen":["Materielles Lob","Symbolische Anerkennung","Professionelle Anerkennung","Nonverbales Lob"],"richtig":0,"erklaerung":"Finanzielle Prämien wie Boni oder Gehaltserhöhungen gehören zum **materiellen Lob**, ebenso wie kleine Geschenke, Sachprämien und Teamevents. Abzugrenzen ist die **professionelle Anerkennung**, die Beförderungen und Weiterbildungen umfasst.","quelle":"f01","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q146","thema":"Personal, Motivation und Lob","frage":"Zu welcher Form von Lob zählt eine Beförderung?","optionen":["Symbolische Anerkennung","Materielles Lob","Professionelle Anerkennung","Schriftliches Lob"],"richtig":2,"erklaerung":"Beförderungen zählen zusammen mit Weiterbildungsmöglichkeiten zur **professionellen Anerkennung**. Sie setzen an der beruflichen Entwicklung an, während **materielles Lob** Geschenke, Prämien oder Erlebnisse umfasst und **symbolische Anerkennung** etwa Anerkennungstafeln und Zertifikate.","quelle":"f01","schwierigkeit":"leicht","wiederholung":true},{"id":"q147","thema":"Personal, Motivation und Lob","frage":"Was zählt neben Anerkennungsmauern und -tafeln zur symbolischen Anerkennung?","optionen":["Anerkennungszertifikate für erbrachte Leistungen","Sachprämien für erbrachte Leistungen","Weiterbildungsangebote für erbrachte Leistungen","Bonuszahlungen für erbrachte Leistungen"],"richtig":0,"erklaerung":"Zur **symbolischen Anerkennung** gehören Anerkennungsmauern beziehungsweise Tafeln sowie **Anerkennungszertifikate**. Sachprämien und Bonuszahlungen sind materielles Lob, Weiterbildungsangebote professionelle Anerkennung.","quelle":"f01","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q148","thema":"Personal, Motivation und Lob","frage":"Eine „Wall of Fame“ im Bürogebäude ist ein Beispiel für welche Form von Lob?","optionen":["Professionelle Anerkennung","Symbolische Anerkennung","Öffentliches Lob","Materielles Lob"],"richtig":1,"erklaerung":"Die „Wall of Fame“ ist das Beispiel für Anerkennungsmauern oder Tafeln und zählt damit zur **symbolischen Anerkennung**. **Öffentliches Lob** meint dagegen Anerkennung in Meetings sowie in Newslettern oder Berichten.","quelle":"f01","schwierigkeit":"mittel","wiederholung":true},{"id":"q149","thema":"Personal, Motivation und Lob","frage":"Welche Maßnahme wird dem materiellen Lob zugeordnet?","optionen":["Beförderung in eine höhere Position im Unternehmen","Gemeinsame Erlebnisse, Aktivitäten und Teamevents","Anerkennungszertifikate und Tafeln im Bürogebäude","Applaus und anerkennende Gesten im Teammeeting"],"richtig":1,"erklaerung":"Neben Geschenken und finanziellen Prämien werden **Erlebnisse, Aktivitäten und Teamevents** ausdrücklich als materielles Lob geführt. Zertifikate zählen zur symbolischen Anerkennung, Applaus zum nonverbalen Lob.","quelle":"f01","schwierigkeit":"leicht","wiederholung":true},{"id":"q150","thema":"Personal, Motivation und Lob","frage":"Wie wird direktes Lob beschrieben?","optionen":["Eine beiläufige, subtile Aussage, die eine Leistung nur andeutet","Eine klare, direkte Aussage, die eine bestimmte Leistung anerkennt","Eine schriftliche Notiz, die eine bestimmte Leistung würdigt","Eine Geste ohne Worte, die eine bestimmte Leistung würdigt"],"richtig":1,"erklaerung":"**Direktes Lob** ist eine direkte und klare Aussage, die eine bestimmte Leistung anerkennt. Die beiläufige und subtile Form ist dagegen das **indirekte Lob**; beide gehören zum verbalen Lob.","quelle":"f02","schwierigkeit":"leicht","essential":true,"wiederholung":true},{"id":"q151","thema":"Personal, Motivation und Lob","frage":"Welche Aussage ist ein Beispiel für indirektes Lob?","optionen":["„Großartige Arbeit bei der Präsentation heute, das war richtig stark!“","„Ich habe gehört, dass du heute eine tolle Präsentation gehalten hast.“","„Deine Präsentation heute war fachlich wirklich überzeugend aufgebaut.“","„Vielen Dank für deine klar strukturierte Präsentation von heute früh.“"],"richtig":1,"erklaerung":"Die Formulierung „Ich habe gehört, dass …“ ist eine **beiläufige, subtile Anerkennung** und damit **indirektes Lob**. Die übrigen Aussagen wenden sich unmittelbar an die gelobte Person und benennen deren Leistung klar – das ist **direktes Lob**.","quelle":"f02","schwierigkeit":"mittel","wiederholung":true,"fachhinweis":{"hinweis":"„Ich habe gehört, dass du ...“ wird weiterhin direkt zur gelobten Person gesagt und ist deshalb kein eindeutiges Beispiel für indirektes Lob. Eindeutiger wäre Lob gegenüber einem Dritten, das weitergetragen wird.","quelle":"Didaktische Begriffsklärung"}},{"id":"q152","thema":"Personal, Motivation und Lob","frage":"Ein Dankesbrief für die hervorragende Arbeit an einem Projekt ist ein Beispiel für welche Lobform?","optionen":["Verbales Lob","Öffentliches Lob","Schriftliches Lob","Symbolische Anerkennung"],"richtig":2,"erklaerung":"Notizen und Briefe bilden neben E-Mails die beiden Unterformen des **schriftlichen Lobes**. Verbales Lob wird gesprochen, öffentliches Lob richtet sich an ein Publikum wie ein Meeting oder einen Newsletter.","quelle":"f02","schwierigkeit":"leicht","wiederholung":true},{"id":"q153","thema":"Personal, Motivation und Lob","frage":"Ein Manager lobt einen Mitarbeiter während eines Team-Meetings vor allen Kolleginnen und Kollegen. Um welche Lobform handelt es sich?","optionen":["Öffentliches Lob","Indirektes verbales Lob","Nonverbales Lob","Professionelle Anerkennung"],"richtig":0,"erklaerung":"Lob, das in Team- oder Abteilungsmeetings vor anderen ausgesprochen wird, ist **öffentliches Lob**. Kennzeichnend ist das anwesende Publikum, nicht die Wortwahl oder eine berufliche Weiterentwicklung.","quelle":"f03","schwierigkeit":"mittel","essential":true,"wiederholung":true},{"id":"q154","thema":"Personal, Motivation und Lob","frage":"Welche Kanäle zählen neben Meetings zum öffentlichen Lob?","optionen":["Unternehmensnewsletter, Berichte und die Firmenwebsite","Persönliche Dankesbriefe, Notizen und interne E-Mails","Anerkennungszertifikate, Wandtafeln und Ehrenurkunden","Trophäen, Medaillen und anerkennende Gesten im Alltag"],"richtig":0,"erklaerung":"**Öffentliches Lob** erfolgt in Team- oder Abteilungsmeetings sowie als Anerkennung in **Unternehmensnewslettern, Berichten oder auf der Firmenwebsite**. Dankesbriefe und E-Mails gehören zum schriftlichen Lob, Zertifikate und Anerkennungstafeln zur symbolischen Anerkennung, Trophäen und Gesten zum nonverbalen Lob.","quelle":"f03","schwierigkeit":"mittel","wiederholung":true},{"id":"q155","thema":"Personal, Motivation und Lob","frage":"Ein Lächeln, ein Daumen hoch oder Applaus zählen zu welcher Lobform?","optionen":["Verbales Lob","Öffentliches Lob","Symbolische Anerkennung","Nonverbales Lob"],"richtig":3,"erklaerung":"Anerkennende Gesten wie Lächeln, Daumen hoch oder Applaus sind die Unterform „Gesten“ des **nonverbalen Lobes**. Verbales Lob wird ausgesprochen, symbolische Anerkennung arbeitet mit Tafeln und Zertifikaten.","quelle":"f03","schwierigkeit":"leicht","wiederholung":true},{"id":"q156","thema":"Personal, Motivation und Lob","frage":"Zu welcher Unterform des nonverbalen Lobs zählt eine Mitarbeiter-des-Monats-Auszeichnung?","optionen":["Zu den Gesten, also anerkennenden Bewegungen und Mimiken","Zu den Symbolen, also Trophäen und Medaillen als Anerkennung","Zu den Notizen, also kurzen schriftlichen Anerkennungen","Zu den Meetings, also Anerkennung vor dem versammelten Team"],"richtig":1,"erklaerung":"Nonverbales Lob gliedert sich in Gesten und **Symbole**; Trophäen und Medaillen sind Symbole, und die Mitarbeiter-des-Monats-Auszeichnung ist genau dafür das Beispiel. **Gesten** sind dagegen Lächeln, Daumen hoch oder Applaus.","quelle":"f03","schwierigkeit":"mittel","wiederholung":true,"fachhinweis":{"hinweis":"Eine Mitarbeiter-des-Monats-Auszeichnung muss keine Trophäe oder Medaille sein. Sie kann symbolische beziehungsweise öffentliche Anerkennung sein; die Zuordnung ist zu konkret.","quelle":"Didaktische Begriffsklärung"}},{"id":"q157","thema":"Personal, Motivation und Lob","frage":"Wie wird intrinsische Motivation beschrieben?","optionen":["Sie erfolgt von innen heraus und beruht auf persönlichen Interessen und Vergnügen an der Aufgabe","Sie erfolgt durch äußere Anreize wie Belohnungen und Anerkennung durch andere Personen","Sie erfolgt durch Vorgaben von Vorgesetzten und die Kontrolle der erbrachten Arbeitsleistung","Sie erfolgt durch den Wettbewerb mit Kolleginnen und Kollegen um bessere Arbeitsergebnisse"],"richtig":0,"erklaerung":"**Intrinsische Motivation** erfolgt von innen heraus und basiert auf persönlichen Interessen und dem Vergnügen an der Aufgabe selbst. Von außen wirkende Anreize wie Belohnungen kennzeichnen dagegen die **extrinsische Motivation**.","quelle":"f04","schwierigkeit":"leicht","wiederholung":true},{"id":"q158","thema":"Personal, Motivation und Lob","frage":"Wie wird Lob im Rahmen der extrinsischen Motivation eingeordnet?","optionen":["Als innerer Antrieb, der aus dem Interesse an der Aufgabe stammt","Als externer Anreiz, der von außen auf die Motivation wirkt","Als Ersatz für alle materiellen Belohnungen im Arbeitsalltag","Als Ergebnis der eigenen Zielsetzung der Mitarbeitenden"],"richtig":1,"erklaerung":"Bei der extrinsischen Motivation gilt Lob als **externer Anreiz**, also als Anerkennung von außen neben Belohnungen. Bei der intrinsischen Motivation wirkt Lob hingegen lediglich **verstärkend**.","quelle":"f04","schwierigkeit":"leicht","wiederholung":true},{"id":"q159","thema":"Personal, Motivation und Lob","frage":"Eine Designerin arbeitet an einem Entwurf weiter, weil ihr die gestalterische Aufgabe selbst Freude bereitet. Ihre Vorgesetzte lobt sie zusätzlich dafür. Wie ist die Situation einzuordnen?","optionen":["Intrinsische Motivation; das Lob wirkt hier verstärkend","Extrinsische Motivation; das Lob wirkt hier verstärkend","Intrinsische Motivation; das Lob ist der auslösende äußere Anreiz","Extrinsische Motivation; das Lob ist der auslösende äußere Anreiz"],"richtig":0,"erklaerung":"Da die Motivation aus dem Vergnügen an der Aufgabe selbst entsteht, liegt **intr
